<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Section Scrolling with GSAP</title>
    <style>
      body {
        margin: 0;
        overflow: hidden; /* Prevent default scrollbar */
      }
      [data-scroll-container] {
        height: 100vh; /* Set initial viewport height */
        overflow: hidden; /* Hide scrollbar of the container */
      }
      .container {
        height: auto; /* Adjust based on content */
      }
      .visual,
      .con1,
      .con2,
      .con3,
      .con4 {
        height: 100vh; /* Each section takes full viewport height */
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2em;
        color: white;
        text-align: center;
      }
      .visual {
        background-color: #3498db;
      }
      .con1 {
        background-color: #e74c3c;
      }
      .con2 {
        background-color: #2ecc71;
      }
      .con3 {
        background-color: #f39c12;
      }
      .con4 {
        background-color: #9b59b6;
      }
    </style>
  </head>
  <body>
    <div data-scroll-container>
      <div class="container">
        <div class="visual">Visual Section</div>
        <div class="con1">Content 1</div>
        <div class="con2">Content 2</div>
        <div class="con3">Content 3</div>
        <div class="con4">Content 4</div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollToPlugin.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollToPlugin);

      const scrollContainer = document.querySelector("[data-scroll-container]");
      const container = document.querySelector(".container");
      const sections = gsap.utils.toArray(
        ".visual, .con1, .con2, .con3, .con4"
      );
      const containerHeight = sections.reduce(
        (sum, section) => sum + section.offsetHeight,
        0
      );

      let currentSection = 0;
      let isScrolling = false;

      // Set the height of the scrollable container
      container.style.height = `${containerHeight}px`;
      scrollContainer.style.height = `${window.innerHeight}px`; // Ensure container takes full viewport

      function scrollToSection(index) {
        if (index >= 0 && index < sections.length && !isScrolling) {
          isScrolling = true;
          currentSection = index;
          gsap.to(scrollContainer, {
            duration: 0.8,
            scrollTo: { y: sections[currentSection].offsetTop },
            ease: "power2.inOut",
            onComplete: () => (isScrolling = false),
          });
        }
      }

      window.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault(); // Prevent default scrolling

          const direction = event.deltaY > 0 ? 1 : -1;
          const nextSection = currentSection + direction;

          scrollToSection(nextSection);
        },
        { passive: false }
      );

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          scrollToSection(currentSection + 1);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          scrollToSection(currentSection - 1);
        }
      });

      window.addEventListener("resize", () => {
        const newContainerHeight = sections.reduce(
          (sum, section) => sum + section.offsetHeight,
          0
        );
        container.style.height = `${newContainerHeight}px`;
        scrollContainer.style.height = `${window.innerHeight}px`;

        // Ensure current scroll position is within bounds after resize
        gsap.to(scrollContainer, {
          scrollTo: { y: sections[currentSection]?.offsetTop || 0 },
          duration: 0, // Immediately update position
        });
      });
    </script>
  </body>
</html>
