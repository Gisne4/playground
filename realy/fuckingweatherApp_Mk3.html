<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast App</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;

        background: linear-gradient(
          to bottom right,
          #bcdef5,
          #d9bbf8
        ); /* Updated colors */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem; /* p-4 */
        margin: 0;
      }

      .container {
        background-color: #d1dde44d; /* Updated color */
        border-radius: 1.5rem; /* rounded-3xl */
        box-shadow: 0 20px 25px -10px rgba(250, 242, 242, 0.808),
          0 8px 10px -3px rgba(0, 0, 0, 0.726); /* Updated shadow */
        padding: 2rem; /* p-8 */
        width: 100%;
        max-width: 64rem; /* max-w-4xl */
        display: flex;
        flex-direction: column; /* flex-col */
        gap: 2rem; /* gap-8 */
        transition: all 0.3s ease-in-out; /* transform transition-all duration-300 */
      }

      .container:hover {
        transform: scale(1.01); /* hover:scale-[1.01] */
      }

      @media (min-width: 768px) {
        /* md: */
        .container {
          flex-direction: row; /* md:flex-row */
        }
      }

      .current-weather-section {
        flex: 1; /* flex-1 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem; /* p-6 */
      }

      @media (min-width: 768px) {
        /* md: */
        .current-weather-section {
          border-right: 1px solid #e2e8f0; /* md:border-r md:border-gray-200 */
          padding-right: 2rem; /* md:pr-8 */
        }
      }

      .current-city {
        font-size: 2.25rem; /* text-4xl */
        font-weight: 700; /* font-bold */
        color: #1a202c; /* text-gray-800 */
        margin-bottom: 0.5rem; /* mb-2 */
      }

      .current-temp {
        font-size: 3.75rem; /* text-6xl */
        font-weight: 800; /* font-extrabold */
        color: #2563eb; /* text-blue-600 */
        margin-bottom: 1rem; /* mb-4 */
      }

      .current-weather-icon {
        width: 6rem; /* w-24 */
        height: 6rem; /* h-24 */
        margin-bottom: 0.5rem; /* mb-2 */
      }

      .current-description {
        font-size: 1.25rem; /* text-xl */
        color: #4a5568; /* text-gray-600 */
        text-transform: capitalize; /* capitalize */
        margin-bottom: 1rem; /* mb-4 */
      }

      .current-humidity,
      .current-wind,
      .current-dewpoint {
        font-size: 1.125rem; /* text-lg */
        color: #64748b; /* text-gray-500 */
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .wind-direction-indicator {
        width: 20px;
        height: 20px;
        fill: #64748b; /* Match text color */
        transition: transform 0.3s linear; /* Smooth rotation */
      }

      .forecast-section {
        flex: 1; /* flex-1 */
        display: flex;
        flex-direction: column;
        gap: 1.5rem; /* gap-6 */
        padding: 1.5rem; /* p-6 */
      }

      .forecast-title {
        font-size: 1.875rem; /* text-3xl */
        font-weight: 700; /* font-bold */
        color: #1a202c; /* text-gray-800 */
        text-align: center;
        margin-bottom: 1rem; /* mb-4 */
      }

      .chart-container {
        position: relative;
        height: 16rem; /* h-64 */
        width: 100%;
      }

      .five-day-forecast-list {
        list-style: none;
        padding: 0;
        margin: 0;
        color: #4a5568; /* text-gray-700 */
      }

      .five-day-forecast-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0; /* padding: 8px 0; */
        border-bottom: 1px solid #e2e8f0; /* Tailwind gray-200 */
      }

      .five-day-forecast-list li:last-child {
        border-bottom: none;
      }

      .gothic-day-values {
        display: flex;
        align-items: center;
        gap: 0.5rem; /* gap-8px */
      }

      .gothic-day-values img {
        width: 40px;
        height: 40px;
      }

      .sub {
        font-size: 0.875rem; /* text-sm */
        color: #64748b; /* Tailwind gray-500 */
        width: 70px;
        text-align: right;
      }

      .left-side-weather-section {
        min-width: calc(768px / 2); /* Added new style */
      }

      .input-message-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem; /* gap-4 */
        margin-top: 2rem; /* mt-8 */
        padding: 1rem; /* p-4 */
        background-color: #ffffff; /* bg-white */
        border-radius: 0.75rem; /* rounded-xl */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1); /* shadow-md */
        width: 100%;
      }

      @media (min-width: 768px) {
        .input-message-section {
          width: auto; /* md:w-auto */
          margin-top: 10rem; /* Changed margin-top */
        }
      }

      .input-group {
        display: flex;
        gap: 1rem; /* gap-4 */
        width: 100%;
        justify-content: center;
      }

      .city-input {
        flex-grow: 1; /* flex-grow */
        padding: 0.75rem; /* p-3 */
        border: 1px solid #d1d5db; /* border border-gray-300 */
        border-radius: 0.5rem; /* rounded-lg */
        outline: none; /* focus:outline-none */
        transition: all 0.2s ease-in-out; /* transition duration-200 */
      }

      .city-input:focus {
        border-color: #3b82f6; /* focus:ring-blue-500 */
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); /* focus:ring-2 focus:ring-blue-500 */
      }

      .get-weather-btn {
        padding: 0.75rem 1.5rem; /* px-6 py-3 */
        background-color: #2563eb; /* bg-blue-600 */
        color: #ffffff; /* text-white */
        font-weight: 600; /* font-semibold */
        border-radius: 0.5rem; /* rounded-lg */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1); /* shadow-md */
        cursor: pointer;
        transition: background-color 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out; /* hover:bg-blue-700 transition duration-200 */
        border: none;
        outline: none;
      }

      .get-weather-btn:hover {
        background-color: #1d4ed8; /* hover:bg-blue-700 */
      }

      .get-weather-btn:focus {
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.75); /* focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 */
      }

      .message-box {
        width: 100%;
        text-align: center;
        padding: 0.75rem; /* p-3 */
        border-radius: 0.5rem; /* rounded-lg */
        font-size: 0.875rem; /* text-sm */
      }

      .message-box.hidden {
        display: none;
      }

      .message-box.bg-green-100 {
        background-color: #d1fae5;
      } /* bg-green-100 */
      .message-box.text-green-800 {
        color: #065f46;
      } /* text-green-800 */
      .message-box.bg-red-100 {
        background-color: #fee2e2;
      } /* bg-red-100 */
      .message-box.text-red-800 {
        color: #991b1b;
      } /* text-red-800 */
      .message-box.bg-blue-100 {
        background-color: #dbeafe;
      } /* bg-blue-100 */
      .message-box.text-blue-800 {
        color: #1e40af;
      } /* text-blue-800 */

      /* Custom Tooltip Styles for Chart.js */
      .chartjs-tooltip {
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border-radius: 0.5rem;
        padding: 0.75rem;
        pointer-events: none; /* Important: prevents tooltip from interfering with mouse events */
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
        z-index: 1000; /* Ensure it's above other elements */
        position: absolute; /* Managed by Chart.js external callback */
        transform: translate(
          -50%,
          -100%
        ); /* Default position above the point */
        display: block; /* Ensure it's block for positioning */
        min-width: 120px; /* Give it some minimum width */
        text-align: center;
        font-size: 0.9rem;
      }

      .chartjs-tooltip .tooltip-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .chartjs-tooltip .tooltip-temp-icon {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .chartjs-tooltip img {
        width: 30px;
        height: 30px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center p-4"
  >
    <div class="container">
      <div class="left-side-weather-section">
        <div class="current-weather-section">
          <h2 id="current-city" class="current-city">Loading...</h2>
          <p id="current-temp" class="current-temp">--°C</p>
          <img
            id="current-weather-icon"
            src="https://placehold.co/100x100/e2e8f0/64748b?text=Icon"
            alt="Weather Icon"
            class="current-weather-icon"
          />
          <p id="current-description" class="current-description">
            Loading weather...
          </p>
          <p id="current-humidity" class="current-humidity">Humidity: --%</p>
          <p id="current-wind" class="current-wind">
            Wind: -- m/s
            <svg
              viewBox="0 0 1000 1000"
              enable-background="new 0 0 1000 1000"
              xml:space="preserve"
              class="wind-direction-indicator"
              id="wind-direction"
            >
              <g fill=" rgb(61, 36, 173)">
                <path
                  d="M510.5,749.6c-14.9-9.9-38.1-9.9-53.1,1.7l-262,207.3c-14.9,11.6-21.6,6.6-14.9-11.6L474,48.1c5-16.6,14.9-18.2,21.6,0l325,898.7c6.6,16.6-1.7,23.2-14.9,11.6L510.5,749.6z"
                ></path>
                <path
                  d="M817.2,990c-8.3,0-16.6-3.3-26.5-9.9L497.2,769.5c-5-3.3-18.2-3.3-23.2,0L210.3,976.7c-19.9,16.6-41.5,14.9-51.4,0c-6.6-9.9-8.3-21.6-3.3-38.1L449.1,39.8C459,13.3,477.3,10,483.9,10c6.6,0,24.9,3.3,34.8,29.8l325,898.7c5,14.9,5,28.2-1.7,38.1C837.1,985,827.2,990,817.2,990z M485.6,716.4c14.9,0,28.2,5,39.8,11.6l255.4,182.4L485.6,92.9l-267,814.2l223.9-177.4C454.1,721.4,469,716.4,485.6,716.4z"
                ></path>
              </g>
            </svg>
          </p>
          <p id="current-dewpoint" class="current-dewpoint">Dew Point: --°C</p>
        </div>
        <div class="input-message-section">
          <div class="input-group">
            <input
              type="text"
              id="city-input"
              placeholder="Enter city name"
              class="city-input"
            />
            <button id="get-weather-btn" class="get-weather-btn">
              Get Weather
            </button>
          </div>
          <div id="message-box" class="message-box hidden" role="alert"></div>
        </div>
      </div>

      <div class="forecast-section">
        <h3 class="forecast-title">24-Hour Temperature Forecast</h3>
        <div class="chart-container">
          <canvas id="weatherChart"></canvas>
        </div>

        <h3 class="forecast-title" style="margin-top: 1rem">5-Day Summary</h3>
        <ul id="five-day-forecast" class="five-day-forecast-list">
          <li class="text-center text-gray-500">Loading forecast...</li>
        </ul>
      </div>
    </div>

    <div id="chartjs-tooltip" class="chartjs-tooltip"></div>

    <script>
      // API Key for OpenWeatherMap - Replace with your own key if needed
      const apiKey = "b2f5039982623a84a1ebf1e50af77752";

      // Get DOM elements
      const currentCityElement = document.getElementById("current-city");
      const currentTempElement = document.getElementById("current-temp");
      const currentWeatherIconElement = document.getElementById(
        "current-weather-icon"
      );
      const currentDescriptionElement = document.getElementById(
        "current-description"
      );
      const currentHumidityElement =
        document.getElementById("current-humidity");
      const currentWindElement = document.getElementById("current-wind");
      const currentDewPointElement =
        document.getElementById("current-dewpoint"); // New element for dew point
      const fiveDayForecastList = document.getElementById("five-day-forecast");
      const cityInput = document.getElementById("city-input");
      const getWeatherBtn = document.getElementById("get-weather-btn");
      const messageBox = document.getElementById("message-box");

      let weatherChartInstance = null; // To store the Chart.js instance

      // --- Helper Functions ---
      /**
       * Converts wind degrees to a cardinal direction (e.g., 0-22.5 is N, 22.5-67.5 is NE).
       * @param {number} degrees - Wind direction in degrees (0-360).
       * @returns {string} The cardinal wind direction.
       */
      function getWindDirection(degrees) {
        const directions = [
          "N",
          "NNE",
          "NE",
          "ENE",
          "E",
          "ESE",
          "SE",
          "SSE",
          "S",
          "SSW",
          "SW",
          "WSW",
          "W",
          "WNW",
          "NW",
          "NNW",
        ];
        const index = Math.round(degrees / 22.5) % 16;
        return directions[index];
      }

      /**
       * Updates the rotation of the wind direction SVG arrow.
       * @param {number} degrees - The rotation angle in degrees.
       */
      function updateWindDirection(degrees) {
        const windDirectionSvg = document.getElementById("wind-direction");
        if (windDirectionSvg) {
          windDirectionSvg.style.transform = `rotate(${degrees}deg)`;
          // Add a smooth transition for the rotation
          windDirectionSvg.style.transition = "transform 0.3s linear";
        }
      }

      /**
       * Calculates the dew point temperature using the August-Roche-Magnus formula.
       * @param {number} temp - Temperature in Celsius.
       * @param {number} humidity - Relative humidity in percentage (0-100).
       * @returns {string} The calculated dew point in Celsius, formatted to one decimal place.
       */
      function calculateDewPoint(temp, humidity) {
        const a = 17.27;
        const b = 237.7;
        const alpha = (a * temp) / (b + temp) + Math.log(humidity / 100.0);
        const dewPoint = (b * alpha) / (a - alpha);
        return dewPoint.toFixed(1);
      }

      /**
       * Capitalizes the first letter of a string.
       * @param {string} string - The input string.
       * @returns {string} The string with the first letter capitalized.
       */
      function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
      }

      /**
       * Displays a message to the user in a styled box.
       * @param {string} message - The message to display.
       * @param {'success'|'error'|'info'} type - The type of message (determines styling).
       */
      function displayMessage(message, type) {
        messageBox.textContent = message;
        // Remove all type-specific classes first
        messageBox.classList.remove(
          "hidden",
          "bg-green-100",
          "text-green-800",
          "bg-red-100",
          "text-red-800",
          "bg-blue-100",
          "text-blue-800"
        );
        // Add the correct classes based on type
        if (type === "success") {
          messageBox.classList.add("bg-green-100", "text-green-800");
        } else if (type === "error") {
          messageBox.classList.add("bg-red-100", "text-red-800");
        } else {
          // info
          messageBox.classList.add("bg-blue-100", "text-blue-800");
        }
        messageBox.classList.remove("hidden");
        setTimeout(() => {
          messageBox.classList.add("hidden");
        }, 5000); // Hide message after 5 seconds
      }

      /**
       * Fetches the current weather data for a given latitude and longitude.
       * @param {number} latitude - The latitude.
       * @param {number} longitude - The longitude.
       * @returns {Promise<object|null>} - The current weather data or null if an error occurs.
       */
      async function fetchCurrentWeather(latitude, longitude) {
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          return data;
        } catch (error) {
          console.error("Error fetching current weather:", error);
          displayMessage(
            "Could not fetch current weather data. Please try again.",
            "error"
          );
          return null;
        }
      }

      /**
       * Fetches the 5-day weather forecast data for a given latitude and longitude.
       * @param {number} latitude - The latitude.
       * @param {number} longitude - The longitude.
       * @returns {Promise<object|null>} - The 5-day forecast data or null if an error occurs.
       */
      async function fetchFiveDayForecast(latitude, longitude) {
        const apiUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          return data;
        } catch (error) {
          console.error("Error fetching 5-day forecast:", error);
          displayMessage(
            "Could not fetch 5-day forecast data. Please try again.",
            "error"
          );
          return null;
        }
      }

      /**
       * Displays the current weather data on the UI.
       * @param {object} data - The current weather data.
       */
      function displayCurrentWeather(data) {
        if (!data) {
          currentCityElement.textContent = "N/A";
          currentTempElement.textContent = "--°C";
          currentWeatherIconElement.src =
            "https://placehold.co/100x100/e2e8f0/64748b?text=Icon";
          currentDescriptionElement.textContent = "No data";
          currentHumidityElement.textContent = "Humidity: --%";
          currentWindElement.innerHTML = `Wind: -- m/s <svg
              viewBox="0 0 1000 1000"
              enable-background="new 0 0 1000 1000"
              xml:space="preserve"
              class="wind-direction-indicator"
              id="wind-direction"
            >
              <g fill=" rgb(61, 36, 173)">
                <path
                  d="M510.5,749.6c-14.9-9.9-38.1-9.9-53.1,1.7l-262,207.3c-14.9,11.6-21.6,6.6-14.9-11.6L474,48.1c5-16.6,14.9-18.2,21.6,0l325,898.7c6.6,16.6-1.7,23.2-14.9,11.6L510.5,749.6z"
                ></path>
                <path
                  d="M817.2,990c-8.3,0-16.6-3.3-26.5-9.9L497.2,769.5c-5-3.3-18.2-3.3-23.2,0L210.3,976.7c-19.9,16.6-41.5,14.9-51.4,0c-6.6-9.9-8.3-21.6-3.3-38.1L449.1,39.8C459,13.3,477.3,10,483.9,10c6.6,0,24.9,3.3,34.8,29.8l325,898.7c5,14.9,5,28.2-1.7,38.1C837.1,985,827.2,990,817.2,990z M485.6,716.4c14.9,0,28.2,5,39.8,11.6l255.4,182.4L485.6,92.9l-267,814.2l223.9-177.4C454.1,721.4,469,716.4,485.6,716.4z"
                ></path>
              </g>
            </svg>`;
          currentDewPointElement.textContent = "Dew Point: --°C";
          return;
        }
        currentCityElement.textContent = data.name;
        currentTempElement.textContent = `${Math.round(data.main.temp)}°C`;
        currentWeatherIconElement.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
        currentWeatherIconElement.alt = data.weather[0].description;
        currentDescriptionElement.textContent = data.weather[0].description;
        currentHumidityElement.textContent = `Humidity: ${data.main.humidity}%`;

        // Update wind information
        const windSpeed = data.wind.speed;
        const windDegrees = data.wind.deg;
        const windDirectionText = getWindDirection(windDegrees);
        currentWindElement.innerHTML = `Wind: ${windSpeed} m/s (${windDirectionText}) <svg
              viewBox="0 0 1000 1000"
              enable-background="new 0 0 1000 1000"
              xml:space="preserve"
              class="wind-direction-indicator"
              id="wind-direction"
            >
              <g fill=" rgb(61, 36, 173)">
                <path
                  d="M510.5,749.6c-14.9-9.9-38.1-9.9-53.1,1.7l-262,207.3c-14.9,11.6-21.6,6.6-14.9-11.6L474,48.1c5-16.6,14.9-18.2,21.6,0l325,898.7c6.6,16.6-1.7,23.2-14.9,11.6L510.5,749.6z"
                ></path>
                <path
                  d="M817.2,990c-8.3,0-16.6-3.3-26.5-9.9L497.2,769.5c-5-3.3-18.2-3.3-23.2,0L210.3,976.7c-19.9,16.6-41.5,14.9-51.4,0c-6.6-9.9-8.3-21.6-3.3-38.1L449.1,39.8C459,13.3,477.3,10,483.9,10c6.6,0,24.9,3.3,34.8,29.8l325,898.7c5,14.9,5,28.2-1.7,38.1C837.1,985,827.2,990,817.2,990z M485.6,716.4c14.9,0,28.2,5,39.8,11.6l255.4,182.4L485.6,92.9l-267,814.2l223.9-177.4C454.1,721.4,469,716.4,485.6,716.4z"
                ></path>
              </g>
            </svg>`;
        updateWindDirection(windDegrees); // Rotate the arrow

        // Calculate and display dew point
        const dewPoint = calculateDewPoint(data.main.temp, data.main.humidity);
        currentDewPointElement.textContent = `Dew Point: ${dewPoint}°C`;
      }

      /**
       * Displays the 5-day forecast data and updates the chart.
       * @param {object} fiveDayData - The 5-day forecast data.
       */
      function displayFiveDayForecast(fiveDayData) {
        fiveDayForecastList.innerHTML = ""; // Clear existing list

        if (
          !fiveDayData ||
          !fiveDayData.list ||
          fiveDayData.list.length === 0
        ) {
          fiveDayForecastList.innerHTML =
            '<li class="text-center text-gray-500">No 5-day forecast data available.</li>';
          if (weatherChartInstance) {
            weatherChartInstance.destroy(); // Destroy previous chart
            weatherChartInstance = null;
          }
          return;
        }

        // Prepare data for Chart.js for 24-hour temperature
        const chartLabels = []; // Used for x-axis labels
        const chartDataPoints = []; // Used for actual data points with custom properties

        // Take the first 8 data points for the 24-hour forecast (each point is 3 hours)
        const twentyFourHourData = fiveDayData.list.slice(0, 8);

        twentyFourHourData.forEach((item) => {
          const date = new Date(item.dt * 1000);
          // Format time for labels (e.g., "1 PM", "4 PM")
          const timeLabel = date.toLocaleTimeString("en-US", {
            hour: "numeric",
            hour12: true,
          });
          chartLabels.push(timeLabel); // For x-axis ticks

          // Store temperature, icon, and description in the data point object
          chartDataPoints.push({
            x: timeLabel,
            y: Math.round(item.main.temp),
            icon: item.weather[0].icon,
            description: item.weather[0].description,
          });
        });

        // Chart.js setup
        const ctx = document.getElementById("weatherChart").getContext("2d");

        if (weatherChartInstance) {
          weatherChartInstance.destroy(); // Destroy existing chart instance before creating a new one
        }

        const chartConfig = {
          type: "line",
          data: {
            labels: chartLabels,
            datasets: [
              {
                label: "Temperature (°C)",
                data: chartDataPoints,
                backgroundColor: "rgba(75, 192, 192, 0.4)",
                borderColor: "rgba(75, 192, 192, 1)",
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointBackgroundColor: "rgba(75, 192, 192, 1)",
                pointBorderColor: "#fff",
                pointHoverBackgroundColor: "#fff",
                pointHoverBorderColor: "rgba(75, 192, 192, 1)",
                pointRadius: 5,
                pointHoverRadius: 8,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: false,
                grid: {
                  color: "rgba(200, 200, 200, 0.2)",
                },
                ticks: {
                  color: "#4a5568",
                  callback: function (value) {
                    return value + "°C";
                  },
                },
              },
              x: {
                grid: {
                  display: false,
                },
                ticks: {
                  color: "#4a5568",
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              title: {
                display: false,
              },
              tooltip: {
                mode: "index", // Show tooltips for all datasets at the hovered x-axis position
                intersect: false, // Show tooltip even if not directly over a data point
                position: "nearest", // Position the tooltip near the mouse
                enabled: false, // Disable default Chart.js tooltip
                external: function (context) {
                  // Tooltip Element
                  let tooltipEl = document.getElementById("chartjs-tooltip");

                  // Create element on first render
                  if (!tooltipEl) {
                    tooltipEl = document.createElement("div");
                    tooltipEl.id = "chartjs-tooltip";
                    tooltipEl.className = "chartjs-tooltip"; // Apply custom CSS class
                    document.body.appendChild(tooltipEl);
                  }

                  // Hide if no tooltip
                  const tooltipModel = context.tooltip;
                  if (tooltipModel.opacity === 0) {
                    tooltipEl.style.opacity = 0;
                    return;
                  }

                  // Set caret Position (optional, but good for consistent appearance)
                  tooltipEl.classList.remove("above", "below", "no-transform");
                  if (tooltipModel.yAlign) {
                    tooltipEl.classList.add(tooltipModel.yAlign);
                  } else {
                    tooltipEl.classList.add("no-transform");
                  }

                  // Set Text (HTML content)
                  if (tooltipModel.body) {
                    const dataPoint = tooltipModel.dataPoints[0];
                    const rawData = dataPoint.raw; // This is the {x, y, icon, description} object

                    const time = rawData.x; // Time from the raw data
                    const temp = rawData.y; // Temperature from the raw data
                    const iconCode = rawData.icon;
                    const description = rawData.description;

                    const innerHtml = `
                                        <div class="tooltip-content">
                                            <div style="font-weight: bold;">${time}</div>
                                            <div class="tooltip-temp-icon">
                                                <img src="https://openweathermap.org/img/wn/${iconCode}.png" alt="${description}">
                                                <span>${temp}°C</span>
                                            </div>
                                            <div style="font-size: 0.8em; color: #ccc; text-transform: capitalize;">${description}</div>
                                        </div>
                                    `;

                    tooltipEl.innerHTML = innerHtml;
                  }

                  // Position the tooltip
                  const position = context.chart.canvas.getBoundingClientRect();
                  tooltipEl.style.opacity = 1;
                  tooltipEl.style.left =
                    position.left +
                    window.pageXOffset +
                    tooltipModel.caretX +
                    "px";
                  tooltipEl.style.top =
                    position.top +
                    window.pageYOffset +
                    tooltipModel.caretY +
                    "px";
                  // Adjust transform based on yAlign for better positioning relative to the point
                  if (tooltipModel.yAlign === "top") {
                    tooltipEl.style.transform = "translate(-50%, -100%)";
                  } else if (tooltipModel.yAlign === "bottom") {
                    tooltipEl.style.transform = "translate(-50%, 0%)";
                  } else {
                    // 'center' or 'no-transform'
                    tooltipEl.style.transform = "translate(-50%, -50%)";
                  }
                },
              },
            },
            animation: {
              duration: 1500,
              easing: "easeInOutQuad",
            },
          },
        };

        weatherChartInstance = new Chart(ctx, chartConfig);

        // Group all forecast data by day for accurate min/max calculations and representative icon/description
        const dailyForecastsGrouped = {};
        fiveDayData.list.forEach((item) => {
          const date = new Date(item.dt * 1000);
          const dayKey = date.toLocaleDateString("en-US", {
            year: "numeric",
            month: "numeric",
            day: "numeric",
          });

          if (!dailyForecastsGrouped[dayKey]) {
            dailyForecastsGrouped[dayKey] = [];
          }
          dailyForecastsGrouped[dayKey].push(item);
        });

        const sortedDailyForecastsKeys = Object.keys(
          dailyForecastsGrouped
        ).sort((a, b) => new Date(a).getTime() - new Date(b).getTime());

        sortedDailyForecastsKeys.forEach((dayKey) => {
          let highTemp = -Infinity;
          let lowTemp = Infinity;
          let dayName = "";
          let weatherIcon = "";
          let weatherDescription = "";
          let representativeForecast = null; // To hold the forecast closest to noon

          const forecastsForDay = dailyForecastsGrouped[dayKey];

          forecastsForDay.forEach((forecast) => {
            highTemp = Math.max(highTemp, forecast.main.temp_max);
            lowTemp = Math.min(lowTemp, forecast.main.temp_min);

            const dateObj = new Date(forecast.dt * 1000);
            // Prioritize noon data for icon/description, otherwise take the first one
            if (
              !representativeForecast ||
              (dateObj.getHours() >= 11 && dateObj.getHours() <= 13) // Check for 11 AM, 12 PM, 1 PM
            ) {
              representativeForecast = forecast;
            }
          });

          // Fallback if no specific noon forecast was found (e.g., if day starts after noon)
          if (!representativeForecast && forecastsForDay.length > 0) {
            representativeForecast = forecastsForDay[0];
          }

          if (representativeForecast) {
            const dateObj = new Date(representativeForecast.dt * 1000);
            dayName = dateObj.toLocaleDateString("en-US", {
              weekday: "short",
              month: "short",
              day: "numeric",
            });
            weatherIcon = representativeForecast.weather[0].icon;
            weatherDescription = capitalizeFirstLetter(
              representativeForecast.weather[0].description
            );
          } else {
            // Handle case where there's no forecast data for a day (shouldn't happen with valid API response)
            dayName = new Date(dayKey).toLocaleDateString("en-US", {
              weekday: "short",
              month: "short",
              day: "numeric",
            });
            weatherIcon = "01d"; // Default icon
            weatherDescription = "N/A";
          }

          const listItem = document.createElement("li");
          listItem.innerHTML = `
                        <span>${dayName}</span>
                        <div class="gothic-day-values">
                            <img src="https://openweathermap.org/img/wn/${weatherIcon}.png" alt="${weatherDescription} icon">
                            <span>${Math.round(highTemp)}°C / ${Math.round(
            lowTemp
          )}°C</span>
                        </div>
                        <span class="sub" style="width: 70px; text-align: right;">${weatherDescription}</span>
                    `;
          fiveDayForecastList.appendChild(listItem);
        });
      }

      /**
       * Fetches weather data for a given city name.
       * Uses OpenWeatherMap's Geocoding API to get coordinates first.
       */
      async function getWeatherByCity() {
        const cityName = cityInput.value.trim();
        if (!cityName) {
          displayMessage("Please enter a city name.", "info");
          return;
        }

        displayMessage("Fetching weather data...", "info");
        getWeatherBtn.disabled = true; // Disable button during fetch

        try {
          // Geocoding API to get coordinates from city name
          const geoApiUrl = `https://api.openweathermap.org/geo/1.0/direct?q=${cityName}&limit=1&appid=${apiKey}`;
          const geoResponse = await fetch(geoApiUrl);
          const geoData = await geoResponse.json();

          if (geoData.length === 0) {
            displayMessage(
              `City "${cityName}" not found. Please check the spelling.`,
              "error"
            );
            displayCurrentWeather(null); // Clear current weather display
            displayFiveDayForecast(null); // Clear forecast display
            return;
          }

          const { lat, lon } = geoData[0];

          const [currentWeather, fiveDayForecast] = await Promise.all([
            fetchCurrentWeather(lat, lon),
            fetchFiveDayForecast(lat, lon),
          ]);

          displayCurrentWeather(currentWeather);
          displayFiveDayForecast(fiveDayForecast);
          displayMessage("Weather data updated successfully!", "success");
        } catch (error) {
          console.error("Error getting weather by city:", error);
          displayMessage(
            "An error occurred while fetching weather data.",
            "error"
          );
          displayCurrentWeather(null);
          displayFiveDayForecast(null);
        } finally {
          getWeatherBtn.disabled = false; // Re-enable button
        }
      }

      /**
       * Fetches weather data based on the user's current geolocation.
       */
      function getWeatherByGeolocation() {
        displayMessage("Getting your current location...", "info");
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const { latitude, longitude } = position.coords;
              displayMessage("Location found! Fetching weather...", "info");
              try {
                const [currentWeather, fiveDayForecast] = await Promise.all([
                  fetchCurrentWeather(latitude, longitude),
                  fetchFiveDayForecast(latitude, longitude),
                ]);

                displayCurrentWeather(currentWeather);
                displayFiveDayForecast(fiveDayForecast);
                displayMessage(
                  "Weather data loaded for your location!",
                  "success"
                );
              } catch (error) {
                console.error(
                  "Error fetching weather with geolocation:",
                  error
                );
                displayMessage(
                  "Failed to fetch weather for your location.",
                  "error"
                );
                displayCurrentWeather(null);
                displayFiveDayForecast(null);
              }
            },
            (error) => {
              // Log specific error details if available
              console.error(
                "Geolocation error:",
                error.code,
                error.message,
                error
              );
              let errorMessage = "Unable to retrieve your location.";
              switch (error.code) {
                case error.PERMISSION_DENIED:
                  errorMessage =
                    "Location access denied. Please allow location access or enter a city manually.";
                  break;
                case error.POSITION_UNAVAILABLE:
                  errorMessage = "Location information is unavailable.";
                  break;
                case error.TIMEOUT:
                  errorMessage = "The request to get user location timed out.";
                  break;
              }
              displayMessage(errorMessage, "error");
              // Fallback: try to get weather for a default city (e.g., Seoul)
              cityInput.value = "Seoul";
              getWeatherByCity();
            }
          );
        } else {
          displayMessage(
            "Geolocation is not supported by your browser. Please enter a city manually.",
            "error"
          );
          // Fallback: try to get weather for a default city (e.g., Seoul)
          cityInput.value = "Seoul";
          getWeatherByCity();
        }
      }

      // Event Listeners
      getWeatherBtn.addEventListener("click", getWeatherByCity);
      cityInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
          getWeatherByCity();
        }
      });

      // Initial load: Get weather based on geolocation
      document.addEventListener("DOMContentLoaded", () => {
        getWeatherByGeolocation();
      });
    </script>
  </body>
</html>
