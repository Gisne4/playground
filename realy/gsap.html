<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
      .box1 {
        width: 100px;
        height: 100px;
        background-color: blue;
        margin: auto 20px;
      }
      .container {
        width: 100vw;
        justify-items: center;
      }
      .con1,
      .con2,
      .con3 {
        height: 100vh;
        width: 100vw;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function scroll() {
          gsap.registerPlugin(ScrollTrigger);

          gsap.to(".box1", {
            y: 800,
            x: 1200,
            rotation: 360,
            scale: 5,
            duration: 5,
            transformOrigin: "center center",
            scrollTrigger: {
              trigger: ".con1",
              scroller: window,
              start: "top top",
              end: "bottom top",
              scrub: 0.5,
              pin: true,
            },
          });
        }
        scroll();
      });
    </script>
  </head>
  <body>
    <div class="container">
      <div class="con1">
        <div class="box1"></div>
      </div>
      <div class="con2">
        <div class="box2"></div>
      </div>
      <div class="con3">
        <div class="box3"></div>
      </div>
    </div>
  </body>
</html>
