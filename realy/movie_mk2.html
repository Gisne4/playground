<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search</title>
    <style>
      body {
        font-family: sans-serif;
      }

      .movieCon {
        box-shadow: 1px 1px 5px black;
        width: 530px;
        padding: 20px;
        border-radius: 20px;
        margin-bottom: 30px;
      }
      input[type="text"] {
        padding: 10px;
        margin-right: 10px;
      }
      .searchBtn {
        padding: 8px 15px;
        cursor: pointer;
      }
      #results-container,
      #popular-container,
      #top-rated-container,
      #upcoming-container {
        margin-top: 20px;
        border: 7px solid #81b63bd5;
        padding: 10px;
        width: 500px;
        height: 300px; /* Adjusted height for multiple lists */
        border-radius: 10px;
        overflow-y: auto;
      }
      #results-container::-webkit-scrollbar,
      #popular-container::-webkit-scrollbar,
      #top-rated-container::-webkit-scrollbar,
      #upcoming-container::-webkit-scrollbar {
        width: 0px;
      }
      .list-container {
        display: flex;
        gap: 100px;
      }
      .movie-item {
        margin-bottom: 20px;
        padding: 10px;
        border: 4px solid #6a9b2ad5;
        border-radius: 7px;
        overflow: hidden;
      }
      .movie-item h3 {
        margin-top: 0;
        font-size: 1.2em;
      }
      .movie-item img {
        float: left;
        margin-right: 10px;
        max-width: 100px;
        height: auto;
      }
      .movie-item p {
        margin-bottom: 0;
        font-size: 0.9em;
      }
      .list-title {
        font-size: 1.5em;
        margin-top: 20px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="movieCon">
        <h1>Movie Search</h1>
        <div>
          <input type="text" id="search-query" placeholder="무슨 영화 떙김?" />
          <button onclick="searchMovies()" class="searchBtn">Search</button>
        </div>
        <div id="results-container"></div>
      </div>
      <div class="list-container">
        <div>
          <h2 class="list-title">Popular Movies</h2>
          <div id="popular-container"></div>
        </div>
        <div>
          <h2 class="list-title">Top Rated Movies</h2>
          <div id="top-rated-container"></div>
        </div>
        <div>
          <h2 class="list-title">Upcoming Movies</h2>
          <div id="upcoming-container"></div>
        </div>
      </div>
    </div>
    <script>
      const apiKey = "f710f4911d740be4e790af0963540a1a";
      const searchBaseUrl = "https://api.themoviedb.org/3/search/movie";
      const popularBaseUrl = "https://api.themoviedb.org/3/movie/popular";
      const topRatedBaseUrl = "https://api.themoviedb.org/3/movie/top_rated";
      const upcomingBaseUrl = "https://api.themoviedb.org/3/movie/upcoming";
      const resultsContainer = document.getElementById("results-container");
      const popularContainer = document.getElementById("popular-container");
      const topRatedContainer = document.getElementById("top-rated-container");
      const upcomingContainer = document.getElementById("upcoming-container");
      const imageBaseUrl = "https://image.tmdb.org/t/p/w92";

      async function fetchMovies(url, container) {
        try {
          const response = await fetch(url);
          const data = await response.json();

          container.innerHTML = "";
          console.log(data);

          if (data.results && data.results.length > 0) {
            data.results.forEach((movie) => {
              const movieDiv = document.createElement("div");
              movieDiv.classList.add("movie-item");
              movieDiv.innerHTML = `
                            <h3>${movie.title}</h3>
                            ${
                              movie.poster_path
                                ? `<img src="${imageBaseUrl}${movie.poster_path}" alt="Poster">`
                                : "<p>포스터 없음</p>"
                            }
                            <p>평점: ${movie.vote_average}</p>
                            ${
                              movie.overview
                                ? `<p>줄거리:${movie.overview}</p>`
                                : `<p>아직은 줄거리가 없습니다</p>`
                            }
                            `;
              container.appendChild(movieDiv);
            });
          } else {
            container.innerHTML = "<p>영화를 찾을 수 없습니다.</p>";
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          container.innerHTML = "<p>데이터를 가져오는 중 오류 발생.</p>";
        }
      }

      async function searchMovies() {
        const query = document.getElementById("search-query").value;
        if (!query) {
          resultsContainer.innerHTML =
            "<p>입력 란에 영화 제목을 입력해주세요.</p>";
          return;
        }

        const apiUrl = `${searchBaseUrl}?api_key=${apiKey}&ko-KR&query=${encodeURIComponent(
          query
        )}`;

        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          resultsContainer.innerHTML = "";

          if (data.results && data.results.length > 0) {
            data.results.forEach((e) => {
              const movieDiv = document.createElement("div");
              movieDiv.classList.add("movie-item");
              movieDiv.innerHTML = `
                            <h3>${e.title} (${
                e.release_date ? e.release_date.substring(0, 4) : "미상"
              })</h3>
                            ${
                              e.poster_path
                                ? `<img src="https://image.tmdb.org/t/p/w200${e.poster_path}" alt="Poster">`
                                : "<p>포스터 없음</p>"
                            }
                            <p>${
                              e.overview || "아직 제가 이 영화를 못봤어요!"
                            }</p>
                        `;
              resultsContainer.appendChild(movieDiv);
            });
          } else {
            resultsContainer.innerHTML =
              "<p>No movies found matching your search.</p>";
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          resultsContainer.innerHTML =
            "<p>An error occurred while fetching data.</p>";
        }
      }

      fetchMovies(
        `${popularBaseUrl}?api_key=${apiKey}&language=ko-KR&page=1`,
        popularContainer
      );
      fetchMovies(
        `${topRatedBaseUrl}?api_key=${apiKey}&language=ko-KR&page=1`,
        topRatedContainer
      );
      fetchMovies(
        `${upcomingBaseUrl}?api_key=${apiKey}&language=ko-KR&page=1`,
        upcomingContainer
      );
    </script>
  </body>
</html>
