<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      async function authenticateVitoAI(clientId, clientSecret) {
        const url = "https://openapi.vito.ai/v1/authenticate";

        // Data to be sent in the request body (form-urlencoded)
        const formData = new URLSearchParams();
        formData.append("client_id", clientId);
        formData.append("client_secret", clientSecret);

        try {
          const response = await fetch(url, {
            method: "POST", // Specify the HTTP method
            headers: {
              "Content-Type": "application/x-www-form-urlencoded", // Essential for form data
            },
            body: formData, // The data payload
          });

          // Equivalent to resp.raise_for_status()
          if (!response.ok) {
            const errorText = await response.text(); // Get raw error response
            throw new Error(
              `HTTP error! status: ${response.status}, message: ${errorText}`
            );
          }

          // Equivalent to resp.json()
          const data = await response.json();
          console.log(data); // Log the successful response
          return data; // Return the authentication token/data
        } catch (error) {
          console.error("Authentication failed:", error);
          throw error; // Re-throw to allow further error handling
        }
      }

      // --- How to use this function ---
      // IMPORTANT: Replace with your actual client_id and client_secret
      const YOUR_CLIENT_ID = "FT-FusjqCt_L2ltC8irX";
      const YOUR_CLIENT_SECRET = "w6WX6NlEY1MRG6xb0tqA6LtDlCIZHygpyGFZteA3";

      authenticateVitoAI(YOUR_CLIENT_ID, YOUR_CLIENT_SECRET)
        .then((authData) => {
          // You can now use authData (e.g., access_token) for subsequent API calls
          console.log(
            "Authentication successful! Token:",
            authData.access_token
          );
        })
        .catch((error) => {
          console.error("Failed to authenticate:", error);
        });
    </script>
  </body>
</html>
