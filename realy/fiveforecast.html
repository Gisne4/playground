<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <style>
      :root {
        /* Define your custom properties here */
        --beer-color: #5d4037; /* Example color, replace with your actual color */
        --orange-color: #ff9800; /* Example color, replace with your actual color */
      }

      body {
        font-family: "Montserrat", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden; /* Hide scrollbars for the video background */
      }

      /* Video background */
      #weather_bg_video {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -1;
        background-size: cover;
      }

      /* Openweathermap.... I can't afford any more fxk!!!*/
      .weather-container {
        position: absolute;
        right: 100px;
        top: 40%;
        transform: translateY(-50%); /* Center vertically */
        display: grid;
        gap: 20px;
        z-index: 1; /* Ensure it's above the video */
      }

      .weather-property-container {
        padding: 20px;
        border: 4px solid #e0e0e0;
        border-radius: 8px;
        background-color: var(--beer-color);
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.774);
        color: #fff; /* Text color for readability */
      }

      .current-temp {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .owm-weather-icon {
        width: 50px;
        height: 50px;
        margin-right: 10px;
        fill: #fff; /* Ensure SVG icons are visible */
      }

      .heading {
        font-size: 2em;
        font-weight: bold;
        color: var(--orange-color);
      }

      .bold {
        font-weight: bold;
        color: #bb2323;
        margin-bottom: 10px;
      }

      .weather-items {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .weather-items li {
        margin-bottom: 5px;
        color: #e0e0e0; /* Adjust color for visibility on dark background */
        display: flex;
        align-items: center;
      }

      .weather-items li .symbol {
        margin-right: 5px;
        font-weight: bold;
      }

      .icon-wind-direction {
        width: 20px;
        height: 20px;
        margin-right: 5px;
        fill: rgb(61, 36, 173); /* Ensure SVG is colored */
      }

      .icon-pressure {
        width: 20px;
        height: 20px;
        margin-right: 5px;
        fill: #48484a; /* Ensure SVG is colored */
      }

      /*forecast */
      .forecastCon {
        position: absolute;
        top: 20%;
        left: 10%;
        z-index: 1; /* Ensure it's above the video */
      }

      .foreTitle {
        text-align: center;
        margin-block-end: 25px;
        font-size: 60px;
        font-family: "Cafe24Lovingu", sans-serif; /* Fallback font added */
        font-weight: 200;
        color: rgb(226, 224, 224);
        text-shadow: #504545 1px 1px 5px;
      }

      .horizontal-accordion-container {
        overflow-x: auto; /* Enable horizontal scrolling if needed */
      }

      .day-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        white-space: nowrap;
        color: #e0e0e0;
        text-shadow: #504545 1px 1px 5px;
      }

      .day-list li {
        background-color: #200a0a52;
        border: 3px solid #504545;
        border-radius: 5px;
        font-family: "Montserrat", sans-serif;
        margin-right: 5px;
        cursor: pointer;
        transition: width 0.3s ease-in-out, background-color 0.3s ease-in-out;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        width: 80px;
        position: relative;
        justify-content: center; /* Center content when collapsed */
      }

      .day-list li.active {
        width: 250px; /* Expanded width */
        background-color: var(--beer-color);
      }

      .day-list li span,
      .day-list li .day-values,
      .day-list li .sub {
        opacity: 0; /* Initially hide most content */
        transition: opacity 0.3s ease-in-out 0.1s;
        white-space: nowrap;
      }

      .day-list li span:first-child {
        /* The date */
        opacity: 1; /* Always show the date */
        margin-bottom: 5px;
        position: absolute;
        top: 40%;
        transition: 0.5s;
      }
      .day-list li.active span:first-child {
        position: relative;
        top: auto; /* Reset top to auto when active */
        transform: none; /* Reset transform when active */
        opacity: 1; /* Ensure visibility */
      }
      .day-list li.active span,
      .day-list li.active .day-values,
      .day-list li.active .sub {
        opacity: 1; /* Show content when active */
      }

      .day-list li .day-values {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 5px;
      }

      .day-list li .day-values img {
        max-width: 50px;
        height: auto;
        margin-bottom: 5px;
      }

      .day-list li.active .day-values img {
        max-width: 70px;
        margin-bottom: 10px;
      }

      .day-list li .sub {
        text-align: center !important;
        width: auto !important;
        margin-top: 5px;
      }

      .hour-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin-top: 50px;
        color: #f3f3f3;
        text-shadow: #504545 1px 1px 5px;
      }

      .hour-list::-webkit-scrollbar {
        display: none;
      }

      .hour-list li {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 15px;
        border-right: 3px solid #af959598;
        text-align: center;
      }

      .hour-list li:last-child {
        border-right: none;
      }

      .hour-list li span {
        display: block;
        margin-bottom: 5px;
        font-size: 0.9em;
      }

      .hour-list li span:nth-child(1) {
        font-weight: bold;
      }

      .one-day-values {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 8px;
      }

      .one-day-values img {
        width: 40px;
        height: 40px;
        margin-bottom: 5px;
      }

      .one-day-values span {
        font-size: 1em;
      }

      .hour-list li .des {
        font-size: 0.8em;
        text-align: center;
      }

      /* City selection buttons */
      .city-selection-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 1;
      }

      .city-button {
        padding: 10px 20px;
        background-color: var(--beer-color);
        color: #fff;
        border: 2px solid var(--orange-color);
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .city-button:hover {
        background-color: #7a4a30; /* Darker shade on hover */
        transform: translateY(-2px);
      }

      .city-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <video autoplay loop muted id="weather_bg_video">
      <source src="video/clear.mp4" type="video/mp4" />

    <div class="city-selection-container">
      <button class="city-button" data-city="seoul">Seoul</button>

    <div class="weather-container fade-in-ul">
      <div class="weather-property-container">
        <div>
          <span id="time" style="font-weight: 700">Loading...</span>
          <h2 style="margin-top: 0px" id="location">Loading...</h2>

        <div class="current-temp">
          <svg
            width="50px"

          >
            <path
              d="M110.117 74c0 19.947-16.17 36.117-36.117 36.117-19.947 0-36.117-16.17-36.117-36.117 0-19.948 16.17-36.117 36.117-36.117 19.947 0 36.117 16.169 36.117 36.117"

            <span class="symbol">Dew point:</span>

      </div>
    </div>
    <div class="forecastCon fade-in-ul">
      <h3 class="foreTitle">
        Hellow Please do Not Ask for Me The Further Future!
      </h3>
      <ul class="day-list" id="forecast"></ul>
      <ul class="hour-list" id="easyFore"></ul>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // City coordinates (latitude, longitude)
        const cityCoordinates = {
          seoul: { lat: 37.5665, lon: 126.978 },
          beijing: { lat: 39.9042, lon: 116.4074 },
          Tokyo: { lat: 35.689, lon: 139.6922 },
          washington_dc: { lat: 38.9072, lon: -77.0369 },
        };

        // Use Geolocation class to get location
        function getLocation() {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                getWeather(latitude, longitude);
              },
              (error) => {
                // Centralized error handling for location
                console.error("Error getting location:", error);
                updateWeatherDisplayWithError("Location Error");
              }
            );
          } else {
            updateWeatherDisplayWithError("Geolocation Not Supported");
          }
        }

        // Helper function to update all display elements with an error message
        function updateWeatherDisplayWithError(message) {
          const elements = [
            "time",
            "location",
            "temperature",
            "description",
            "wind",
            "pressure",
            "humidity",
            "dewpoint",
            "visibility",
          ];
          elements.forEach((id) => {
            const element = document.getElementById(id);
            if (element) {
              element.textContent = message;
            }
          });
        }

        async function getWeather(latitude, longitude) {
          const apiKey = "b1b15e88fa797225412429c1c50c122a1"; // This API key is publicly known. For production, use a secure backend.
          const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;

          try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            displayCurrentWeather(data);
            initializeWeatherForecast(latitude, longitude);
          } catch (error) {
            console.error("Error fetching current weather data:", error);
            updateWeatherDisplayWithError("Weather Data Error");
          }
        }

        function displayCurrentWeather(data) {
          document.getElementById("time").textContent =
            new Date().toLocaleTimeString("en-US", {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
          document.getElementById(
            "location"
          ).textContent = `${data.name.toUpperCase()}, ${data.sys.country}`;
          document.getElementById("temperature").textContent = `${Math.round(
            data.main.temp
          )}°C`;
          document.getElementById(
            "description"
          ).textContent = `Feels like ${Math.round(
            data.main.feels_like
          )}°C. ${capitalizeFirstLetter(data.weather[0].description)}.`;

          // Wind details are combined into one element for the description
          document.getElementById("wind").textContent = `${
            data.wind.speed
          }m/s ${getWindDirection(data.wind.deg)}`;
          document.getElementById(
            "pressure"
          ).textContent = `${data.main.pressure}hPa`;
          document.getElementById(
            "humidity"
          ).textContent = `${data.main.humidity}%`;
          document.getElementById(
            "dewpoint"
          ).textContent = `${calculateDewPoint(
            data.main.temp,
            data.main.humidity
          )}°C`;
          document.getElementById("visibility").textContent = `${(
            data.visibility / 1000
          ).toFixed(1)}km`;

          const iconCode = data.weather[0].icon;
          const iconSvgPath = getIconSvgPath(iconCode); // This function needs proper implementation
          document.getElementById("weather-icon-svg").innerHTML = iconSvgPath;

          updateWindDirection(data.wind.deg);
        }

        async function fetchForecast(latitude, longitude) {
          const apiKey = "b1b15e88fa797225412429c1c50c122a1";
          const apiUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;

          try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            return data;
          } catch (error) {
            console.error("Error fetching forecast:", error);
            return null;
          }
        }

        function displayFiveDayForecast(forecastData) {
          const forecastList = document.getElementById("forecast");
          if (!forecastList) {
            console.error("Forecast element not found.");
            return;
          }
          forecastList.innerHTML = "";

          const dailyForecasts = {};
          const forecastIds = []; // To store weather IDs for video background

          forecastData.list.forEach((item) => {
            const date = new Date(item.dt * 1000).toLocaleDateString("en-US", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            });
            if (!dailyForecasts[date]) {
              dailyForecasts[date] = [];
            }
            dailyForecasts[date].push(item);
          });

          // Process only the next 5 days, excluding the current day if its forecast is incomplete
          const sortedDates = Object.keys(dailyForecasts).sort();
          const today = new Date().toLocaleDateString("en-US", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          });

          let daysToDisplay = 0;
          for (const date of sortedDates) {
            if (daysToDisplay >= 5) break;

            // Skip the current day if it's the first in the forecast list but we already have current weather
            // Or if there are less than 8 entries for the current day (meaning it's not a full day's forecast)
            if (date === today && dailyForecasts[date].length < 8) {
              continue;
            }

            let highTemp = -Infinity;
            let lowTemp = Infinity;
            let dayName = "";
            let weatherIcon = "";
            let weatherDescription = "";
            let weatherId = "";

            dailyForecasts[date].forEach((forecast, index) => {
              highTemp = Math.max(highTemp, forecast.main.temp_max);
              lowTemp = Math.min(lowTemp, forecast.main.temp_min);

              if (index === 0 || forecast.dt_txt.includes("12:00:00")) {
                // Prefer midday forecast for icon and description if available
                const dateObj = new Date(forecast.dt * 1000);
                dayName = dateObj.toLocaleDateString("en-US", {
                  weekday: "short",
                  month: "short",
                  day: "numeric",
                });
                weatherIcon = forecast.weather[0].icon.replace(/n/g, "d"); // Normalize icons to 'day' versions
                weatherDescription = capitalizeFirstLetter(
                  forecast.weather[0].description
                );
                weatherId = forecast.weather[0].id;
              }
            });

            if (dayName && weatherIcon) {
              forecastIds.push(weatherId);
              const listItem = document.createElement("li");
              listItem.innerHTML = `
            <span>${dayName}</span>
            <div class="day-values">
              <img src="https://openweathermap.org/img/wn/${weatherIcon}.png" alt="Weather Icon">
              <p>${Math.round(highTemp)} / ${Math.round(lowTemp)}°C</p>
            </div>
            <span class="sub" style="width: 70px; text-align: right;">${weatherDescription}</span>
          `;
              forecastList.appendChild(listItem);
              daysToDisplay++;
            }
          }

          addAccordionFunctionality(forecastList, forecastIds);
        }

        function addAccordionFunctionality(dayList, forecastIds) {
          const dayItems = dayList.querySelectorAll("li");

          dayItems.forEach((item, index) => {
            item.addEventListener("click", function () {
              dayItems.forEach((li) => li.classList.remove("active"));
              this.classList.add("active");
              const weatherVideo = document.getElementById("weather_bg_video");
              if (weatherVideo) {
                weatherVideo.setAttribute(
                  "src",
                  `video/${getForecastVideoCondition(forecastIds[index])}.mp4`
                );
              }
            });
          });

          // Activate the first item on load
          if (dayItems.length > 0) {
            dayItems[0].classList.add("active");
            const weatherVideo = document.getElementById("weather_bg_video");
            if (weatherVideo) {
              weatherVideo.setAttribute(
                "src",
                `video/${getForecastVideoCondition(forecastIds[0])}.mp4`
              );
            }
          }
        }

        // Determine video background based on OpenWeatherMap condition codes
        function getForecastVideoCondition(weatherID) {
          if (weatherID >= 200 && weatherID < 300) return `thunderstorm`;
          if (weatherID >= 300 && weatherID < 400) return `drizzle`;
          if (weatherID >= 500 && weatherID < 600) return `rain`;
          if (weatherID >= 600 && weatherID < 700) return `snow`;
          if (weatherID >= 700 && weatherID < 800) return `mist`; // Covers fog, haze, etc.
          if (weatherID === 800) return `clear`;
          if (weatherID > 800 && weatherID < 900) return `clouds`;
          return `clear`; // Default case if no match
        }

        function displayHourlyForecast(forecastData) {
          const hourlyList = document.getElementById("easyFore");
          if (!hourlyList) {
            console.error("Hourly forecast element not found.");
            return;
          }
          hourlyList.innerHTML = "";

          // Display next 8 entries (24 hours, as each entry is 3 hours)
          for (let i = 0; i < Math.min(forecastData.list.length, 8); i++) {
            const element = forecastData.list[i];
            const dateObj = new Date(element.dt * 1000);
            const timeString = dateObj.toLocaleTimeString("en-US", {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
            const dayString = dateObj.toLocaleDateString("en-US", {
              day: "numeric",
            });

            const listItem = document.createElement("li");
            listItem.innerHTML = `
          <span>${dayString}日</span><span>${timeString}</span>
          <div class="one-day-values">
            <img src="https://openweathermap.org/img/wn/${
              element.weather[0].icon
            }.png" alt="Weather Icon">
            <span>${Math.round(element.main.temp_max)} / ${Math.round(
              element.main.temp_min
            )}°C</span>
          </div>
          <span class="des" style="width: 70px;">${capitalizeFirstLetter(
            element.weather[0].description
          )}</span>
        `;
            hourlyList.appendChild(listItem);
          }
        }

        async function initializeWeatherForecast(latitude, longitude) {
          const forecastData = await fetchForecast(latitude, longitude);
          if (forecastData) {
            displayFiveDayForecast(forecastData);
            displayHourlyForecast(forecastData);
          }
        }

        // --- Helper Functions ---
        function getWindDirection(degrees) {
          const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
          const index = Math.round(degrees / 45) % 8;
          return directions[index];
        }

        function updateWindDirection(degrees) {
          const windDirectionSvg = document.getElementById("wind-direction");
          if (windDirectionSvg) {
            windDirectionSvg.style.transform = `rotate(${degrees}deg)`;
            // Add a smooth transition for the rotation
            windDirectionSvg.style.transition = "transform 0.3s linear";
          }
        }

        function calculateDewPoint(temp, humidity) {
          const a = 17.27;
          const b = 237.7;
          const alpha = (a * temp) / (b + temp) + Math.log(humidity / 100.0);
          const dewPoint = (b * alpha) / (a - alpha);
          return dewPoint.toFixed(1);
        }

        function capitalizeFirstLetter(string) {
          return string.charAt(0).toUpperCase() + string.slice(1);
        }
