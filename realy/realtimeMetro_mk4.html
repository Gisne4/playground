      }

        max-width: 1240px;

        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        position: relative;
      }
      .subway-map-container {
        position: relative;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        overflow: hidden;
      }
      canvas {
        display: block;
        background-color: #f8f8f8;
      }
      .canvas-tooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.8em;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10;
        display: none;
        transform: translate(-50%, -100%);
        top: 0;
        left: 0;
      }
      .subway-info-list {
        width: 100%;
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 15px;
      }
      .subway-line {
        border-bottom: 1px solid #eee;
        padding: 10px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .subway-line:last-child {
        border-bottom: none;
      }
      .line-info {
        flex-grow: 1;
      }
      .line-name {
        font-weight: bold;
        color: #34495e;
        font-size: 1em;
      }
      .arrival-msg {

        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        color: #2e7d32;
        font-size: 0.85em;
        min-width: 100px;
        text-align: center;
      }
      .status-msg {
        background-color: #f0f4c3;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        color: #fbc02d;
        font-size: 0.85em;
        min-width: 100px;
        text-align: center;
      }
      .error-message {
        color: #d32f2f;
        text-align: center;
        padding: 20px;
        background-color: #ffebee;
        border-radius: 5px;
        border: 1px solid #ef9a9a;

      function drawSubwayMapBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f8f8f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw all subway lines
        for (const lineId in allLinePaths) {
          const color = LINE_COLORS[`100${lineId}`];
          if (!color) {
            console.warn(`Color not defined for line ID: 100${lineId}`);
            continue;
          }
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;

          allLinePaths[lineId].forEach((segment) => {
            ctx.beginPath();
            if (segment.length > 0) {
              const startCoords = allStationCoordinates[segment[0]];
              if (startCoords) {
                ctx.moveTo(startCoords.x, startCoords.y);
                for (let i = 1; i < segment.length; i++) {
                  const nextCoords = allStationCoordinates[segment[i]];
                  if (nextCoords) {
                    ctx.lineTo(nextCoords.x, nextCoords.y);
                  }
                }
              }
            }
            ctx.stroke();
          });
        }

        // Draw all stations and their names
        ctx.font = "10px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (const stationName in allStationCoordinates) {
          const coords = allStationCoordinates[stationName];
          // Draw station dot
          ctx.beginPath();
          ctx.arc(coords.x, coords.y, STATION_DOT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = "white"; // White dot
          ctx.fill();

          // Draw border color based on the first line the station belongs to, or a common color
          if (coords.lines && coords.lines.length > 0) {
            ctx.strokeStyle =
              LINE_COLORS[`100${coords.lines[0]}`] || STATION_DOT_COLOR;
          } else {
            ctx.strokeStyle = STATION_DOT_COLOR;
          }
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Draw station name
          ctx.fillStyle = STATION_TEXT_COLOR;
          ctx.fillText(
            stationName,
            coords.x,
            coords.y + STATION_DOT_RADIUS + 8
          );
        }
      }

      function drawTrainIndicators(trainData) {
        drawSubwayMapBackground(); // Redraw map elements first

        trainsOnMap = []; // Clear previous train positions

        trainData.forEach((train) => {
          const { subwayId, arvlCd, statnNm, arvlMsg2, arvlMsg3, trainLineNm } =
            train;

          let stationToMark = arvlMsg3;
          if (!stationToMark || stationToMark === "정보 없음") {
            stationToMark = statnNm;
          }

          const coords = allStationCoordinates[stationToMark];

          if (coords) {
            const radius = 6;
            let color = "gray"; // Default for unknown status
            let borderColor = "white";

            // Use line color for train indicator background if available, otherwise generic
            const lineIndicatorColor =
              LINE_COLORS[subwayId] || "rgba(128, 128, 128, 0.7)";

            if (arvlCd === "1" || arvlCd === "2") {
              // Arrival/Departure
              color = "rgba(255, 0, 0, 0.8)";
              borderColor = "black";
            } else if (arvlCd === "5") {
              // Arrived previous station
              color = "rgba(255, 165, 0, 0.8)";
              borderColor = "black";
            } else if (arvlCd === "99") {
              // In operation (far away)
              color = "rgba(0, 0, 255, 0.6)";
              borderColor = "white";
            } else {
              // Other statuses, default to line color or gray
              color = lineIndicatorColor;
              borderColor = "white";
            }

            ctx.beginPath();
            ctx.arc(coords.x, coords.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            trainsOnMap.push({
              x: coords.x,
              y: coords.y,
              radius: radius,
              tooltipText: `${trainLineNm} (${
                lineMap[subwayId] || subwayId
              }) - ${arvlMsg2} (${arvlMsg3})`,

          } else {
            console.warn(
              `Coordinates not found for station: ${stationToMark} (Line ID: ${subwayId}). Train will not be displayed on map.`
            );
          }
        });
      }

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        let hoveredTrain = null;
        for (const train of trainsOnMap) {
          const distance = Math.sqrt(
            (mouseX - train.x) ** 2 + (mouseY - train.y) ** 2
          );
          if (distance < train.radius) {
            hoveredTrain = train;
            break;
          }
        }

        if (hoveredTrain) {
          canvasTooltip.style.display = "block";
          canvasTooltip.style.left = `${hoveredTrain.x}px`;
          canvasTooltip.style.top = `${hoveredTrain.y - 10}px`;
          canvasTooltip.textContent = hoveredTrain.tooltipText;
        } else {
          canvasTooltip.style.display = "none";
        }
      });

      canvas.addEventListener("mouseout", () => {
        canvasTooltip.style.display = "none";
      });

      async function fetchSubwayData() {
        try {
          document.getElementById("subwayInfo").innerHTML =
            '<p class="loading-message">실시간 지하철 도착 정보를 불러오는 중...</p>';

          const fetchPromises = STATION_NAMES.map((stationName) => {
            const endpoint = `http://swopenapi.seoul.go.kr/api/subway/${API_KEY}/xml/realtimeStationArrival/0/20/${encodeURIComponent(
              stationName
            )}`;
            return fetch(endpoint)
              .then((response) => {
                if (!response.ok) {
                  return response.text().then((text) => {
                    throw new Error(
                      `HTTP error! Status: ${
                        response.status
                      } for ${stationName}. API message: ${text.substring(
                        0,
                        100
                      )}...`
                    );
                  });
                }
                return response.text();
              })
              .catch((error) => {
                console.error(`Error fetching data for ${stationName}:`, error);
                // Return an empty array or a specific error object for this station
                return null; // Will filter out nulls later
              });
          });

          const allXmlResponses = await Promise.all(fetchPromises);
          let allParsedTrainData = [];

          allXmlResponses.forEach((xmlText) => {
            if (xmlText) {
              // Only process successful responses
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");

              const resultCode =
                xmlDoc.getElementsByTagName("code")[0]?.textContent;
              const developerMessage =
                xmlDoc.getElementsByTagName("developerMessage")[0]?.textContent;

              if (resultCode && resultCode !== "INFO-000") {
                console.warn(
                  `API error for one station: ${resultCode}, ${developerMessage}`
                );
                // Continue to next XML if one station has an error, don't stop everything
                return;
              }

              const rows = xmlDoc.getElementsByTagName("row");
              for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const train = {
                  trainLineNm:
                    row.getElementsByTagName("trainLineNm")[0]?.textContent ||
                    "정보 없음",
                  arvlMsg2:
                    row.getElementsByTagName("arvlMsg2")[0]?.textContent ||
                    "정보 없음",
                  arvlMsg3:
                    row.getElementsByTagName("arvlMsg3")[0]?.textContent || "",
                  subwayId:
                    row.getElementsByTagName("subwayId")[0]?.textContent,
                  btrainNo:
                    row.getElementsByTagName("btrainNo")[0]?.textContent,
                  recptnDt:
                    row.getElementsByTagName("recptnDt")[0]?.textContent,
                  updnLine:
                    row.getElementsByTagName("updnLine")[0]?.textContent,
                  statnNm: row.getElementsByTagName("statnNm")[0]?.textContent,
                  arvlCd: row.getElementsByTagName("arvlCd")[0]?.textContent,
                  barvlDt:
                    row.getElementsByTagName("barvlDt")[0]?.textContent ||
                    "N/A", // Added barvlDt
                };
                allParsedTrainData.push(train);
              }
            }
          });

          parseAndDisplaySubwayInfo(allParsedTrainData);
        } catch (error) {
          console.error("Error fetching subway data:", error);
          document.getElementById("subwayInfo").innerHTML = `
                    <p class="error-message">데이터를 불러오는 데 실패했습니다. <br>네트워크 연결을 확인하거나 API 키를 확인해 주세요.<br>오류: ${error.message}</p>
                `;
        }
      }

      const lineMap = {
        1001: "1호선",
        1002: "2호선",
        1003: "3호선",
        1004: "4호선",
        1005: "5호선",
        1006: "6호선",
        1007: "7호선",
        1008: "8호선",
        1009: "9호선",
        1063: "경의중앙선",
        1065: "공항철도",
        1075: "분당선",
        1077: "신분당선",
      };

      function parseAndDisplaySubwayInfo(parsedTrainData) {
        const subwayInfoDiv = document.getElementById("subwayInfo");
        subwayInfoDiv.innerHTML = ""; // Clear previous info

        if (parsedTrainData.length === 0) {
          subwayInfoDiv.innerHTML =
            '<p class="loading-message">현재 도착 정보가 없습니다 (모든 역에 대한 정보 없음).</p>';
          drawSubwayMapBackground();
          return;
        }

        // Sort data, e.g., by subwayId then by station name for better readability
        parsedTrainData.sort((a, b) => {
          if (a.subwayId !== b.subwayId) {
            return a.subwayId.localeCompare(b.subwayId);
          }
          return a.statnNm.localeCompare(b.statnNm);
        });

        // Keep track of added train data to avoid duplicates (e.g., if multiple stations report the same train)
        const uniqueTrains = new Map(); // Key: btrainNo + subwayId + arvlMsg2 + arvlMsg3
        parsedTrainData.forEach((train) => {
          const uniqueKey = `${train.btrainNo}-${train.subwayId}-${train.arvlMsg2}-${train.arvlMsg3}`;
          if (!uniqueTrains.has(uniqueKey)) {
            uniqueTrains.set(uniqueKey, train);

            let lineNameDisplay = train.trainLineNm;
            if (lineMap[train.subwayId]) {
              lineNameDisplay = `${lineMap[train.subwayId]} (${
                train.trainLineNm
              })`;
            }

            const subwayLineDiv = document.createElement("div");
            subwayLineDiv.classList.add("subway-line");
            subwayLineDiv.innerHTML = `
                        <div class="line-info">
                            <div class="line-name">${lineNameDisplay}</div>
                            <div>역: ${train.statnNm}</div>
                        </div>
                        <div class="${
                          train.arvlMsg2.includes("도착")
                            ? "arrival-msg"
                            : "status-msg"
                        }">
                            ${train.arvlMsg2}
                            ${
                              train.barvlDt !== "N/A"
                                ? ` (약 ${train.barvlDt}초)`
                                : ""
                            }
                        </div>
                    `;
            subwayInfoDiv.appendChild(subwayLineDiv);
          }
        });

        drawTrainIndicators(Array.from(uniqueTrains.values())); // Pass unique trains to draw
      }
    </script>
  </body>
