<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyperspeed Effect</title>
    <style>
      /* Basic styling for the body to ensure full-screen display */
      body {
        margin: 0;
        overflow: hidden;
        background-color: black; /* Set background to black to match the effect */
      }
      /* Container for the Three.js canvas */
      #lights {
        width: 100%;
        height: 100vh; /* Use 100vh to ensure it fills the viewport height */
        overflow: hidden;
        position: absolute;
        top: 0;
        left: 0;
      }
      @import url("https://fonts.googleapis.com/css?family=Work+Sans:800");
      .skid {
        color: rgb(255, 0, 170);
        font-family: "Work Sans", sans-serif;
        font-weight: 800;
        font-size: calc(50vw / var(--char-total));
        transform: skewY(-5deg) translateY(0%);
        -webkit-animation: slide-down 2.5s cubic-bezier(0.7, 0, 0.2, 1)
          alternate both infinite;
        animation: slide-down 2.5s cubic-bezier(0.7, 0, 0.2, 1) alternate both
          infinite;
        margin-left: 100px;
      }
      @-webkit-keyframes slide-down {
        100% {
          transform: skewY(-5deg) translateY(50%);
        }
      }
      @keyframes slide-down {
        100% {
          transform: skewY(-5deg) translateY(50%);
        }
      }
      .skid .word,
      .skid .char {
        display: inline-block;
        position: relative;
      }
      .skid .word:before,
      .skid .word:after,
      .skid .char:before,
      .skid .char:after {
        content: attr(data-char);
        visibility: visible;
        color: #f8c43a;
        position: absolute;
        left: 0;
        display: block;
        top: auto;
        bottom: 0;
        z-index: 3;
        -webkit-animation: expand 2.5s cubic-bezier(0.6, 0, 0.15, 1) alternate
          both infinite;
        animation: expand 2.5s cubic-bezier(0.6, 0, 0.15, 1) alternate both
          infinite;
      }
      @-webkit-keyframes expand {
        0%,
        20% {
          transform: translateY(0%);
        }
      }
      @keyframes expand {
        0%,
        20% {
          transform: translateY(0%);
        }
      }
      .skid .word:before,
      .skid .word:after {
        content: attr(data-word);
        z-index: 2;
      }
      .skid .word:before {
        color: #a61bc9;
        transform: translateY(-45%);
        -webkit-clip-path: polygon(0 0, 100% 0, 100% 60%, 0 60%);
        clip-path: polygon(0 0, 100% 0, 100% 60%, 0 60%);
      }
      .skid .word:after {
        color: #6233e4;
        transform: translateY(-75%);
        -webkit-clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      }
      .skid .char:before {
        color: #4aacfd;
        transform: translateY(-95%);
        -webkit-clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      }
      .skid .char:after {
        color: #18f7ff;
        transform: translateY(-105%);
        -webkit-clip-path: polygon(0 0, 100% 0, 100% 25%, 0 25%);
        clip-path: polygon(0 0, 100% 0, 100% 25%, 0 25%);
      }
      /* Styling for the canvas element itself */
      canvas {
        display: block; /* Removes extra space below the canvas element */
        width: 100%;
        height: 100%;
      }
    </style>
    <!-- Three.js CDN for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Postprocessing.js CDN for visual effects like Bloom and SMAA -->
    <!-- This version exposes the necessary classes globally under the POSTPROCESSING namespace -->
    <script src="https://unpkg.com/postprocessing@6.29.3/build/postprocessing.js"></script>
  </head>
  <body>
    <!-- The div where the Three.js canvas will be injected -->
    <div id="lights"></div>
    <div
      class="skid words chars splitting"
      data-splitting="chars"
      style="--word-total: 4; --char-total: 18"
    >
      <span class="word" data-word="CLICK" style="--word-index: 0"
        ><span class="char" data-char="C" style="--char-index: 1">C</span
        ><span class="char" data-char="L" style="--char-index: 2">L</span
        ><span class="char" data-char="I" style="--char-index: 3">I</span
        ><span class="char" data-char="C" style="--char-index: 4">C</span
        ><span class="char" data-char="K" style="--char-index: 5">K</span></span
      >
      <span class="whitespace"> </span>

      <span class="word" data-word="TO" style="--word-index: 1"
        ><span class="char" data-char="T" style="--char-index: 6">T</span
        ><span class="char" data-char="O" style="--char-index: 7">O</span>
      </span>
      <span class="whitespace"> </span>

      <span class="word" data-word="SPEED" style="--word-index: 2"
        ><span class="char" data-char="S" style="--char-index: 8">S</span
        ><span class="char" data-char="P" style="--char-index: 9">P</span
        ><span class="char" data-char="E" style="--char-index: 10">E</span
        ><span class="char" data-char="E" style="--char-index: 11">E</span
        ><span class="char" data-char="D" style="--char-index: 12">D</span>
      </span>
    </div>
    <script type="module">
      // Destructure necessary classes from the global POSTPROCESSING object
      const {
        BloomEffect,
        EffectComposer,
        EffectPass,
        RenderPass,
        SMAAEffect,
        SMAAPreset,
      } = POSTPROCESSING;

      // --- Utility Functions ---

      /**
       * Normalizes a sine wave value to be between 0 and 1.
       * @param {number} val - The input value for the sine function.
       * @returns {number} The normalized sine wave value.
       */
      let nsin = (val) => Math.sin(val) * 0.5 + 0.5;

      /**
       * Generates a random number within a specified range or up to a base value.
       * @param {number | number[]} base - If an array [min, max], returns a random number between min and max. If a number, returns a random number between 0 and base.
       * @returns {number} A random number.
       */
      const random = (base) => {
        if (Array.isArray(base))
          return Math.random() * (base[1] - base[0]) + base[0];
        return Math.random() * base;
      };

      /**
       * Picks a random element from an array.
       * @param {Array<any>} arr - The array to pick from.
       * @returns {any} A random element from the array.
       */
      const pickRandom = (arr) => {
        if (Array.isArray(arr))
          return arr[Math.floor(Math.random() * arr.length)];
        return arr;
      };

      /**
       * Linearly interpolates between a current value and a target value.
       * @param {number} current - The current value.
       * @param {number} target - The target value.
       * @param {number} speed - The interpolation speed (0.0 to 1.0).
       * @param {number} limit - The minimum change required before interpolating.
       * @returns {number} The interpolated change.
       */
      function lerp(current, target, speed = 0.1, limit = 0.001) {
        let change = (target - current) * speed;
        if (Math.abs(change) < limit) {
          change = target - current;
        }
        return change;
      }

      /**
       * Resizes the WebGL renderer and composer to match the display size of the canvas.
       * @param {THREE.WebGLRenderer} renderer - The Three.js WebGL renderer.
       * @param {function} setSize - A callback function to set the composer's size.
       * @returns {boolean} True if the renderer was resized, false otherwise.
       */
      function resizeRendererToDisplaySize(renderer, setSize) {
        const canvas = renderer.domElement;
        const pixelRatio = window.devicePixelRatio;
        const width = (canvas.clientWidth * pixelRatio) | 0;
        const height = (canvas.clientHeight * pixelRatio) | 0;
        const needResize = canvas.width !== width || canvas.height !== height;
        if (needResize) {
          renderer.setSize(width, height, false);
          setSize(width, height, false); // Update composer size as well
        }
        return needResize;
      }

      // --- Distortion Definitions (Uniforms and GLSL Code) ---

      const mountainUniforms = {
        uFreq: { value: new THREE.Vector3(3, 6, 10) },
        uAmp: { value: new THREE.Vector3(30, 30, 20) },
      };

      const xyUniforms = {
        uFreq: { value: new THREE.Vector2(5, 2) },
        uAmp: { value: new THREE.Vector2(25, 15) },
      };

      const LongRaceUniforms = {
        uFreq: { value: new THREE.Vector2(2, 3) },
        uAmp: { value: new THREE.Vector2(35, 10) },
      };

      const turbulentUniforms = {
        uFreq: { value: new THREE.Vector4(4, 8, 8, 1) },
        uAmp: { value: new THREE.Vector4(25, 5, 10, 10) },
      };

      const deepUniforms = {
        uFreq: { value: new THREE.Vector2(4, 8) },
        uAmp: { value: new THREE.Vector2(10, 20) },
        uPowY: { value: new THREE.Vector2(20, 2) },
      };

      const distortion_uniforms = {
        uDistortionX: { value: new THREE.Vector2(80, 3) },
        uDistortionY: { value: new THREE.Vector2(-40, 2.5) },
      };

      // Default distortion vertex shader (used if no specific distortion is chosen)
      const distortion_vertex = `
            #define PI 3.14159265358979
            uniform vec2 uDistortionX;
            uniform vec2 uDistortionY;
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            vec3 getDistortion(float progress){
                progress = clamp(progress, 0., 1.);
                float xAmp = uDistortionX.r;
                float xFreq = uDistortionX.g;
                float yAmp = uDistortionY.r;
                float yFreq = uDistortionY.g;
                return vec3(
                    xAmp * nsin(progress * PI * xFreq - PI / 2.),
                    yAmp * nsin(progress * PI * yFreq - PI / 2.),
                    0.
                );
            }
        `;

      // Distortion configurations for various effects
      const distortions = {
        mountainDistortion: {
          uniforms: mountainUniforms,
          getDistortion: `
                    uniform vec3 uAmp;
                    uniform vec3 uFreq;
                    #define PI 3.14159265358979
                    float nsin(float val){
                        return sin(val) * 0.5 + 0.5;
                    }
                    vec3 getDistortion(float progress){
                        float movementProgressFix = 0.02;
                        return vec3(
                            cos(progress * PI * uFreq.x + uTime) * uAmp.x - cos(movementProgressFix * PI * uFreq.x + uTime) * uAmp.x,
                            nsin(progress * PI * uFreq.y + uTime) * uAmp.y - nsin(movementProgressFix * PI * uFreq.y + uTime) * uAmp.y,
                            nsin(progress * PI * uFreq.z + uTime) * uAmp.z - nsin(movementProgressFix * PI * uFreq.z + uTime) * uAmp.z
                        );
                    }
                `,
          getJS: (progress, time) => {
            let movementProgressFix = 0.02;
            let uFreq = mountainUniforms.uFreq.value;
            let uAmp = mountainUniforms.uAmp.value;
            let distortion = new THREE.Vector3(
              Math.cos(progress * Math.PI * uFreq.x + time) * uAmp.x -
                Math.cos(movementProgressFix * Math.PI * uFreq.x + time) *
                  uAmp.x,
              nsin(progress * Math.PI * uFreq.y + time) * uAmp.y -
                nsin(movementProgressFix * Math.PI * uFreq.y + time) * uAmp.y,
              nsin(progress * Math.PI * uFreq.z + time) * uAmp.z -
                nsin(movementProgressFix * Math.PI * uFreq.z + time) * uAmp.z
            );
            let lookAtAmp = new THREE.Vector3(2, 2, 2);
            let lookAtOffset = new THREE.Vector3(0, 0, -5);
            return distortion.multiply(lookAtAmp).add(lookAtOffset);
          },
        },
        xyDistortion: {
          uniforms: xyUniforms,
          getDistortion: `
                    uniform vec2 uFreq;
                    uniform vec2 uAmp;
                    #define PI 3.14159265358979
                    vec3 getDistortion(float progress){
                        float movementProgressFix = 0.02;
                        return vec3(
                            cos(progress * PI * uFreq.x + uTime) * uAmp.x - cos(movementProgressFix * PI * uFreq.x + uTime) * uAmp.x,
                            sin(progress * PI * uFreq.y + PI/2. + uTime) * uAmp.y - sin(movementProgressFix * PI * uFreq.y + PI/2. + uTime) * uAmp.y,
                            0.
                        );
                    }
                `,
          getJS: (progress, time) => {
            let movementProgressFix = 0.02;
            let uFreq = xyUniforms.uFreq.value;
            let uAmp = xyUniforms.uAmp.value;
            let distortion = new THREE.Vector3(
              Math.cos(progress * Math.PI * uFreq.x + time) * uAmp.x -
                Math.cos(movementProgressFix * Math.PI * uFreq.x + time) *
                  uAmp.x,
              Math.sin(progress * Math.PI * uFreq.y + time + Math.PI / 2) *
                uAmp.y -
                Math.sin(
                  movementProgressFix * Math.PI * uFreq.y + time + Math.PI / 2
                ) *
                  uAmp.y,
              0
            );
            let lookAtAmp = new THREE.Vector3(2, 0.4, 1);
            let lookAtOffset = new THREE.Vector3(0, 0, -3);
            return distortion.multiply(lookAtAmp).add(lookAtOffset);
          },
        },
        LongRaceDistortion: {
          uniforms: LongRaceUniforms,
          getDistortion: `
                    uniform vec2 uFreq;
                    uniform vec2 uAmp;
                    #define PI 3.14159265358979
                    vec3 getDistortion(float progress){
                        float camProgress = 0.0125;
                        return vec3(
                            sin(progress * PI * uFreq.x + uTime) * uAmp.x - sin(camProgress * PI * uFreq.x + uTime) * uAmp.x,
                            sin(progress * PI * uFreq.y + uTime) * uAmp.y - sin(camProgress * PI * uFreq.y + uTime) * uAmp.y,
                            0.
                        );
                    }
                `,
          getJS: (progress, time) => {
            let camProgress = 0.0125;
            let uFreq = LongRaceUniforms.uFreq.value;
            let uAmp = LongRaceUniforms.uAmp.value;
            let distortion = new THREE.Vector3(
              Math.sin(progress * Math.PI * uFreq.x + time) * uAmp.x -
                Math.sin(camProgress * Math.PI * uFreq.x + time) * uAmp.x,
              Math.sin(progress * Math.PI * uFreq.y + time) * uAmp.y -
                Math.sin(camProgress * Math.PI * uFreq.y + time) * uAmp.y,
              0
            );
            let lookAtAmp = new THREE.Vector3(1, 1, 0);
            let lookAtOffset = new THREE.Vector3(0, 0, -5);
            return distortion.multiply(lookAtAmp).add(lookAtOffset);
          },
        },
        turbulentDistortion: {
          uniforms: turbulentUniforms,
          getDistortion: `
                    uniform vec4 uFreq;
                    uniform vec4 uAmp;
                    float nsin(float val){
                        return sin(val) * 0.5 + 0.5;
                    }
                    #define PI 3.14159265358979
                    float getDistortionX(float progress){
                        return (
                            cos(PI * progress * uFreq.r + uTime) * uAmp.r +
                            pow(cos(PI * progress * uFreq.g + uTime * (uFreq.g / uFreq.r)), 2. ) * uAmp.g
                        );
                    }
                    float getDistortionY(float progress){
                        return (
                            -nsin(PI * progress * uFreq.b + uTime) * uAmp.b +
                            -pow(nsin(PI * progress * uFreq.a + uTime / (uFreq.b / uFreq.a)), 5.) * uAmp.a
                        );
                    }
                    vec3 getDistortion(float progress){
                        return vec3(
                            getDistortionX(progress) - getDistortionX(0.0125),
                            getDistortionY(progress) - getDistortionY(0.0125),
                            0.
                        );
                    }
                `,
          getJS: (progress, time) => {
            const uFreq = turbulentUniforms.uFreq.value;
            const uAmp = turbulentUniforms.uAmp.value;

            const getX = (p) =>
              Math.cos(Math.PI * p * uFreq.x + time) * uAmp.x +
              Math.pow(
                Math.cos(Math.PI * p * uFreq.y + time * (uFreq.y / uFreq.x)),
                2
              ) *
                uAmp.y;

            const getY = (p) =>
              -nsin(Math.PI * p * uFreq.z + time) * uAmp.z -
              Math.pow(
                nsin(Math.PI * p * uFreq.w + time / (uFreq.z / uFreq.w)),
                5
              ) *
                uAmp.w;

            let distortion = new THREE.Vector3(
              getX(progress) - getX(progress + 0.007),
              getY(progress) - getY(progress + 0.007),
              0
            );
            let lookAtAmp = new THREE.Vector3(-2, -5, 0);
            let lookAtOffset = new THREE.Vector3(0, 0, -10);
            return distortion.multiply(lookAtAmp).add(lookAtOffset);
          },
        },
        turbulentDistortionStill: {
          uniforms: turbulentUniforms,
          getDistortion: `
                    uniform vec4 uFreq;
                    uniform vec4 uAmp;
                    float nsin(float val){
                        return sin(val) * 0.5 + 0.5;
                    }
                    #define PI 3.14159265358979
                    float getDistortionX(float progress){
                        return (
                            cos(PI * progress * uFreq.r) * uAmp.r +
                            pow(cos(PI * progress * uFreq.g * (uFreq.g / uFreq.r)), 2. ) * uAmp.g
                        );
                    }
                    float getDistortionY(float progress){
                        return (
                            -nsin(PI * progress * uFreq.b) * uAmp.b +
                            -pow(nsin(PI * progress * uFreq.a / (uFreq.b / uFreq.a)), 5.) * uAmp.a
                        );
                    }
                    vec3 getDistortion(float progress){
                        return vec3(
                            getDistortionX(progress) - getDistortionX(0.02),
                            getDistortionY(progress) - getDistortionY(0.02),
                            0.
                        );
                    }
                `,
        },
        deepDistortionStill: {
          uniforms: deepUniforms,
          getDistortion: `
                    uniform vec4 uFreq;
                    uniform vec4 uAmp;
                    uniform vec2 uPowY;
                    float nsin(float val){
                        return sin(val) * 0.5 + 0.5;
                    }
                    #define PI 3.14159265358979
                    float getDistortionX(float progress){
                        return (
                            sin(progress * PI * uFreq.x) * uAmp.x * 2.
                        );
                    }
                    float getDistortionY(float progress){
                        return (
                            pow(abs(progress * uPowY.x), uPowY.y) + sin(progress * PI * uFreq.y) * uAmp.y
                        );
                    }
                    vec3 getDistortion(float progress){
                        return vec3(
                            getDistortionX(progress) - getDistortionX(0.02),
                            getDistortionY(progress) - getDistortionY(0.05),
                            0.
                        );
                    }
                `,
        },
        deepDistortion: {
          uniforms: deepUniforms,
          getDistortion: `
                    uniform vec4 uFreq;
                    uniform vec4 uAmp;
                    uniform vec2 uPowY;
                    float nsin(float val){
                        return sin(val) * 0.5 + 0.5;
                    }
                    #define PI 3.14159265358979
                    float getDistortionX(float progress){
                        return (
                            sin(progress * PI * uFreq.x + uTime) * uAmp.x
                        );
                    }
                    float getDistortionY(float progress){
                        return (
                            pow(abs(progress * uPowY.x), uPowY.y) + sin(progress * PI * uFreq.y + uTime) * uAmp.y
                        );
                    }
                    vec3 getDistortion(float progress){
                        return vec3(
                            getDistortionX(progress) - getDistortionX(0.02),
                            getDistortionY(progress) - getDistortionY(0.02),
                            0.
                        );
                    }
                `,
          getJS: (progress, time) => {
            const uFreq = deepUniforms.uFreq.value;
            const uAmp = deepUniforms.uAmp.value;
            const uPowY = deepUniforms.uPowY.value;

            const getX = (p) => Math.sin(p * Math.PI * uFreq.x + time) * uAmp.x;
            const getY = (p) =>
              Math.pow(p * uPowY.x, uPowY.y) +
              Math.sin(p * Math.PI * uFreq.y + time) * uAmp.y;

            let distortion = new THREE.Vector3(
              getX(progress) - getX(progress + 0.01),
              getY(progress) - getY(progress + 0.01),
              0
            );
            let lookAtAmp = new THREE.Vector3(-2, -4, 0);
            let lookAtOffset = new THREE.Vector3(0, 0, -10);
            return distortion.multiply(lookAtAmp).add(lookAtOffset);
          },
        },
      };

      // --- Shader GLSL Code ---

      const carLightsFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            varying vec3 vColor;
            varying vec2 vUv;
            uniform vec2 uFade;
            void main() {
                vec3 color = vec3(vColor);
                float alpha = smoothstep(uFade.x, uFade.y, vUv.x);
                gl_FragColor = vec4(color, alpha);
                if (gl_FragColor.a < 0.0001) discard;
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

      const carLightsVertex = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_vertex"]}
            attribute vec3 aOffset;
            attribute vec3 aMetrics;
            attribute vec3 aColor;
            uniform float uTravelLength;
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vColor;
            #include <getDistortion_vertex>
            void main() {
                vec3 transformed = position.xyz;
                float radius = aMetrics.r;
                float myLength = aMetrics.g;
                float speed = aMetrics.b;

                transformed.xy *= radius;
                transformed.z *= myLength;

                transformed.z += myLength - mod(uTime * speed + aOffset.z, uTravelLength);
                transformed.xy += aOffset.xy;

                float progress = abs(transformed.z / uTravelLength);
                transformed.xyz += getDistortion(progress);

                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
                gl_Position = projectionMatrix * mvPosition;
                vUv = uv;
                vColor = aColor;
                ${THREE.ShaderChunk["fog_vertex"]}
            }
        `;

      const sideSticksVertex = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_vertex"]}
            attribute float aOffset;
            attribute vec3 aColor;
            attribute vec2 aMetrics;
            uniform float uTravelLength;
            uniform float uTime;
            varying vec3 vColor;
            mat4 rotationY( in float angle ) {
                return mat4(	cos(angle),		0,		sin(angle),	0,
                                0,		1.0,			 0,	0,
                                -sin(angle),	0,		cos(angle),	0,
                                0, 		0,				0,	1);
            }
            #include <getDistortion_vertex>
            void main(){
                vec3 transformed = position.xyz;
                float width = aMetrics.x;
                float height = aMetrics.y;

                transformed.xy *= vec2(width, height);
                float time = mod(uTime * 60. * 2. + aOffset, uTravelLength);

                transformed = (rotationY(3.14/2.) * vec4(transformed,1.)).xyz;

                transformed.z += - uTravelLength + time;

                float progress = abs(transformed.z / uTravelLength);
                transformed.xyz += getDistortion(progress);

                transformed.y += height / 2.;
                transformed.x += -width / 2.;
                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
                gl_Position = projectionMatrix * mvPosition;
                vColor = aColor;
                ${THREE.ShaderChunk["fog_vertex"]}
            }
        `;

      const sideSticksFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            varying vec3 vColor;
            void main(){
                vec3 color = vec3(vColor);
                gl_FragColor = vec4(color,1.);
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

      const roadVertex = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_vertex"]}
            uniform float uTime;
            uniform float uTravelLength;
            #include <getDistortion_vertex>
            varying float vZ;
            void main(){
                vec3 transformed = position.xyz;
                transformed.z = mod(transformed.z + uTime, uTravelLength) - uTravelLength / 2.;

                float progress = abs(transformed.z / uTravelLength);
                transformed.xyz += getDistortion(progress);

                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
                gl_Position = projectionMatrix * mvPosition;
                vZ = transformed.z;
                ${THREE.ShaderChunk["fog_vertex"]}
            }
        `;

      const roadFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            uniform float uTravelLength;
            uniform float uLanes;
            uniform vec3 uBrokenLinesColor;
            uniform vec3 uShoulderLinesColor;
            uniform float uShoulderLinesWidthPercentage;
            uniform float uBrokenLinesLengthPercentage;
            uniform float uBrokenLinesWidthPercentage;
            uniform vec3 uColor;
            varying float vZ;

            void main(){
                vec3 color = uColor;
                float u = fract(vUv.x);
                float v = fract(vUv.y);

                float brokenLineLight = smoothstep(0.0, 0.05, abs(mod(vZ + uTravelLength / 2., uTravelLength / uBrokenLinesLengthPercentage) - uTravelLength / uBrokenLinesLengthPercentage / 2.));

                // Shoulder lines
                if (u < uShoulderLinesWidthPercentage || u > (1. - uShoulderLinesWidthPercentage)) {
                    color = mix(color, uShoulderLinesColor, 0.8);
                }
                // Broken lines
                if (
                    u > uShoulderLinesWidthPercentage &&
                    u < (1. - uShoulderLinesWidthPercentage) &&
                    (fract(u * uLanes) > (1. - uBrokenLinesWidthPercentage) || fract(u * uLanes) < uBrokenLinesWidthPercentage)
                ) {
                    color = mix(color, uBrokenLinesColor, brokenLineLight);
                }

                gl_FragColor = vec4(color,1.);
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

      const islandFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            uniform vec3 uColor;
            void main(){
                vec3 color = uColor;
                gl_FragColor = vec4(color,1.);
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

      // --- Three.js Scene Classes ---

      /**
       * Manages the car lights on the road.
       */
      class CarLights {
        constructor(webgl, options, colors, speed, fade) {
          this.webgl = webgl;
          this.options = options;
          this.colors = colors;
          this.speed = speed;
          this.fade = fade;
        }

        init() {
          const options = this.options;
          // Create a basic curve for the light trail
          let curve = new THREE.LineCurve3(
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
          );
          // Create a tube geometry based on the curve
          let geometry = new THREE.TubeGeometry(curve, 40, 1, 8, false);

          // Use InstancedBufferGeometry for efficient rendering of many lights
          let instanced = new THREE.InstancedBufferGeometry().copy(geometry);
          instanced.instanceCount = options.lightPairsPerRoadWay * 2; // Two lights per car

          let laneWidth = options.roadWidth / options.lanesPerRoad;

          let aOffset = []; // xyz offset for each instance
          let aMetrics = []; // radius, length, speed for each instance
          let aColor = []; // rgb color for each instance

          // Ensure colors are Three.Color objects
          let colors = this.colors;
          if (Array.isArray(colors)) {
            colors = colors.map((c) => new THREE.Color(c));
          } else {
            colors = new THREE.Color(colors);
          }

          // Populate instance attributes
          for (let i = 0; i < options.lightPairsPerRoadWay; i++) {
            let radius = random(options.carLightsRadius);
            let length = random(options.carLightsLength);
            let speed = random(this.speed);

            let carLane = i % options.lanesPerRoad;
            let laneX =
              carLane * laneWidth - options.roadWidth / 2 + laneWidth / 2;

            let carWidth = random(options.carWidthPercentage) * laneWidth;
            let carShiftX = random(options.carShiftX) * laneWidth;
            laneX += carShiftX;

            let offsetY = random(options.carFloorSeparation) + radius * 1.3;

            let offsetZ = -random(options.length);

            // Left light of the car
            aOffset.push(laneX - carWidth / 2);
            aOffset.push(offsetY);
            aOffset.push(offsetZ);

            // Right light of the car
            aOffset.push(laneX + carWidth / 2);
            aOffset.push(offsetY);
            aOffset.push(offsetZ);

            // Metrics for left light
            aMetrics.push(radius);
            aMetrics.push(length);
            aMetrics.push(speed);

            // Metrics for right light (same as left)
            aMetrics.push(radius);
            aMetrics.push(length);
            aMetrics.push(speed);

            // Color for left light
            let color = pickRandom(colors);
            aColor.push(color.r);
            aColor.push(color.g);
            aColor.push(color.b);

            // Color for right light (same as left)
            aColor.push(color.r);
            aColor.push(color.g);
            aColor.push(color.b);
          }

          // Set attributes on the instanced geometry
          instanced.setAttribute(
            "aOffset",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aOffset),
              3,
              false
            )
          );
          instanced.setAttribute(
            "aMetrics",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aMetrics),
              3,
              false
            )
          );
          instanced.setAttribute(
            "aColor",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aColor),
              3,
              false
            )
          );

          // Create a ShaderMaterial for custom rendering of car lights
          let material = new THREE.ShaderMaterial({
            fragmentShader: carLightsFragment,
            vertexShader: carLightsVertex,
            transparent: true, // Enable transparency for fading
            uniforms: Object.assign(
              {
                uTime: { value: 0 }, // Global time uniform
                uTravelLength: { value: options.length }, // Length of the road for looping
                uFade: { value: this.fade }, // Fade range for the lights
              },
              this.webgl.fogUniforms, // Pass fog uniforms
              options.distortion.uniforms // Pass distortion uniforms
            ),
          });

          // Inject the distortion function into the vertex shader
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
              "#include <getDistortion_vertex>",
              options.distortion.getDistortion
            );
          };

          // Create the mesh and add it to the scene
          let mesh = new THREE.Mesh(instanced, material);
          mesh.frustumCulled = false; // Prevent culling as lights might go off-screen but should still animate
          this.webgl.scene.add(mesh);
          this.mesh = mesh;
        }

        /**
         * Updates the car lights animation.
         * @param {number} time - Current animation time.
         */
        update(time) {
          this.mesh.material.uniforms.uTime.value = time;
        }
      }

      /**
       * Manages the light sticks on the side of the road.
       */
      class LightsSticks {
        constructor(webgl, options) {
          this.webgl = webgl;
          this.options = options;
        }

        init() {
          const options = this.options;
          const geometry = new THREE.PlaneGeometry(1, 1); // Simple plane for each stick
          let instanced = new THREE.InstancedBufferGeometry().copy(geometry);
          let totalSticks = options.totalSideLightSticks;
          instanced.instanceCount = totalSticks;

          let stickoffset = options.length / (totalSticks - 1);
          const aOffset = []; // Z offset for each instance
          const aColor = []; // RGB color for each instance
          const aMetrics = []; // Width and height for each instance

          // Ensure colors are Three.Color objects
          let colors = options.colors.sticks;
          if (Array.isArray(colors)) {
            colors = colors.map((c) => new THREE.Color(c));
          } else {
            colors = new THREE.Color(colors);
          }

          // Populate instance attributes
          for (let i = 0; i < totalSticks; i++) {
            let width = random(options.lightStickWidth);
            let height = random(options.lightStickHeight);
            // Distribute sticks along the road, adding some randomness
            aOffset.push(
              (i - 1) * stickoffset * 2 + stickoffset * Math.random()
            );

            // Assign a random color from the palette
            let color = pickRandom(colors);
            aColor.push(color.r);
            aColor.push(color.g);
            aColor.push(color.b);

            aMetrics.push(width);
            aMetrics.push(height);
          }

          // Set attributes on the instanced geometry
          instanced.setAttribute(
            "aOffset",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aOffset),
              1,
              false
            )
          );
          instanced.setAttribute(
            "aColor",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aColor),
              3,
              false
            )
          );
          instanced.setAttribute(
            "aMetrics",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aMetrics),
              2,
              false
            )
          );

          // Create a ShaderMaterial for custom rendering of side sticks
          const material = new THREE.ShaderMaterial({
            fragmentShader: sideSticksFragment,
            vertexShader: sideSticksVertex,
            side: THREE.DoubleSide, // Render both sides of the plane
            uniforms: Object.assign(
              {
                uTravelLength: { value: options.length }, // Length of the road for looping
                uTime: { value: 0 }, // Global time uniform
              },
              this.webgl.fogUniforms, // Pass fog uniforms
              options.distortion.uniforms // Pass distortion uniforms
            ),
          });

          // Inject the distortion function into the vertex shader
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
              "#include <getDistortion_vertex>",
              options.distortion.getDistortion
            );
          };

          // Create the mesh and add it to the scene
          const mesh = new THREE.Mesh(instanced, material);
          mesh.frustumCulled = false; // Prevent culling
          this.webgl.scene.add(mesh);
          this.mesh = mesh;
        }

        /**
         * Updates the light sticks animation.
         * @param {number} time - Current animation time.
         */
        update(time) {
          this.mesh.material.uniforms.uTime.value = time;
        }
      }

      /**
       * Manages the road and island planes.
       */
      class Road {
        constructor(webgl, options) {
          this.webgl = webgl;
          this.options = options;
          this.uTime = { value: 0 }; // Time uniform specifically for the road shader
        }

        /**
         * Creates a plane for either the road or the island.
         * @param {boolean} isRoad - True if creating the road, false if creating the island.
         * @returns {THREE.Mesh} The created mesh.
         */
        createPlane(isRoad) {
          const options = this.options;
          let segments = 100; // Number of segments along the length for distortion
          const geometry = new THREE.PlaneGeometry(
            isRoad ? options.roadWidth : options.islandWidth,
            options.length,
            20, // Width segments
            segments // Height (length) segments
          );
          let uniforms = {
            uTravelLength: { value: options.length }, // Length of the road for looping
            uColor: {
              value: new THREE.Color(
                isRoad ? options.colors.roadColor : options.colors.islandColor
              ),
            },
            uTime: this.uTime, // Time uniform
          };

          // Add specific uniforms for the road if applicable
          if (isRoad) {
            uniforms = Object.assign(uniforms, {
              uLanes: { value: options.lanesPerRoad },
              uBrokenLinesColor: {
                value: new THREE.Color(options.colors.brokenLines),
              },
              uShoulderLinesColor: {
                value: new THREE.Color(options.colors.shoulderLines),
              },
              uShoulderLinesWidthPercentage: {
                value: options.shoulderLinesWidthPercentage,
              },
              uBrokenLinesLengthPercentage: {
                value: options.brokenLinesLengthPercentage,
              },
              uBrokenLinesWidthPercentage: {
                value: options.brokenLinesWidthPercentage,
              },
            });
          }

          // Create a ShaderMaterial for custom rendering of the road/island
          const material = new THREE.ShaderMaterial({
            fragmentShader: isRoad ? roadFragment : islandFragment,
            vertexShader: roadVertex,
            side: THREE.DoubleSide, // Render both sides
            uniforms: Object.assign(
              uniforms,
              this.webgl.fogUniforms, // Pass fog uniforms
              options.distortion.uniforms // Pass distortion uniforms
            ),
          });

          // Inject the distortion function into the vertex shader
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
              "#include <getDistortion_vertex>",
              options.distortion.getDistortion
            );
          };

          // Create the mesh and add it to the scene
          const mesh = new THREE.Mesh(geometry, material);
          mesh.rotation.x = -Math.PI / 2; // Rotate to lie flat on the XZ plane
          // Position the road/island relative to the center of the scene
          mesh.position.y = -options.roadWidth / 2; // Adjust vertical position to align with 0,0 for car lights
          this.webgl.scene.add(mesh);
          return mesh;
        }

        init() {
          // Create the main road plane
          this.road = this.createPlane(true);
          // Create the island plane and position it next to the road
          this.island = this.createPlane(false);
          this.island.position.z = -this.options.length / 2; // Align Z with the road
          // Position the island to the right of the road
          this.island.position.x =
            this.options.roadWidth / 2 + this.options.islandWidth / 2;
        }

        /**
         * Updates the road animation.
         * @param {number} time - Current animation time.
         */
        update(time) {
          this.uTime.value = time;
        }
      }

      /**
       * Main application class for the Hyperspeed effect.
       * Initializes the Three.js scene, camera, renderer, and all visual elements.
       */
      class App {
        constructor(container, options = {}) {
          this.options = options;
          // Fallback to default distortion if not specified
          if (this.options.distortion == null) {
            this.options.distortion = {
              uniforms: distortion_uniforms,
              getDistortion: distortion_vertex,
            };
          }
          this.container = container;

          // Initialize WebGL Renderer
          this.renderer = new THREE.WebGLRenderer({
            antialias: false,
            alpha: true, // Enable alpha for transparent background if needed
          });
          this.renderer.setSize(
            container.offsetWidth,
            container.offsetHeight,
            false
          );
          this.renderer.setPixelRatio(window.devicePixelRatio);
          this.composer = new EffectComposer(this.renderer); // For post-processing effects
          container.append(this.renderer.domElement); // Add canvas to the DOM

          // Initialize Camera
          this.camera = new THREE.PerspectiveCamera(
            options.fov, // Field of View
            container.offsetWidth / container.offsetHeight, // Aspect Ratio
            0.1, // Near clipping plane
            10000 // Far clipping plane
          );
          this.camera.position.z = -5;
          this.camera.position.y = 8;
          this.camera.position.x = 0;

          // Initialize Scene
          this.scene = new THREE.Scene();
          this.scene.background = null; // Transparent background

          // Setup Fog
          let fog = new THREE.Fog(
            options.colors.background,
            options.length * 0.2, // Near distance
            options.length * 500 // Far distance
          );
          this.scene.fog = fog;
          this.fogUniforms = {
            fogColor: { value: fog.color },
            fogNear: { value: fog.near },
            fogFar: { value: fog.far },
          };

          this.clock = new THREE.Clock(); // For tracking time
          this.assets = {}; // To store loaded assets (e.g., SMAA images)
          this.disposed = false; // Flag for cleanup

          // Initialize scene elements
          this.road = new Road(this, options);
          this.leftCarLights = new CarLights(
            this,
            options,
            options.colors.leftCars,
            options.movingAwaySpeed,
            new THREE.Vector2(0, 1 - options.carLightsFade)
          );
          this.rightCarLights = new CarLights(
            this,
            options,
            options.colors.rightCars,
            options.movingCloserSpeed,
            new THREE.Vector2(1, 0 + options.carLightsFade)
          );
          this.leftSticks = new LightsSticks(this, options);

          // Animation state variables
          this.fovTarget = options.fov;
          this.speedUpTarget = 0;
          this.speedUp = 0;
          this.timeOffset = 0;

          // Bind methods to 'this'
          this.tick = this.tick.bind(this);
          this.init = this.init.bind(this);
          this.setSize = this.setSize.bind(this);
          this.onMouseDown = this.onMouseDown.bind(this);
          this.onMouseUp = this.onMouseUp.bind(this);

          // Event listener for window resizing
          window.addEventListener("resize", this.onWindowResize.bind(this));
        }

        /**
         * Handles window resize events to keep the renderer and camera updated.
         */
        onWindowResize() {
          const width = this.container.offsetWidth;
          const height = this.container.offsetHeight;

          this.renderer.setSize(width, height);
          this.camera.aspect = width / height;
          this.camera.updateProjectionMatrix();
          this.composer.setSize(width, height);
        }

        /**
         * Initializes the post-processing passes.
         */
        initPasses() {
          this.renderPass = new RenderPass(this.scene, this.camera);
          this.bloomPass = new EffectPass(
            this.camera,
            new BloomEffect({
              luminanceThreshold: 0.2,
              luminanceSmoothing: 0,
              resolutionScale: 1,
            })
          );

          const smaaPass = new EffectPass(
            this.camera,
            new SMAAEffect({
              preset: SMAAPreset.MEDIUM,
              searchImage: SMAAEffect.searchImageDataURL,
              areaImage: SMAAEffect.areaImageDataURL,
            })
          );
          // Configure render passes
          this.renderPass.renderToScreen = false;
          this.bloomPass.renderToScreen = false;
          smaaPass.renderToScreen = true; // Only the final pass renders to screen
          this.composer.addPass(this.renderPass);
          this.composer.addPass(this.bloomPass);
          this.composer.addPass(smaaPass);
        }

        /**
         * Loads necessary assets (e.g., SMAA images).
         * @returns {Promise<void>} A promise that resolves when assets are loaded.
         */
        loadAssets() {
          const assets = this.assets;
          return new Promise((resolve) => {
            const manager = new THREE.LoadingManager(resolve);

            const searchImage = new Image();
            const areaImage = new Image();
            assets.smaa = {};

            // Event listeners for image loading
            searchImage.addEventListener("load", function () {
              assets.smaa.search = this;
              manager.itemEnd("smaa-search");
            });

            areaImage.addEventListener("load", function () {
              assets.smaa.area = this;
              manager.itemEnd("smaa-area");
            });

            // Start loading items with the manager
            manager.itemStart("smaa-search");
            manager.itemStart("smaa-area");

            // Set image sources from SMAAEffect data URLs
            searchImage.src = SMAAEffect.searchImageDataURL;
            areaImage.src = SMAAEffect.areaImageDataURL;
          });
        }

        /**
         * Initializes all Three.js elements and starts the animation loop.
         */
        init() {
          this.initPasses(); // Setup post-processing
          const options = this.options;

          // Initialize all scene objects
          this.road.init();
          this.leftCarLights.init();
          this.leftCarLights.mesh.position.setX(
            -options.roadWidth / 2 - options.islandWidth / 2
          );
          this.rightCarLights.init();
          this.rightCarLights.mesh.position.setX(
            options.roadWidth / 2 + options.islandWidth / 2
          );
          this.leftSticks.init();
          this.leftSticks.mesh.position.setX(
            -(options.roadWidth + options.islandWidth / 2)
          );

          // Add mouse event listeners for interaction
          this.container.addEventListener("mousedown", this.onMouseDown);
          this.container.addEventListener("mouseup", this.onMouseUp);
          this.container.addEventListener("mouseout", this.onMouseUp); // Handle mouse leaving the container

          this.tick(); // Start the animation loop
        }

        /**
         * Handles mouse down events, speeding up the effect.
         * @param {MouseEvent} ev - The mouse event.
         */
        onMouseDown(ev) {
          if (this.options.onSpeedUp) this.options.onSpeedUp(ev);
          this.fovTarget = this.options.fovSpeedUp;
          this.speedUpTarget = this.options.speedUp;
        }

        /**
         * Handles mouse up events, slowing down the effect.
         * @param {MouseEvent} ev - The mouse event.
         */
        onMouseUp(ev) {
          if (this.options.onSlowDown) this.options.onSlowDown(ev);
          this.fovTarget = this.options.fov;
          this.speedUpTarget = 0;
        }

        /**
         * Updates the state of all animated elements.
         * @param {number} delta - Time elapsed since the last frame.
         */
        update(delta) {
          let lerpPercentage = Math.exp(-(-60 * Math.log2(1 - 0.1)) * delta); // Smooth interpolation factor
          this.speedUp += lerp(
            this.speedUp,
            this.speedUpTarget,
            lerpPercentage,
            0.00001
          );
          this.timeOffset += this.speedUp * delta; // Accumulate time offset based on speed

          let time = this.clock.elapsedTime + this.timeOffset;

          // Update all animated elements
          this.rightCarLights.update(time);
          this.leftCarLights.update(time);
          this.leftSticks.update(time);
          this.road.update(time);

          let updateCamera = false;
          // Interpolate camera FOV
          let fovChange = lerp(this.camera.fov, this.fovTarget, lerpPercentage);
          if (fovChange !== 0) {
            this.camera.fov += fovChange * delta * 6;
            updateCamera = true;
          }

          // Apply distortion to camera look-at point
          if (this.options.distortion.getJS) {
            const distortion = this.options.distortion.getJS(0.025, time); // Get distortion vector

            this.camera.lookAt(
              new THREE.Vector3(
                this.camera.position.x + distortion.x,
                this.camera.position.y + distortion.y,
                this.camera.position.z + distortion.z
              )
            );
            updateCamera = true;
          }
          if (updateCamera) {
            this.camera.updateProjectionMatrix(); // Update camera if FOV or look-at changed
          }

          if (this.options.isHyper) {
            // This was for debugging in React, can be removed or adapted
            console.log(this.options.isHyper);
          }
        }

        /**
         * Renders the scene using the effect composer.
         * @param {number} delta - Time elapsed since the last frame.
         */
        render(delta) {
          this.composer.render(delta);
        }

        /**
         * Disposes of resources (though in this single HTML file, less critical).
         */
        dispose() {
          this.disposed = true;
          // Add any necessary Three.js dispose calls here if objects need to be cleaned up manually
        }

        /**
         * Sets the size of the composer.
         * @param {number} width - New width.
         * @param {number} height - New height.
         * @param {boolean} updateStyles - Whether to update CSS styles (false for canvas resize).
         */
        setSize(width, height, updateStyles) {
          this.composer.setSize(width, height, updateStyles);
        }

        /**
         * The main animation loop.
         */
        tick() {
          if (this.disposed || !this) return; // Stop if disposed or object is null

          // Handle canvas resize on demand
          if (resizeRendererToDisplaySize(this.renderer, this.setSize)) {
            const canvas = this.renderer.domElement;
            this.camera.aspect = canvas.clientWidth / canvas.clientHeight;
            this.camera.updateProjectionMatrix();
          }

          const delta = this.clock.getDelta(); // Get time since last frame
          this.render(delta); // Render the scene
          this.update(delta); // Update animation logic
          requestAnimationFrame(this.tick); // Request next frame
        }
      }
