<!DOCTYPE html>
<html>
  <head>
    <title>Weather Gadget with Custom Icons</title>
    <style>
      #weather-gadget {
        width: 300px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-family: sans-serif;
      }

      #weather-icon {
        width: 50px;
        height: 50px;
        display: block;
        margin: 10px auto;
      }

      #weather-gadget p {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div id="weather-gadget">
      <h2>Weather</h2>
      <p id="location">Loading location...</p>
      <img id="weather-icon" src="" alt="Weather Icon" />
      <p id="temperature">Loading temperature...</p>
      <p id="description">Loading description...</p>
    </div>

    <script>
      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const latitude = position.coords.latitude;
              const longitude = position.coords.longitude;
              document.getElementById(
                "location"
              ).textContent = `Location: Lat ${latitude.toFixed(
                2
              )}, Lon ${longitude.toFixed(2)}`;
              getWeather(latitude, longitude);
            },
            (error) => {
              console.error("Error getting location:", error);
              document.getElementById("location").textContent =
                "Location access denied.";
              document.getElementById("temperature").textContent = "";
              document.getElementById("description").textContent = "";
              document.getElementById("weather-icon").src = "";
            }
          );
        } else {
          document.getElementById("location").textContent =
            "Geolocation is not supported by this browser.";
          document.getElementById("temperature").textContent = "";
          document.getElementById("description").textContent = "";
          document.getElementById("weather-icon").src = "";
        }
      }

      function getWeather(latitude, longitude) {
        const apiKey = "YOUR_WEATHER_API_KEY"; // Replace with your API key
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`;

        fetch(apiUrl)
          .then((response) => response.json())
          .then((data) => {
            document.getElementById(
              "temperature"
            ).textContent = `Temperature: ${data.main.temp}°C`;
            document.getElementById(
              "description"
            ).textContent = `Description: ${data.weather[0].description}`;

            const weatherDescription =
              data.weather[0].description.toLowerCase(); // Get lowercase description

            // Map weather descriptions to your custom image paths
            let iconPath = "";
            if (weatherDescription.includes("clear")) {
              iconPath = "images/clear.png"; // Replace with your image path
            } else if (weatherDescription.includes("clouds")) {
              iconPath = "images/clouds.png";
            } else if (weatherDescription.includes("rain")) {
              iconPath = "images/rain.png";
            } else if (weatherDescription.includes("thunderstorm")) {
              iconPath = "images/thunderstorm.png";
            } else if (weatherDescription.includes("snow")) {
              iconPath = "images/snow.png";
            } else if (
              weatherDescription.includes("mist") ||
              weatherDescription.includes("fog") ||
              weatherDescription.includes("haze")
            ) {
              iconPath = "images/mist.png";
            } else {
              iconPath = "images/default.png"; // Default image if no match
            }

            document.getElementById("weather-icon").src = iconPath;
            document.getElementById("weather-icon").alt =
              data.weather[0].description;
          })
          .catch((error) => {
            console.error("Error fetching weather data:", error);
            document.getElementById("temperature").textContent =
              "Error loading weather.";
            document.getElementById("description").textContent = "";
            document.getElementById("weather-icon").src = "";
          });
      }

      getLocation();
    </script>
  </body>
</html>
