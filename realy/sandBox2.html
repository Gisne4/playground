        완정: { x: 110, y: 470, lines: ["인천2호선"] },
        마전: { x: 120, y: 490, lines: ["인천2호선"] },
        아시아드경기장: { x: 130, y: 510, lines: ["인천2호선"] },
        서구청: { x: 140, y: 530, lines: ["인천2호선"] },
        가정: { x: 150, y: 550, lines: ["인천2호선"] },
      };

      const lineColors = {
        1: "#0052A4", // Dark Blue
        2: "#00A859", // Green
        3: "#EF7C1E", // Orange
        4: "#00A4E3", // Sky Blue
        5: "#996CAC", // Purple
        6: "#CD801A", // Brown
        7: "#747F00", // Dark Green
        8: "#EA545D", // Pink
        9: "#BB8320", // Gold
        신분당: "#D4002D", // Red
        분당: "#F5A100", // Yellow-Orange
        경의중앙: "#7FC221", // Light Green
        경춘: "#0C8E47", // Emerald Green
        공항철도: "#0093B9", // Teal
        우이신설: "#B0CE3A", // Light Green
        경강: "#0052A4", // (Example, adjust if specific color)
        수인분당: "#F5A100", // (Example, adjust if specific color)
        인천1호선: "#7FC221", // (Example, adjust if specific color)
        인천2호선: "#0093B9", // (Example, adjust if specific color)
      };

      let hoveredStation = null;
      let highlightedLine = "all"; // 'all' or a specific line number

      // Dynamically calculate canvas size based on coordinates
      let minX = Infinity,
        minY = Infinity,
        maxX = -Infinity,
        maxY = -Infinity;
      for (const stationName in allStationCoordinates) {
        const station = allStationCoordinates[stationName];
        if (station.x < minX) minX = station.x;
        if (station.y < minY) minY = station.y;
        if (station.x > maxX) maxX = station.x;
        if (station.y > maxY) maxY = station.y;
      }

      const padding = 50; // Add some padding around the map
      canvas.width = maxX - minX + 2 * padding;
      canvas.height = maxY - minY + 2 * padding;

      const offsetX = padding - minX;
      const offsetY = padding - minY;

      // Function to generate line paths from station coordinates
      function generateLinePaths() {
        const linesData = {};
        for (const stationName in allStationCoordinates) {
          const station = allStationCoordinates[stationName];
          station.lines.forEach((line) => {
            if (!linesData[line]) {
              linesData[line] = [];
            }
            linesData[line].push({
              name: stationName,
              x: station.x,
              y: station.y,
            });
          });
        }

        const allLinePaths = {};
        for (const line in linesData) {
          // Sort stations for each line to create a coherent path
          // This is a heuristic and might not perfectly represent complex line layouts.
          linesData[line].sort((a, b) => {
            if (a.x !== b.x) return a.x - b.x;
            return a.y - b.y;
          });
          allLinePaths[line] = linesData[line].map((s) => s.name);
        }
        return allLinePaths;
      }

      const allLinePaths = generateLinePaths();

      // Populate the line select dropdown
      function populateLineSelect() {
        const lines = Object.keys(lineColors).sort((a, b) => {
          // Try to sort numerically first, then alphabetically
          const numA = parseInt(a);
          const numB = parseInt(b);
          if (!isNaN(numA) && !isNaN(numB)) {
            return numA - numB;
          }
          return a.localeCompare(b);
        });

        lines.forEach((line) => {
          const option = document.createElement("option");
          option.value = line;
          option.textContent = `Line ${line}`;
          lineSelect.appendChild(option);
        });
      }

      function drawSubwayMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw all lines first
        for (const line in allLinePaths) {
          if (highlightedLine !== "all" && line !== highlightedLine) {
            continue; // Skip drawing non-highlighted lines
          }

          ctx.beginPath();
          ctx.strokeStyle = lineColors[line] || "#000"; // Default to black if no color defined
          ctx.lineWidth = highlightedLine === line ? 6 : 3; // Thicker for highlighted line
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          const stationsInOrder = allLinePaths[line];
          if (stationsInOrder && stationsInOrder.length > 0) {
            const firstStationName = stationsInOrder[0];
            const firstStation = allStationCoordinates[firstStationName];
            if (firstStation) {
              ctx.moveTo(firstStation.x + offsetX, firstStation.y + offsetY);
            }

            for (let i = 1; i < stationsInOrder.length; i++) {
              const stationName = stationsInOrder[i];
              const station = allStationCoordinates[stationName];
              if (station) {
                ctx.lineTo(station.x + offsetX, station.y + offsetY);
              }
            }
          }
          ctx.stroke();
        }

        // Draw stations on top of lines
        for (const stationName in allStationCoordinates) {
          const station = allStationCoordinates[stationName];
          const x = station.x + offsetX;
          const y = station.y + offsetY;
          const radius = hoveredStation === stationName ? 7 : 5;

          // Only draw station if it's part of the highlighted line or if 'all' is selected
          const belongsToHighlightedLine =
            highlightedLine === "all" ||
            station.lines.includes(highlightedLine);

          if (belongsToHighlightedLine) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.lineWidth = 2;
            // Border color based on the first line or a default
            ctx.strokeStyle = lineColors[station.lines[0]] || "#333";
            ctx.stroke();

            // Draw station name
            ctx.fillStyle = "#333";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(stationName, x, y - 10); // Adjust text position
          }
        }
      }

      function getMousePos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: evt.clientX - rect.left,
          y: evt.clientY - rect.top,
        };
      }

      canvas.addEventListener("mousemove", function (event) {
        const mousePos = getMousePos(canvas, event);
        let foundStation = null;
        for (const stationName in allStationCoordinates) {
          const station = allStationCoordinates[stationName];
          const x = station.x + offsetX;
          const y = station.y + offsetY;
          const distance = Math.sqrt(
            (mousePos.x - x) ** 2 + (mousePos.y - y) ** 2
          );

          if (distance < 10) {
            // Check if mouse is within 10px of station
            foundStation = stationName;
            break;
          }
        }

        if (foundStation && hoveredStation !== foundStation) {
          hoveredStation = foundStation;
          const station = allStationCoordinates[foundStation];
          stationInfoDiv.textContent = `${foundStation} (Lines: ${station.lines.join(
            ", "
          )})`;
          drawSubwayMap();
        } else if (!foundStation && hoveredStation) {
          hoveredStation = null;
          stationInfoDiv.textContent = "Hover over a station for details.";
          drawSubwayMap();
        }
      });

      lineSelect.addEventListener("change", (event) => {
        highlightedLine = event.target.value;
        drawSubwayMap();
      });

      function clearHighlight() {
        highlightedLine = "all";
        lineSelect.value = "all";
        drawSubwayMap();
      }

      // Initial setup
      populateLineSelect();
      drawSubwayMap();
    </script>
