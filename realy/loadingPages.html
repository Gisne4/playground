<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SF Mechanic Loading Door</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Splitting.js CDN -->
    <script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
    <!-- Anime.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #1a202c; /* Dark background */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* Full viewport height */
        width: 100vw; /* Full viewport width */
        margin: 0;
        overflow: hidden; /* Prevent scrollbars */
        position: relative; /* For absolute positioning of content */
      }

      .door-wrapper {
        position: relative;
        width: 100vw; /* Full viewport width */
        height: 100vh; /* Full viewport height */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* Hide parts that slide out */
        background-color: #2c405a; /* Darker blue background for the door area */
        box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.7); /* Inner shadow for depth */
      }

      /* Top and Bottom static door panels */
      .door-panel-static {
        width: 100%;
        height: 15vh; /* Responsive height for top/bottom sections */
        background-color: #3a577a; /* Main door panel blue */
        border-bottom: 2px solid #2c405a; /* Separator lines matching darker background */
        border-top: 2px solid #2c405a;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4); /* Inner shadow */
        display: flex;
        justify-content: center;
        align-items: center;
        color: #a0aec0; /* Light text for details */
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        position: relative;
        z-index: 10;
      }
      .door-panel-static::before,
      .door-panel-static::after {
        content: "";
        position: absolute;
        height: 5px;
        width: 80%;
        background-color: #5d81a9; /* Lighter blue for details */
        border-radius: 2px;
        opacity: 0.6;
      }
      .door-panel-static::before {
        top: 15%;
      }
      .door-panel-static::after {
        bottom: 15%;
      }

      .door-panel-static.top {
        border-bottom: none;
      }
      .door-panel-static.bottom {
        border-top: none;
      }

      .door-middle-section {
        position: relative;
        flex-grow: 1; /* Takes remaining space */
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #1a202c; /* Background color for the revealed area */
        overflow: hidden; /* Important for sliding panels */
      }

      /* The actual sliding door parts */
      .door-slide-panel {
        position: absolute;
        top: 0;
        width: 50%; /* Each panel covers half the middle section */
        height: 100%;
        background-color: #3a577a; /* Main door panel blue */
        border-left: 3px solid #2c405a; /* Vertical separators matching darker background */
        border-right: 3px solid #2c405a;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
        z-index: 10; /* Above the loading text and background */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* For inner details */
      }

      .door-slide-panel.left {
        left: 0;
        transform: translateX(0%); /* Initial position */
        border-left: none;
      }

      .door-slide-panel.right {
        right: 0;
        transform: translateX(0%); /* Initial position */
        border-right: none;
      }

      /* Inner details for sliding panels */
      .door-detail-stripe {
        position: absolute;
        width: 100%;
        height: 12px; /* Slightly thicker */
        background: linear-gradient(
          90deg,
          #5d81a9 0%,
          #4a5568 50%,
          #5d81a9 100%
        ); /* Metallic gradient */
        opacity: 0.8; /* Slightly less opaque to show underlying texture */
        border-radius: 3px; /* Slightly rounded corners */
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1),
          /* Top highlight */ 0 -1px 0 rgba(0, 0, 0, 0.3),
          /* Bottom shadow */ inset 0 1px 3px rgba(0, 0, 0, 0.5),
          /* Inner dark bevel */ inset 0 -1px 3px rgba(255, 255, 255, 0.1); /* Inner light bevel */
        transform: scaleY(
          0.9
        ); /* Slightly compress vertically for a recessed look */
        position: relative; /* For pseudo-elements */
      }
      /* Adding screw-like details to the stripes */
      .door-detail-stripe::before,
      .door-detail-stripe::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        background-color: #2c405a; /* Darker color for screws */
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      }
      .door-detail-stripe::before {
        left: 8px;
      }
      .door-detail-stripe::after {
        right: 8px;
      }

      .door-slide-panel.left .door-detail-stripe:nth-child(1) {
        top: 20%;
      }
      .door-slide-panel.left .door-detail-stripe:nth-child(2) {
        top: 40%;
      }
      .door-slide-panel.left .door-detail-stripe:nth-child(3) {
        top: 60%;
      }
      .door-slide-panel.right .door-detail-stripe:nth-child(1) {
        bottom: 20%;
      }
      .door-slide-panel.right .door-detail-stripe:nth-child(2) {
        bottom: 40%;
      }
      .door-slide-panel.right .door-detail-stripe:nth-child(3) {
        bottom: 60%;
      }

      /* Canvas for gears */
      #gearCanvas {
        position: absolute; /* Position it within the middle section */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1; /* Below the sliding doors initially, will be visible when doors open */
        opacity: 0; /* Initially hidden */
        transition: opacity 0.5s ease; /* For smooth fade in/out */
      }

      .loading-text {
        font-size: clamp(2rem, 8vw, 5rem); /* Responsive font size */
        font-weight: 700;
        color: #e2e8f0; /* Light gray text */
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
        position: relative;
        z-index: 5; /* Above the canvas, below the sliding panels initially */
        opacity: 0; /* Initially hidden, will be revealed by door */
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); /* Subtle glow */
      }
      /* Splitting.js adds .char and .word classes */
      .char {
        display: inline-block; /* Essential for individual char animations */
        opacity: 0; /* Initially hidden */
        transform: translateY(20px); /* Start slightly below */
      }

      /* Style for the "content" after loading */
      .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #1a202c; /* Same as body background */
        color: #48bb78; /* Green text */
        opacity: 0;
        transform: translateY(20px);
        z-index: 20; /* Above the door elements */
        pointer-events: none; /* Allow interaction with elements below until it's fully visible */
        transition: opacity 0.5s ease;
      }
      .content.show {
        display: flex; /* Make it visible for animation */
        pointer-events: auto; /* Enable interactions */
      }

      /* Basic message box styling for a non-alert message */
      .message-box {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none; /* Hidden by default */
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      .message-box.show {
        display: block;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="door-wrapper">
      <div class="door-panel-static top">Welcome Stranger</div>
      <div class="door-middle-section">
        <canvas id="gearCanvas"></canvas>
        <!-- Canvas for gear animation -->
        <!-- Main sliding door panels -->
        <div id="doorSlideLeft" class="door-slide-panel left">
          <div class="door-detail-stripe"></div>
          <div class="door-detail-stripe"></div>
          <div class="door-detail-stripe"></div>
        </div>
        <div id="doorSlideRight" class="door-slide-panel right">
          <div class="door-detail-stripe"></div>
          <div class="door-detail-stripe"></div>
          <div class="door-detail-stripe"></div>
        </div>

        <!-- Loading text -->
        <h1 class="loading-text" data-splitting>Loading...</h1>
      </div>
      <div class="door-panel-static bottom">SYSTEM ONLINE</div>
    </div>

    <div class="content">
      <p class="text-xl">Welcome to the loaded content!</p>
      <p class="text-lg">
        This is where your main application content would go.
      </p>
      <p class="mt-4 text-sm text-gray-400">Feel free to explore the system.</p>
    </div>

    <div id="messageBox" class="message-box rounded-lg shadow-lg"></div>

    <script>
      // Function to display a custom message box instead of alert()
      function showMessageBox(message, duration = 3000) {
        const messageBox = document.getElementById("messageBox");
        messageBox.textContent = message;
        messageBox.classList.add("show");

        setTimeout(() => {
          messageBox.classList.remove("show");
        }, duration);
      }

      window.onload = function () {
        try {
          // Initialize Splitting.js on the element with data-splitting attribute
          Splitting();

          // Get elements
          const chars = document.querySelectorAll(".char");
          const doorWrapper = document.querySelector(".door-wrapper");
          const doorSlideLeft = document.getElementById("doorSlideLeft");
          const doorSlideRight = document.getElementById("doorSlideRight");
          const loadingTextElement = document.querySelector(".loading-text");
          const contentContainer = document.querySelector(".content");
          const gearCanvas = document.getElementById("gearCanvas");

          // Gear drawing and animation logic (adapted from your provided code)
          function drawGears() {
            var canvas = document.getElementById("gearCanvas");
            var container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            if (!canvas.getContext) {
              console.error("Canvas not supported.");
              return;
            }
            var ctx = canvas.getContext("2d");

            // Updated gear colors for the new theme
            var gearColor = "#5d81a9"; // Lighter blue for gears
            var bgColor = ctx.createRadialGradient(
              canvas.width / 2,
              canvas.height / 2,
              0,
              canvas.width / 2,
              canvas.height / 2,
              Math.max(canvas.width, canvas.height)
            );
            bgColor.addColorStop(0, "#000d1a");
            bgColor.addColorStop(1, "#00001a");
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            var boltColor = "#4a5568"; // Darker blue for bolts
            var centerColor = "#3a577a"; // Main door panel blue for gear centers
            ctx.strokeStyle = gearColor;

            var arcA = [];

            function ArcCreator(x, y, r, angle, speed) {
              this.x = x;
              this.y = y;
              this.r = r;
              this.angle = angle;
              this.speed = speed;
            }

            function getMainArcs(
              x,
              y,
              radius,
              angle,
              speed,
              teethCount,
              teethSizeDivider,
              bars,
              color1
            ) {
              var newArc = new ArcCreator(x, y, radius, Math.PI * 2, speed);
              newArc.color1 = color1;
              newArc.innerArcs = [];
              for (
                var i = 0;
                i < Math.PI * 2;
                i += Math.PI / (teethCount / 2)
              ) {
                var point = [
                  x + Math.cos(i) * radius,
                  y + Math.sin(i) * radius,
                ];
                var innerArc = new ArcCreator(
                  point[0],
                  point[1],
                  radius / teethSizeDivider,
                  i
                );
                newArc.innerArcs.push(innerArc);
              }
              newArc.bars = [];
              for (var j = 0; j < Math.PI * 2; j += (Math.PI * 2) / bars) {
                var bar = {
                  x: x + Math.cos(j) * (radius * 0.8),
                  y: y + Math.sin(j) * (radius * 0.8),
                  angle: j,
                };
                newArc.bars.push(bar);
              }
              arcA.push(newArc);
            }

            function animateGears() {
              ctx.fillStyle = bgColor;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              for (var i = 0; i < arcA.length; i++) {
                ctx.strokeStyle = arcA[i].color1;
                ctx.fillStyle = arcA[i].color1;
                ctx.beginPath();
                ctx.arc(arcA[i].x, arcA[i].y, arcA[i].r, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.fillStyle = bgColor;
                ctx.arc(arcA[i].x, arcA[i].y, arcA[i].r * 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = arcA[i].color1;
                for (var k = 0; k < arcA[i].bars.length; k++) {
                  ctx.beginPath();
                  ctx.moveTo(arcA[i].x, arcA[i].y);
                  ctx.lineTo(arcA[i].bars[k].x, arcA[i].bars[k].y);
                  ctx.lineWidth = arcA[i].r / 8;
                  ctx.stroke();
                  arcA[i].bars[k].angle += arcA[i].speed;
                  arcA[i].bars[k].x =
                    arcA[i].x +
                    Math.cos(arcA[i].bars[k].angle) * (arcA[i].r * 0.8);
                  arcA[i].bars[k].y =
                    arcA[i].y +
                    Math.sin(arcA[i].bars[k].angle) * (arcA[i].r * 0.8);
                }

                for (var j = 0; j < arcA[i].innerArcs.length; j++) {
                  ctx.beginPath();
                  ctx.arc(
                    arcA[i].innerArcs[j].x,
                    arcA[i].innerArcs[j].y,
                    arcA[i].innerArcs[j].r,
                    0,
                    Math.PI * 2
                  );
                  ctx.fill();
                  arcA[i].innerArcs[j].angle += arcA[i].speed;
                  arcA[i].innerArcs[j].x =
                    arcA[i].x +
                    Math.cos(arcA[i].innerArcs[j].angle) * arcA[i].r;
                  arcA[i].innerArcs[j].y =
                    arcA[i].y +
                    Math.sin(arcA[i].innerArcs[j].angle) * arcA[i].r;
                }
                ctx.beginPath();
                ctx.fillStyle = centerColor;
                ctx.arc(arcA[i].x, arcA[i].y, arcA[i].r * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = arcA[i].color1;
                ctx.fillStyle = boltColor;
                ctx.beginPath();
                ctx.arc(arcA[i].x, arcA[i].y, arcA[i].r * 0.1, 0, Math.PI * 2);
                ctx.fill();
              }

              requestAnimationFrame(animateGears);
            }

            // Original gear layout's approximate bounding box and center
            const originalMinX = 61;
            const originalMaxX = 543;
            const originalMinY = 36;
            const originalMaxY = 452;
            const originalWidth = originalMaxX - originalMinX; // Approx 482
            const originalHeight = originalMaxY - originalMinY; // Approx 416
            const originalCenterX = originalMinX + originalWidth / 2; // Approx 302
            const originalCenterY = originalMinY + originalHeight / 2; // Approx 244

            // Determine the canvas's current center
            const canvasCenterX = canvas.width / 2;
            const canvasCenterY = canvas.height / 2;

            // Calculate a global scaling factor to fit the entire gear system
            // Use the minimum of width/height scaling to ensure the whole system fits
            const scaleFactor =
              Math.min(
                canvas.width / originalWidth,
                canvas.height / originalHeight
              ) * 0.8; // Scale down slightly to add some padding

            // Define the gear configurations with their original relative positions and radii
            const gearConfigs = [
              {
                x: 150,
                y: 120,
                r: 100,
                speed: 0.01,
                teeth: 20,
                teethDiv: 10,
                bars: 5,
                color: "#5d81a9",
              }, // Lighter blue
              {
                x: 150,
                y: 120,
                r: 50,
                speed: -0.015,
                teeth: 20,
                teethDiv: 10,
                bars: 5,
                color: "#4a5568",
              }, // Darker blue
              {
                x: 343,
                y: 201,
                r: 100,
                speed: -0.01,
                teeth: 20,
                teethDiv: 10,
                bars: 3,
                color: "#4a5568",
              }, // Darker blue
              {
                x: 225,
                y: 307,
                r: 50,
                speed: 0.02,
                teeth: 10,
                teethDiv: 6,
                bars: 2,
                color: "#5d81a9",
              }, // Lighter blue
              {
                x: 408,
                y: 346,
                r: 50,
                speed: 0.02,
                teeth: 10,
                teethDiv: 6,
                bars: 8,
                color: "#5d81a9",
              }, // Lighter blue
              {
                x: 290,
                y: 452,
                r: 100,
                speed: -0.01,
                teeth: 20,
                teethDiv: 10,
                bars: 4,
                color: "#4a5568",
              }, // Darker blue
              {
                x: 225,
                y: 307,
                r: 25,
                speed: 0.04,
                teeth: 10,
                teethDiv: 6,
                bars: 2,
                color: "#4a5568",
              }, // Darker blue
              {
                x: 61,
                y: 434,
                r: 120,
                speed: 0.01,
                teeth: 20,
                teethDiv: 12,
                bars: 10,
                color: "#5d81a9",
              }, // Lighter blue
              {
                x: 543,
                y: 36,
                r: 150,
                speed: 2 / 3 / 100,
                teeth: 30,
                teethDiv: 16,
                bars: 10,
                color: "#5d81a9",
              }, // Lighter blue
            ];

            // Add gears to the array with dynamically scaled positions and radii
            gearConfigs.forEach((config) => {
              const newX =
                canvasCenterX + (config.x - originalCenterX) * scaleFactor;
              const newY =
                canvasCenterY + (config.y - originalCenterY) * scaleFactor;
              const newRadius = config.r * scaleFactor;
              getMainArcs(
                newX,
                newY,
                newRadius,
                Math.PI * 2,
                config.speed,
                config.teeth,
                config.teethDiv,
                config.bars,
                config.color
              );
            });

            animateGears(); // Start the gear animation loop
          }

          // Define the Anime.js timeline
          const loadingTimeline = anime.timeline({
            easing: "easeInOutQuad",
            loop: false,
            autoplay: true,
          });

          // Phase 1: Main Doors Slide Out and Canvas fades in
          loadingTimeline
            .add(
              {
                targets: doorSlideLeft,
                translateX: "-100%", // Slide left panel out
                duration: 1500,
                easing: "easeInOutCubic",
              },
              0
            )
            .add(
              {
                targets: doorSlideRight,
                translateX: "100%", // Slide right panel out
                duration: 1500,
                easing: "easeInOutCubic",
              },
              0
            )
            .add(
              {
                targets: gearCanvas, // Fade in the canvas
                opacity: [0, 1],
                duration: 1000,
                easing: "easeOutQuad",
                begin: function () {
                  drawGears(); // Start drawing gears when canvas becomes visible
                },
              },
              "-=1000"
            ); // Start fading in canvas when doors are about halfway open

          // Phase 2: Loading Text Appears & Animates (starts as doors are mostly open)
          loadingTimeline
            .add(
              {
                targets: loadingTextElement,
                opacity: [0, 1], // Fade in the entire loading text container
                duration: 800,
                easing: "easeOutExpo",
              },
              "-=500"
            ) // Overlap with door animation

            .add(
              {
                targets: chars,
                opacity: [0, 1],
                translateY: [20, 0],
                rotateZ: [10, 0], // Subtle rotation
                delay: anime.stagger(60), // Stagger character animation
                duration: 700,
                easing: "easeOutBack", // Bouncy effect
                loop: true, // Keep looping
                direction: "alternate", // Ping-pong effect
                endDelay: 1000, // A short delay before reversing
              },
              "-=200"
            ); // Start character animation shortly after text container appears

          // Phase 3: Loading text, door wrapper, and canvas fade out, content fades in
          loadingTimeline.add(
            {
              targets: [doorWrapper, loadingTextElement, gearCanvas],
              opacity: 0,
              duration: 1500,
              easing: "easeOutQuad",
              complete: function () {
                doorWrapper.style.display = "none"; // Hide the door wrapper completely
                contentContainer.classList.add("show"); // Make content visible for animation
                // Animate the content in
                anime({
                  targets: contentContainer,
                  opacity: [0, 1],
                  translateY: [20, 0],
                  duration: 1000,
                  easing: "easeOutExpo",
                });
                showMessageBox("System Boot Complete!", 2500);
              },
            },
            "+=1500"
          ); // Start this animation 1.5 seconds after previous one finishes
        } catch (error) {
          console.error("An error occurred during page loading:", error);
          showMessageBox("Failed to load system. Please refresh.", 5000);
        }
      };
    </script>
  </body>
</html>
