<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nomal</title>
    <link rel="stylesheet" href="css/nomal.css" />
    <script
    src="https://unpkg.com/react@18/umd/react.development.js"
    crossorigin
    ></script>
    <script
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    crossorigin
    ></script>
    <script
    src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"
    ></script>
    <script
    src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"
    integrity="sha256-9zljDKpE/mQxmaR4V2cGVaQ7arF3CcXxarvgr7Sj8Uc="
    crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/nomal.js"></script>
    <!--
        순수 자바스크립트에는
        
        입력용으로
        prompt()
        
        출력용으로
        doucument.write()
        alert()
        console.log()

        확인용으로는
        confirm()

        변수는 어떤 자료를 담는 그릇
        let var const
        
        변수의 이름은 중복으로 선언 할수 없음
    -->
  </head>
  <body>
    <div class="con1">
      <input
        type="text"
        id="hell"
        placeholder="아무말이나 해봅시다"
        autocomplete="off"
      />
      <button id="submit">확인</button>
      <h1 id="dada"></h1>
    </div>
    <div class="con2">
      <input
        type="text"
        id="holl"
        placeholder="무슨말이니?"
        autocomplete="off"
      />
      <button id="sum">확인</button>
      <h1 id="caca"></h1>
    </div>
    <div class="con3">
      <h1 id="con3h"></h1>
    </div>
    <div class="con4">
      <h1 class="con4h"></h1>
    </div>
    <div class="con5 p-5 bg-primary text-white text-center">
      <h1>
        I am a
        <span
          style="text-decoration: underline"
          class="typed"
          data-typed-items="Developer, Designer, Creator"
        ></span>
      </h1>
    </div>

    <script>
      const selectTyped = document.querySelector(".typed");
      if (selectTyped) {
        let typed_strings = selectTyped.getAttribute("data-typed-items");
        typed_strings = typed_strings.split(",");
        new Typed(".typed", {
          strings: typed_strings,
          loop: true,
          typeSpeed: 100,
          backSpeed: 50,
          backDelay: 2000,
        });
      }
    </script>
    
      <div class="container">
        <div class="visual"></div>
        <div class="con1"></div>
        <div class="con2"></div>
        <div class="con3"></div>
        <div class="con4"></div>
      </div>
  
  </body>
</html>
