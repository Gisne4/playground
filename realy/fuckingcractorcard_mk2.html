<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
      /* CSS with custom color variables */
      :root {
        --pointer-x: 50%;
        --pointer-y: 50%;
        --pointer-from-center: 0;
        --pointer-from-top: 0.5;
        --pointer-from-left: 0.5;
        --card-opacity: 0;
        --rotate-x: 0deg;
        --rotate-y: 0deg;
        --background-x: 50%;
        --background-y: 50%;
        --grain: none;
        --icon: none;
        --behind-gradient: none;
        --inner-gradient: none;
        --sunpillar-1: hsl(2, 100%, 73%);
        --sunpillar-2: hsl(53, 100%, 69%);
        --sunpillar-3: hsl(93, 100%, 69%);
        --sunpillar-4: hsl(176, 100%, 76%);
        --sunpillar-5: hsl(228, 100%, 74%);
        --sunpillar-6: hsl(283, 100%, 73%);
        --sunpillar-clr-1: var(--sunpillar-1);
        --sunpillar-clr-2: var(--sunpillar-2);
        --sunpillar-clr-3: var(--sunpillar-3);
        --sunpillar-clr-4: var(--sunpillar-4);
        --sunpillar-clr-5: var(--sunpillar-5);
        --sunpillar-clr-6: var(--sunpillar-6);
        --card-radius: 30px;

        /* NEW CUSTOM COLOR VARIABLES */
        --pc-main-bg: #08192c;
        --pc-text-light: rgb(142, 206, 231);
        --pc-text-medium: rgba(42, 115, 138, 0.7);
        --pc-card-inner-bg-opacity: 0.9;
        --pc-glass-base-opacity: 0.1; /* For info box background/border, button border */
        --pc-button-hover-opacity: 0.4; /* For button hover border */
        --pc-h3-gradient-bottom: #6f6fbe;
        --pc-p-gradient-bottom: #4a4ac0;
      }

      .pc-card-wrapper {
        perspective: 500px;
        transform: translate3d(0, 0, 0.1px);
        position: absolute;
        touch-action: none;
        right: 100px;
        top: 50%;
      }

      .pc-card-wrapper::before {
        content: "";
        position: absolute;
        inset: -10px;
        background: inherit;
        background-position: inherit;
        border-radius: inherit;
        transition: all 0.5s ease;
        filter: contrast(2) saturate(2) blur(36px);
        transform: scale(0.8) translate3d(0, 0, 0.1px);
        background-size: 100% 100%;
        background-image: var(--behind-gradient);
      }

      .pc-card-wrapper:hover,
      .pc-card-wrapper.active {
        --card-opacity: 1;
      }

      .pc-card-wrapper:hover::before,
      .pc-card-wrapper.active::before {
        filter: contrast(1) saturate(2) blur(40px) opacity(1);
        transform: scale(0.9) translate3d(0, 0, 0.1px);
      }

      .pc-card {
        height: 80svh;
        max-height: 540px;
        display: grid;
        aspect-ratio: 0.718;
        border-radius: var(--card-radius);
        position: relative;
        background-blend-mode: color-dodge, normal, normal, normal;
        animation: glow-bg 12s linear infinite;
        box-shadow: rgba(0, 0, 0, 0.8)
          calc((var(--pointer-from-left) * 10px) - 3px)
          calc((var(--pointer-from-top) * 20px) - 6px) 20px -5px;
        transition: transform 1s ease;
        transform: translate3d(0, 0, 0.1px) rotateX(0deg) rotateY(0deg);
        background-size: 100% 100%;
        background-position: 0 0, 0 0, 50% 50%, 0 0;
        background-image: radial-gradient(
            farthest-side circle at var(--pointer-x) var(--pointer-y),
            hsla(266, 100%, 90%, var(--card-opacity)) 4%,
            hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
            hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
            hsla(266, 0%, 60%, 0) 100%
          ),
          radial-gradient(35% 52% at 55% 20%, #00ffaac4 0%, #073aff00 100%),
          radial-gradient(100% 100% at 50% 50%, #00c1ffff 1%, #073aff00 76%),
          conic-gradient(
            from 124deg at 50% 50%,
            #c137ffff 0%,
            #07c6ffff 40%,
            #07c6ffff 60%,
            #c137ffff 100%
          );
        overflow: hidden;
      }

      .pc-card:hover,
      .pc-card.active {
        transition: none;
        transform: translate3d(0, 0, 0.1px) rotateX(var(--rotate-y))
          rotateY(var(--rotate-x));
      }

      .pc-card * {
        display: grid;
        grid-area: 1/-1;
        border-radius: var(--card-radius);
        transform: translate3d(0, 0, 0.1px);
        pointer-events: none;
      }

      .pc-inside {
        inset: 1px;
        position: absolute;
        background-image: var(--inner-gradient);
        background-color: rgba(0, 0, 0, var(--pc-card-inner-bg-opacity));
        transform: translate3d(0, 0, 0.01px);
      }

      .pc-shine {
        mask-image: var(--icon);
        mask-mode: luminance;
        mask-repeat: repeat;
        mask-size: 150%;
        mask-position: top calc(200% - (var(--background-y) * 5)) left
          calc(100% - var(--background-x));
        transition: filter 0.6s ease;
        filter: brightness(0.66) contrast(1.33) saturate(0.33) opacity(0.5);
        animation: holo-bg 18s linear infinite;
        mix-blend-mode: color-dodge;
      }

      .pc-shine,
      .pc-shine::after {
        --space: 5%;
        --angle: -45deg;
        transform: translate3d(0, 0, 1px);
        overflow: hidden;
        z-index: 3;
        background: transparent;
        background-size: cover;
        background-position: center;
        background-image: repeating-linear-gradient(
            0deg,
            var(--sunpillar-clr-1) calc(var(--space) * 1),
            var(--sunpillar-clr-2) calc(var(--space) * 2),
            var(--sunpillar-clr-3) calc(var(--space) * 3),
            var(--sunpillar-clr-4) calc(var(--space) * 4),
            var(--sunpillar-clr-5) calc(var(--space) * 5),
            var(--sunpillar-clr-6) calc(var(--space) * 6),
            var(--sunpillar-clr-1) calc(var(--space) * 7)
          ),
          repeating-linear-gradient(
            var(--angle),
            #0e152e 0%,
            hsl(180, 10%, 60%) 3.8%,
            hsl(180, 29%, 66%) 4.5%,
            hsl(180, 10%, 60%) 5.2%,
            #0e152e 10%,
            #0e152e 12%
          ),
          radial-gradient(
            farthest-corner circle at var(--pointer-x) var(--pointer-y),
            hsla(0, 0%, 0%, 0.1) 12%,
            hsla(0, 0%, 0%, 0.15) 20%,
            hsla(0, 0%, 0%, 0.25) 120%
          );
        background-position: 0 var(--background-y),
          var(--background-x) var(--background-y), center;
        background-blend-mode: color, hard-light;
        background-size: 500% 500%, 300% 300%, 200% 200%;
        background-repeat: repeat;
      }

      .pc-shine::before,
      .pc-shine::after {
        content: "";
        background-position: center;
        background-size: cover;
        grid-area: 1/1;
        opacity: 0;
      }

      .pc-card:hover .pc-shine,
      .pc-card.active .pc-shine {
        filter: brightness(0.85) contrast(1.5) saturate(0.5);
        animation: none;
      }

      .pc-card:hover .pc-shine::before,
      .pc-card.active .pc-shine::before,
      .pc-card:hover .pc-shine::after,
      .pc-card.active .pc-shine::after {
        opacity: 1;
      }

      .pc-shine::before {
        background-image: linear-gradient(
            45deg,
            var(--sunpillar-4),
            var(--sunpillar-5),
            var(--sunpillar-6),
            var(--sunpillar-1),
            var(--sunpillar-2),
            var(--sunpillar-3)
          ),
          radial-gradient(
            circle at var(--pointer-x) var(--pointer-y),
            hsl(0, 0%, 70%) 0%,
            hsla(0, 0%, 30%, 0.2) 90%
          ),
          var(--grain);
        background-size: 250% 250%, 100% 100%, 220px 220px;
        background-position: var(--pointer-x) var(--pointer-y), center,
          calc(var(--pointer-x) * 0.01) calc(var(--pointer-y) * 0.01);
        background-blend-mode: color-dodge;
        filter: brightness(calc(2 - var(--pointer-from-center)))
          contrast(calc(var(--pointer-from-center) + 2))
          saturate(calc(0.5 + var(--pointer-from-center)));
        mix-blend-mode: luminosity;
      }

      .pc-shine::after {
        background-position: 0 var(--background-y),
          calc(var(--background-x) * 0.4) calc(var(--background-y) * 0.5),
          center;
        background-size: 200% 300%, 700% 700%, 100% 100%;
        mix-blend-mode: difference;
        filter: brightness(0.8) contrast(1.5);
      }

      .pc-glare {
        transform: translate3d(0, 0, 1.1px);
        overflow: hidden;
        background-image: radial-gradient(
          farthest-corner circle at var(--pointer-x) var(--pointer-y),
          hsl(248, 25%, 80%) 12%,
          hsla(207, 40%, 30%, 0.8) 90%
        );
        mix-blend-mode: overlay;
        filter: brightness(0.8) contrast(1.2);
        z-index: 4;
      }

      .pc-avatar-content {
        mix-blend-mode: screen;
        overflow: hidden;
      }

      .pc-avatar-content .avatar {
        width: 100%;
        position: absolute;
        left: 50%;
        transform: translateX(-50%) scale(1);
        bottom: 2px;
        opacity: calc(1.75 - var(--pointer-from-center));
      }

      .pc-avatar-content::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        backdrop-filter: blur(30px);
        mask: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 1) 90%,
          rgba(0, 0, 0, 1) 100%
        );
        pointer-events: none;
      }

      .pc-user-info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 20px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: hsla(0, 0%, 100%, var(--pc-glass-base-opacity));
        backdrop-filter: blur(30px);
        border: 1px solid hsla(0, 0%, 100%, var(--pc-glass-base-opacity));
        border-radius: 15px;
        padding: 12px 14px;
        pointer-events: auto;
      }

      .pc-user-details {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pc-mini-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid hsla(0, 0%, 100%, var(--pc-glass-base-opacity));
        flex-shrink: 0;
      }

      .pc-mini-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }

      .pc-user-text {
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .pc-handle {
        font-size: 14px;
        font-weight: 500;
        color: hsla(0, 0%, 100%, var(--pc-card-inner-bg-opacity));
        line-height: 1;
      }

      .pc-status {
        font-size: 14px;
        color: var(--pc-text-medium);
        line-height: 1;
      }

      .pc-contact-btn {
        border: 1px solid hsla(0, 0%, 100%, var(--pc-glass-base-opacity));
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        color: hsla(0, 0%, 100%, var(--pc-card-inner-bg-opacity));
        cursor: pointer;
        transition: all 0.2s ease;
        backdrop-filter: blur(10px);
        background-color: var(--pc-main-bg);
      }

      .pc-contact-btn:hover {
        border-color: hsla(0, 0%, 100%, var(--pc-button-hover-opacity));
        transform: translateY(-1px);
        transition: all 0.2s ease;
      }

      .pc-content {
        max-height: 100%;
        overflow: hidden;
        text-align: center;
        position: relative;
        transform: translate3d(
          calc(var(--pointer-from-left) * -6px + 3px),
          calc(var(--pointer-from-top) * -6px + 3px),
          0.1px
        ) !important;
        z-index: 5;
        mix-blend-mode: luminosity;
      }

      .pc-details {
        width: 100%;
        position: absolute;
        top: 3em;
        display: flex;
        flex-direction: column;
      }

      .pc-details h3 {
        font-weight: 600;
        margin: 0;
        font-size: min(5svh, 3em);
        margin: 0;
        background-image: linear-gradient(
          to bottom,
          var(--pc-text-light),
          var(--pc-h3-gradient-bottom)
        );
        background-size: 1em 1.5em;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
      }

      .pc-details p {
        font-weight: 600;
        position: relative;
        top: -12px;
        white-space: nowrap;
        font-size: 16px;
        margin: 0 auto;
        width: min-content;
        background-image: linear-gradient(
          to bottom,
          var(--pc-text-light),
          var(--pc-p-gradient-bottom)
        );
        background-size: 1em 1.5em;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
      }

      @keyframes glow-bg {
        0% {
          --bgrotate: 0deg;
        }
        100% {
          --bgrotate: 360deg;
        }
      }

      @keyframes holo-bg {
        0% {
          background-position: 0 var(--background-y), 0 0, center;
        }
        100% {
          background-position: 0 var(--background-y), 90% 90%, center;
        }
      }

      @media (max-width: 768px) {
        .pc-card {
          height: 70svh;
          max-height: 450px;
        }
        .pc-details {
          top: 2em;
        }
        .pc-details h3 {
          font-size: min(4svh, 2.5em);
        }
        .pc-details p {
          font-size: 14px;
        }
        .pc-user-info {
          bottom: 15px;
          left: 15px;
          right: 15px;
          padding: 10px 12px;
        }
        .pc-mini-avatar {
          width: 28px;
          height: 28px;
        }
        .pc-user-details {
          gap: 10px;
        }
        .pc-handle {
          font-size: 13px;
        }
        .pc-status {
          font-size: 10px;
        }
        .pc-contact-btn {
          padding: 6px 12px;
          font-size: 11px;
        }
      }

      @media (max-width: 480px) {
        .pc-card {
          height: 60svh;
          max-height: 380px;
        }
        .pc-details {
          top: 1.5em;
        }
        .pc-details h3 {
          font-size: min(3.5svh, 2em);
        }
        .pc-details p {
          font-size: 12px;
          top: -8px;
        }
        .pc-user-info {
          bottom: 12px;
          left: 12px;
          right: 12px;
          padding: 8px 10px;
          border-radius: 50px;
        }
        .pc-mini-avatar {
          width: 24px;
          height: 24px;
        }
        .pc-user-details {
          gap: 8px;
        }
        .pc-handle {
          font-size: 12px;
        }
        .pc-status {
          font-size: 9px;
        }
        .pc-contact-btn {
          padding: 5px 10px;
          font-size: 10px;
          border-radius: 50px;
        }
      }

      @media (max-width: 320px) {
        .pc-card {
          height: 55svh;
          max-height: 320px;
        }
        .pc-details h3 {
          font-size: min(3svh, 1.5em);
        }
        .pc-details p {
          font-size: 11px;
        }
        .pc-user-info {
          padding: 6px 8px;
          border-radius: 50px;
        }
        .pc-mini-avatar {
          width: 20px;
          height: 20px;
        }
        .pc-user-details {
          gap: 6px;
        }
        .pc-handle {
          font-size: 11px;
        }
        .pc-status {
          font-size: 8px;
        }
        .pc-contact-btn {
          padding: 4px 8px;
          font-size: 9px;
          border-radius: 50px;
        }
      }
    </style>
  </head>
  <body>
    <div
      class="pc-card-wrapper"
      id="w"
      style="
        --icon: none;
        --grain: none;
        --behind-gradient: radial-gradient(
            farthest-side circle at var(--px) var(--py),
            hsla(266, 100%, 90%, var(--o)) 4%,
            hsla(266, 50%, 80%, calc(var(--o) * 0.75)) 10%,
            hsla(266, 25%, 70%, calc(var(--o) * 0.5)) 50%,
            hsla(266, 0%, 60%, 0) 100%
          ),
          radial-gradient(35% 52% at 55% 20%, #00ffaac4 0%, #073aff00 100%),
          radial-gradient(100% 100% at 50% 50%, #00c1ffff 1%, #073aff00 76%),
          conic-gradient(
            from 124deg at 50% 50%,
            #c137ffff 0%,
            #07c6ffff 40%,
            #07c6ffff 60%,
            #c137ffff 100%
          );
        --inner-gradient: linear-gradient(145deg, #60496e8c 0%, #71c4ff44 100%);
      "
    >
      <section id="c" class="pc-card">
        <div class="pc-inside">
          <div class="pc-shine"></div>
          <div class="pc-glare"></div>
          <div class="pc-content pc-avatar-content">
            <img
              class="avatar"
              src=""
              alt=""
              loading="lazy"
              onerror="this.style.display='none';"
              id="ma"
            />
            <div class="pc-user-info">
              <div class="pc-user-details">
                <div class="pc-mini-avatar">
                  <img
                    src=""
                    alt=""
                    loading="lazy"
                    onerror="this.style.opacity='0.5'; this.src=A;"
                    id="mia"
                  />
                </div>
                <div class="pc-user-text">
                  <div class="pc-handle" id="ph"></div>
                  <div class="pc-status" id="ps"></div>
                </div>
              </div>
              <button
                class="pc-contact-btn"
                id="cb"
                style="pointer-events: auto"
                type="button"
                aria-label=""
              ></button>
            </div>
          </div>
          <div class="pc-content">
            <div class="pc-details">
              <h3 id="pn"></h3>
              <p id="pt"></p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const w = document.getElementById("w"),
        c = document.getElementById("c"),
        ma = document.getElementById("ma"),
        mia = document.getElementById("mia"),
        pn = document.getElementById("pn"),
        pt = document.getElementById("pt"),
        ph = document.getElementById("ph"),
        ps = document.getElementById("ps"),
        cb = document.getElementById("cb");
      const CFG = { S: 600, I: 1500, IX: 70, IY: 60 };
      const N = "KRLEE",
        T = "Software Engineer",
        H = "GISNE4",
        S = "Online",
        CT = "Contact Me",
        A = "https://gisne4.github.io/playground/img/Untitled-2.png";
      // NEW: Customizable Color/Design Values
      const CLR = {
        mainBg: "#1a1a1a",
        textLight: "white",
        textMedium: "rgba(255, 255, 255, 0.7)",
        cardInnerBgOpacity: 0.9,
        glassBaseOpacity: 0.1,
        buttonHoverOpacity: 0.4,
        h3GradBottom: "#6f6fbe",
        pGradBottom: "#4a4ac0",
      };
      const V = {
        clamp: (v, n = 0, x = 100) => Math.min(Math.max(v, n), x),
        round: (v, p = 3) => parseFloat(v.toFixed(p)),
        adj: (v, fm, fM, tm, tM) =>
          V.round(tm + ((tM - tm) * (v - fm)) / (fM - fm)),
        ease: (x) =>
          x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
      };
      let animId = null;
      const upd = (_, Y) => {
        const W = c.clientWidth,
          H = c.clientHeight,
          pX = V.clamp((100 / W) * _),
          pY = V.clamp((100 / H) * Y),
          cX = pX - 50,
          cY = pY - 50;
        w.style.setProperty("--pointer-x", `${pX}%`);
        w.style.setProperty("--pointer-y", `${pY}%`);
        w.style.setProperty("--background-x", `${V.adj(pX, 0, 100, 35, 65)}%`);
        w.style.setProperty("--background-y", `${V.adj(pY, 0, 100, 35, 65)}%`);
        w.style.setProperty(
          "--pointer-from-center",
          `${V.clamp(Math.hypot(pY - 50, pX - 50) / 50, 0, 1)}`
        );
        w.style.setProperty("--pointer-from-top", `${pY / 100}`);
        w.style.setProperty("--pointer-from-left", `${pX / 100}`);
        w.style.setProperty("--rotate-x", `${V.round(-(cX / 5))}deg`);
        w.style.setProperty("--rotate-y", `${V.round(cY / 4)}deg`);
      };
      const startA = (d, sX, sY) => {
        const st = performance.now(),
          tX = w.clientWidth / 2,
          tY = w.clientHeight / 2;
        const ani = (ct) => {
          const el = ct - st,
            pr = V.clamp(el / d, 0, 1),
            eP = V.ease(pr),
            cuX = V.adj(eP, 0, 1, sX, tX),
            cuY = V.adj(eP, 0, 1, sY, tY);
          upd(cuX, cuY);
          if (pr < 1) {
            animId = requestAnimationFrame(ani);
          } else {
            animId = null;
          }
        };
        cancelAnimationFrame(animId);
        animId = requestAnimationFrame(ani);
      };
      const hPM = (e) => {
        const r = c.getBoundingClientRect();
        upd(e.clientX - r.left, e.clientY - r.top);
      };
      const hPE = () => {
        cancelAnimationFrame(animId);
        w.classList.add("active");
        c.classList.add("active");
      };
      const hPL = (e) => {
        startA(CFG.S, e.offsetX, e.offsetY);
        w.classList.remove("active");
        c.classList.remove("active");
      };
      const oCC = () => {
        console.log("Contact clicked");
      };
      document.addEventListener("DOMContentLoaded", () => {
        if (!c || !w) {
          return;
        }
        ma.src = A;
        ma.alt = `${N} avatar`;
        mia.src = A;
        mia.alt = `${N} mini avatar`;
        pn.textContent = N;
        pt.textContent = T;
        ph.textContent = `@${H}`;
        ps.textContent = S;
        cb.textContent = CT;
        cb.setAttribute("aria-label", `Contact ${N}`);
        // NEW: Set custom color/design properties
        w.style.setProperty("--pc-main-bg", CLR.mainBg);
        w.style.setProperty("--pc-text-light", CLR.textLight);
        w.style.setProperty("--pc-text-medium", CLR.textMedium);
        w.style.setProperty(
          "--pc-card-inner-bg-opacity",
          CLR.cardInnerBgOpacity
        );
        w.style.setProperty("--pc-glass-base-opacity", CLR.glassBaseOpacity);
        w.style.setProperty(
          "--pc-button-hover-opacity",
          CLR.buttonHoverOpacity
        );
        w.style.setProperty("--pc-h3-gradient-bottom", CLR.h3GradBottom);
        w.style.setProperty("--pc-p-gradient-bottom", CLR.pGradBottom);

        w.style.setProperty(
          "--behind-gradient",
          "radial-gradient(farthest-side circle at var(--pointer-x) var(--pointer-y),hsla(266,100%,90%,var(--card-opacity)) 4%,hsla(266,50%,80%,calc(var(--card-opacity)*0.75)) 10%,hsla(266,25%,70%,calc(var(--card-opacity)*0.5)) 50%,hsla(266,0%,60%,0) 100%),radial-gradient(35% 52% at 55% 20%,#00ffaac4 0%,#073aff00 100%),radial-gradient(100% 100% at 50% 50%,#00c1ffff 1%,#073aff00 76%),conic-gradient(from 124deg at 50% 50%,#c137ffff 0%,#07c6ffff 40%,#07c6ffff 60%,#c137ffff 100%)"
        );
        w.style.setProperty(
          "--inner-gradient",
          "linear-gradient(145deg,#60496e8c 0%,#71C4FF44 100%)"
        );
        c.addEventListener("pointerenter", hPE);
        c.addEventListener("pointermove", hPM);
        c.addEventListener("pointerleave", hPL);
        cb.addEventListener("click", oCC);
        const iX = w.clientWidth - CFG.IX,
          iY = CFG.IY;
        upd(iX, iY);
        startA(CFG.I, iX, iY);
      });
      window.addEventListener("beforeunload", () => {
        if (c) {
          c.removeEventListener("pointerenter", hPE);
          c.removeEventListener("pointermove", hPM);
          c.removeEventListener("pointerleave", hPL);
        }
        if (cb) {
          cb.removeEventListener("click", oCC);
        }
        cancelAnimationFrame(animId);
      });
    </script>
  </body>
