<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie DB Inspired</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        background-color: #111;
        color: #fff;
      }
      :root {
        --orange-color: #99833ab6;
      }
      .container {
        width: 95%;
        max-width: 1200px;
        margin: 0 auto;
      }
      .visual {
        height: 400px;
        margin-bottom: 30px;
        position: relative;
        overflow: hidden; /* Ensure slider doesn't overflow */
      }
      .visual .slider {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .visual .slider .panel {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        transition: transform 0.5s ease-in-out;
      }
      .visual .slider .panel .movie-item {
        flex: 0 0 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 50px;
        box-sizing: border-box;
      }
      .visual .slider .panel .movie-item .slide-content {
        max-width: 500px;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 10px;
      }
      .visual .slider .panel .movie-item .slide-title {
        font-size: 2em;
        font-weight: bold;
        margin-bottom: 10px;
        color: #fff;
      }
      .visual .slider .panel .movie-item .slide-overview {
        font-size: 1.1em;
        line-height: 1.5;
        color: #eee;
      }
      .visual .slider .navi {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .visual .slider .navi li {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.8;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .visual .slider .navi li.on {
        opacity: 1;
        background: #ffc300;
      }
      .visual .slider .left,
      .visual .slider .right {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        font-size: 1.2em;
        transition: background-color 0.3s ease;
        z-index: 10;
      }
      .visual .slider .left:hover,
      .visual .slider .right:hover {
        background-color: rgba(0, 0, 0, 0.7);
      }
      .visual .slider .left {
        left: 20px;
      }
      .visual .slider .right {
        right: 20px;
      }

      .con1 {
        margin-bottom: 30px;
        padding: 20px;
        background-color: #1a1a1a;
        border-radius: 10px;
      }
      .con1 h2 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #ffc300;
      }
      .con1 .search-container {
        margin-bottom: 30px;
      }
      .con1 input[type="text"] {
        padding: 12px 15px;
        width: 70%;
        border: 1px solid #444;
        border-radius: 5px;
        margin-right: 10px;
        background-color: #222;
        color: #eee;
        font-size: 1em;
      }
      .con1 {
        padding: 8px 20px;
        background-color: #1a14038e;
        color: #111;
        border: none;
        border-radius: 5px;
        box-shadow: 5px 3px 10px var(--orange-color);
        font-size: 1em;
        transition: background-color 0.3s ease;
      }

      .con1 .search-active {
        display: inline-block;
      }

      .con2,
      .con3,
      .con4 {
        margin-bottom: 30px;
        padding: 20px;
        background-color: #1a1a1a;
        border-radius: 10px;
      }
      .con2 h2,
      .con3 h2,
      .con4 h2 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #ffc300;
      }
      .movie-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
      }
      .movie-list .movie-item {
        background-color: #222;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        transition: transform 0.2s ease;
        position: relative;
      }
      .movie-list .movie-item:hover {
        transform: scale(1.05);
      }
      .movie-list .movie-item img {
        width: 100%;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .movie-list .movie-item h3 {
        font-size: 1.2em;
        margin-bottom: 5px;
        color: #eee;
      }
      .movie-list .movie-item p {
        font-size: 0.9em;
        color: #ccc;
      }
      .movie-list .movie-item .overview {
        display: none;
        font-size: 0.8em;
        color: #ddd;
        margin-top: 10px;
        position: absolute;
        top: 50%;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        width: 150%;
        padding: 10px;
        box-sizing: border-box;

        z-index: 1;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5); /* Add shadow for pop out effect */
      }
      .movie-list .movie-item:hover .overview {
        display: block;
        top: 0;
      }

      .con4 {
        background-color: #111;
        padding: 0;
        margin-bottom: 0;
      }
      .con4 h2 {
        color: #fff;
        padding-left: 20px;
        font-size: 1.8em;
        margin-bottom: 20px;
      }
      .con4 .ads {
        height: 200px;
        background-color: #333;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        margin: 20px;
        text-align: center;
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="visual">
        <div class="slider">
          <ul class="panel"></ul>
          <ul class="navi"></ul>
          <div class="left"><i class="fa-solid fa-chevron-left"></i></div>
          <div class="right"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </div>
      <div class="con1">
        <h2>Search Movies</h2>
        <div class="search-container">
          <input
            type="text"
            id="search-query"
            placeholder="Enter movie title"
          />
        </div>
        <div id="results-container" class="movie-list"></div>
      </div>
      <div class="con2">
        <h2>Popular Movies</h2>
        <div id="popular-container" class="movie-list"></div>
      </div>
      <div class="con3">
        <h2>Upcoming Movies</h2>
        <div id="upcoming-container" class="movie-list"></div>
      </div>
      <div class="con4">
        <h2>Advertisement</h2>
        <div class="ads">Your Advertisement Space</div>
      </div>
    </div>
    <script>
      const apiKey = "f710f4911d740be4e790af0963540a1a";
      const searchBaseUrl = "https://api.themoviedb.org/3/search/movie";
      const popularBaseUrl = "https://api.themoviedb.org/3/movie/popular";
      const topRatedBaseUrl = "https://api.themoviedb.org/3/movie/top_rated";
      const upcomingBaseUrl = "https://api.themoviedb.org/3/movie/upcoming";
      const imageBaseUrl = "https://image.tmdb.org/t/p/w500";
      const resultsContainer = document.getElementById("results-container");
      const popularContainer = document.getElementById("popular-container");
      const upcomingContainer = document.getElementById("upcoming-container");
      const slider = document.querySelector(".slider");
      const panel = document.querySelector(".panel");
      const naviBar = document.querySelector(".navi");
      const leftArrow = document.querySelector(".left");
      const rightArrow = document.querySelector(".right");
      const searchInput = document.getElementById("search-query");

      let movieCount = 0;
      let panelIndex = 0;
      let slideInterval;
      let slideSpeed = 5000; // Default slide speed
      let autoSlideEnabled = true;

      function changeClass(element, index) {
        element.forEach((item) => item.classList.remove("on"));
        element[index].classList.add("on");
      }

      function showSlide(index) {
        panel.style.transform = `translateX(-${index * (100 / movieCount)}%)`;
        const naviItems = document.querySelectorAll(".navi li");
        if (naviItems.length > 0) {
          changeClass(naviItems, index);
        }
        panelIndex = index;
      }

      function nextSlide() {
        panelIndex = (panelIndex + 1) % movieCount;
        showSlide(panelIndex);
      }

      function prevSlide() {
        panelIndex = (panelIndex - 1 + movieCount) % movieCount;
        showSlide(panelIndex);
      }

      function startAutoSlide() {
        if (autoSlideEnabled) {
          slideInterval = setInterval(nextSlide, slideSpeed);
        }
      }

      function stopAutoSlide() {
        clearInterval(slideInterval);
      }

      function updateOverviewPosition(overviewDiv, event, movieItem) {
        const offsetX =
          event.clientX - movieItem.offsetLeft - overviewDiv.offsetWidth / 2;
        const itemHeight = movieItem.offsetHeight;
        const overviewHeight = overviewDiv.offsetHeight;
        const offsetY = itemHeight + 10;
        overviewDiv.style.left = `${offsetX}px`;
        overviewDiv.style.top = `${offsetY}px`;
      }

      async function fetchMovies(url, container, isSlider = false) {
        try {
          const response = await fetch(url);
          const data = await response.json();

          if (isSlider) {
            panel.innerHTML = "";
            naviBar.innerHTML = "";
            movieCount = 0;
          } else {
            container.innerHTML = "";
          }

          if (data.results && data.results.length > 0) {
            data.results.forEach((movie, index) => {
              const movieDiv = document.createElement("div");
              movieDiv.classList.add("movie-item");
              if (isSlider) {
                movieDiv.style.backgroundImage = `url(${imageBaseUrl}${movie.backdrop_path})`;
                movieDiv.style.backgroundSize = "cover";
                movieDiv.style.backgroundPosition = "center";

                const slideContent = document.createElement("div");
                slideContent.classList.add("slide-content");
                slideContent.innerHTML = `
                                        <h3 class="slide-title">${movie.title}</h3>
                                        <p class="slide-overview">${movie.overview}</p>
                                    `;
                movieDiv.appendChild(slideContent);
                panel.appendChild(movieDiv);

                const naviItem = document.createElement("li");
                naviItem.addEventListener("click", () => {
                  showSlide(index);
                  stopAutoSlide();
                  startAutoSlide();
                });
                naviBar.appendChild(naviItem);
                movieCount++;
                if (index === 0) {
                  naviItem.classList.add("on");
                }
              } else {
                const movieContent = document.createElement("div");
                movieContent.innerHTML = `
                                        <img src="${imageBaseUrl}${movie.poster_path}" alt="Poster">
                                        <h3>${movie.title}</h3>
                                        <p>Release: ${movie.release_date}</p>
                                        <p>평점: ${movie.vote_average}</p>
                                        <div class="overview">${movie.overview}</div>
                                    `;
                movieDiv.appendChild(movieContent);
                container.appendChild(movieDiv);
                movieDiv.addEventListener("mousemove", (event) => {
                  const overviewDiv = movieDiv.querySelector(".overview");
                  if (overviewDiv) {
                    updateOverviewPosition(overviewDiv, event, movieDiv);
                  }
                });
              }
            });
            if (isSlider && movieCount > 0) {
              showSlide(0);
              startAutoSlide();
            }
          } else {
            container.innerHTML = "<p>No movies found.</p>";
            if (isSlider) {
              panel.innerHTML = "<p>No movies found.</p>";
            }
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          container.innerHTML = "<p>An error occurred while fetching data.</p>";
          if (isSlider) {
            panel.innerHTML = "<p>An error occurred while fetching data.</p>";
          }
        }
      }

      async function searchMovies() {
        const query = document.getElementById("search-query").value;

        const apiUrl = `${searchBaseUrl}?api_key=${apiKey}&language=ko-KR&query=${encodeURIComponent(
          query
        )}`;

        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          resultsContainer.innerHTML = "";

          if (data.results && data.results.length > 0) {
            data.results.forEach((movie) => {
              const movieDiv = document.createElement("div");
              movieDiv.classList.add("movie-item");
              const movieContent = document.createElement("div");
              movieContent.innerHTML = `
                                        <img src="${imageBaseUrl}${movie.poster_path}" alt="Poster">
                                        <h3>${movie.title}</h3>
                                        <p>Release: ${movie.release_date}</p>
                                        <p>평점: ${movie.vote_average}</p>
                                        <div class="overview">${movie.overview}</div>
                                    `;
              movieDiv.appendChild(movieContent);
              resultsContainer.appendChild(movieDiv);
              movieDiv.addEventListener("mousemove", (event) => {
                const overviewDiv = movieDiv.querySelector(".overview");
                if (overviewDiv) {
                  updateOverviewPosition(overviewDiv, event, movieDiv);
                }
              });
            });
          } else {
            resultsContainer.innerHTML =
              "<p>No movies found matching your search.</p>";
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          resultsContainer.innerHTML =
            "<p>An error occurred while fetching data.</p>";
        }
      }

      leftArrow.addEventListener("click", () => {
        prevSlide();
        stopAutoSlide();
        startAutoSlide();
      });

      rightArrow.addEventListener("click", () => {
        nextSlide();
        stopAutoSlide();
        startAutoSlide();
      });

      slider.addEventListener("mouseenter", stopAutoSlide);
      slider.addEventListener("mouseleave", startAutoSlide);

      searchInput.addEventListener("input", () => {
        searchMovies();
      });

      fetchMovies(
        `${topRatedBaseUrl}?api_key=${apiKey}&language=ko-KR&page=1`,
        panel,
        true
      );
      fetchMovies(
        `${popularBaseUrl}?api_key=${apiKey}&language=ko-KR&page=1`,
        popularContainer
      );
      fetchMovies(
        `${upcomingBaseUrl}?api_key=${apiKey}&language=ko-KR&page=1`,
        upcomingContainer
      );
    </script>
  </body>
</html>
