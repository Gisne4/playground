<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dik</title>
  </head>
  <style>
    * {
      margin: 0px;
      padding: 0px;
    }
    .con1 {
      width: 90vw;
      margin-inline: 5vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      align-content: center;
      text-align: center;
    }
    .imgContainer {
      margin-bottom: 100px;
    }
    .imgList {
      display: flex;
      list-style: none;
      gap: 30px;
      width: 100%;
    }
    .imgList li {
      width: calc(100% / 4 -30px);
    }
    .imgList img {
      width: 100%;
      display: block;
    }
  </style>
  <body>
    <div class="con1">
      <div class="imgContainer">
        <img id="bigimg" src="img/pic1.jpg" alt="" />
      </div>
      <ul class="imgList" id="imgL">
        <li><img src="img/pic1.jpg" alt="" /></li>
        <li><img src="img/pic2.jpg" alt="" /></li>
        <li><img src="img/pic3.jpg" alt="" /></li>
        <li><img src="img/pic4.jpg" alt="" /></li>
      </ul>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let tata = document.getElementById("imgL").querySelectorAll("li");
        let dada = document.getElementById("bigimg");
        tata.forEach((element) => {
          element.addEventListener("mouseover", function () {
            const img = this.querySelector("img").src;
            dada.src = img;
          });
        });
        dada.addEventListener("mousemove", function (e) {
          x = e.offsetX;
          y = e.offsetY;
          console.log(x, y);
        });
      });
    </script>
  </body>
</html>
