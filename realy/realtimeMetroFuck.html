    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(to bottom right, #75daec, #9755da);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }
      .app-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.26);
        overflow: hidden;
      }
      .map-container {
        position: relative;
        width: 100%;
        padding-bottom: 75%;
        height: 0;
        overflow: hidden;
        border-bottom: 1px solid #e2e8f0;
      }
      .metro-map-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .station-hotspot {
        position: absolute;
        width: 20px;
        height: 20px;
        background-color: rgba(6, 91, 248, 0.3);
        border-radius: 50%;
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: background-color 0.2s ease-in-out;
        z-index: 10;
      }
      .station-hotspot:hover {
        background-color: rgba(255, 0, 0, 0.6);
      }
      .info-panel {
        width: 100%;
        padding: 24px;
        background-color: #f8fafc;
        border-top: 1px solid #e2e8f0;
      }
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        border-radius: 12px;
      }
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 768px) {
        .app-container {
          flex-direction: row;
          align-items: flex-start;
          max-width: 1400px;
        }
        .map-container {
          width: 70%;
          padding-bottom: 52.5%;
          border-right: 1px solid #e2e8f0;
          border-bottom: none;
        }
        .info-panel {
          width: 30%;
          padding: 32px;
          border-top: none;
        }
      }
    </style>

      const subwayLineMap = {
        1001: "1호선",

      function getArrivalStatus(arvlCd) {
        switch (arvlCd) {
          case "0":
            return "진입";

            return "도착";

          case "99":
            return "운행중";
          default:
            return "(Unknown)";
        }
      }

      // --- Fetch Real-time Subway Data from Seoul API ---
      async function fetchRealtimeSubwayData(stationKoreanName) {
        const encodedStationName = encodeURIComponent(stationKoreanName);
        let response = null;
        let xmlText = null;
        let errorOccurred = false;

        for (let i = 0; i < SEOUL_API_KEYS.length; i++) {
          const currentApiKey = SEOUL_API_KEYS[i];
          const apiUrl = `http://swopenapi.seoul.go.kr/api/subway/${currentApiKey}/xml/realtimeStationArrival/0/6/${encodedStationName}`;

          console.log(`Attempting fetch with API Key ${i + 1}: ${apiUrl}`);

          try {
            response = await fetch(apiUrl);
            if (response.ok) {
              xmlText = await response.text();
              errorOccurred = false; // Reset error flag on successful fetch
              break; // Exit loop on successful response
            } else {
              console.error(
                `API Key ${i + 1} failed with status: ${response.status}`
              );
              errorOccurred = true;
            }
          } catch (error) {
            console.error(`Network error with API Key ${i + 1}:`, error);
            errorOccurred = true;
          }
        }

        if (errorOccurred || !xmlText) {
          return {
            arrivals: [],
            alerts: [
              {
                type: "error",
                message:
                  "모든 API 키 시도 실패 또는 네트워크 오류. (All API key attempts failed or network error.)",
              },
            ],
          };
        }

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "application/xml");

        const arrivals = [];
        const errorMessageElement = xmlDoc.getElementsByTagName("message")[0];
        const errorMessage = errorMessageElement
          ? errorMessageElement.textContent
          : null;

        if (errorMessage && errorMessage.includes("KEY_ERROR")) {
          console.error(
            "Seoul API Key Error (after all retries):",
            errorMessage
          );
          return {
            arrivals: [],
            alerts: [
              {
                type: "error",
                message:
                  "API 키 오류 또는 유효하지 않은 역 이름. (API Key error or invalid station name.)",
              },
            ],
          };
        }
        if (errorMessage && errorMessage.includes("INFO-200")) {
          return {
            arrivals: [],
            alerts: [
              {
                type: "info",
                message:
                  "현재 이 역에 대한 실시간 데이터가 없습니다. (No real-time data for this station at the moment.)",
              },
            ],
          };
        }

        const rows = xmlDoc.getElementsByTagName("row");

        if (rows.length === 0) {
          return {
            arrivals: [],
            alerts: [
              {
                type: "info",
                message:
                  "현재 이 역에 대한 실시간 데이터가 없습니다. (No real-time data for this station at the moment.)",
              },
            ],
          };
        }

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const subwayId =
            row.getElementsByTagName("subwayId")[0]?.textContent || "";
          const trainLineNm =
            row.getElementsByTagName("trainLineNm")[0]?.textContent || "N/A";
          const arvlMsg2 =
            row.getElementsByTagName("arvlMsg2")[0]?.textContent || "N/A";
          const arvlMsg3 =
            row.getElementsByTagName("arvlMsg3")[0]?.textContent || "";
          const arvlCd =
            row.getElementsByTagName("arvlCd")[0]?.textContent || "N/A";

          const lineDisplayName = subwayLineMap[subwayId] || `Line ${subwayId}`;

          let destination = arvlMsg3;
          if (
            !destination ||
            destination === "N/A" ||
            destination.trim() === ""
          ) {
            if (trainLineNm.includes("행")) {
              destination = trainLineNm.split("행")[0] + "행";
            } else if (trainLineNm.includes("방면")) {
              destination = trainLineNm.split("방면")[0] + "방면";
            } else if (trainLineNm.includes("-")) {
              const parts = trainLineNm.split("-");
              if (parts.length > 1) {
                destination = parts[parts.length - 1].trim();
              }
            } else {
              destination = trainLineNm;
            }
          }

          arrivals.push({
            line: lineDisplayName,
            destination: destination,
            time: arvlMsg2,
            status: getArrivalStatus(arvlCd),
          });
        }
        return { arrivals: arrivals, alerts: [] };
      }

      // --- Setup Hotspots ---
      function setupMapHotspots() {
        stations.forEach((station) => {
          const hotspot = document.createElement("div");
          hotspot.classList.add("station-hotspot");
          hotspot.dataset.stationId = station.id;
          hotspot.style.left = `${station.x}%`;
          hotspot.style.top = `${station.y}%`;
          hotspot.title = `${station.name} (${station.chineseName})`;
          hotspot.addEventListener("click", () =>
            displayStationInfo(station.id)
          );
          mapContainer.appendChild(hotspot);
        });
      }

      // --- Display Station Information ---
      async function displayStationInfo(stationId) {
        stationDetailsDiv.innerHTML = "";
        llmInfoDiv.classList.add("hidden");
        loadingIndicator.classList.remove("hidden");

        const station = stations.find((s) => s.id === stationId);

        if (!station) {
          stationDetailsDiv.innerHTML =
            '<p class="text-red-500">Station not found.</p>';
          loadingIndicator.classList.add("hidden");
          return;
        }

        let htmlContent = `
                <h3 class="text-xl font-semibold text-gray-900 mb-2">${
                  station.name
                } (${station.chineseName})</h3>
                <p class="text-sm text-gray-600 mb-4">Lines: ${station.lines.join(
                  ", "
                )}</p>
                <div class="space-y-3">
            `;

        const realTimeData = await fetchRealtimeSubwayData(station.koreanName);

        if (
          realTimeData &&
          realTimeData.arrivals &&
          realTimeData.arrivals.length > 0
        ) {
          htmlContent += `<h4 class="font-medium text-gray-800">도착 정보: (Upcoming Arrivals):</h4>`;
          realTimeData.arrivals.forEach((arrival) => {
            htmlContent += `
                        <div class="flex items-center justify-between p-2 bg-white rounded-md shadow-sm">
                            <span class="text-sm font-semibold whitespace-nowrap overflow-hidden text-ellipsis">${arrival.line} - ${arrival.destination}</span>
                            <span class="text-sm text-blue-600 whitespace-nowrap overflow-hidden text-ellipsis">${arrival.time}</span>
                        </div>
                    `;
          });
        } else {
          htmlContent += `<p class="text-sm text-gray-500">도착 정보 없음. (No upcoming arrivals reported.)</p>`;
        }

        if (
          realTimeData &&
          realTimeData.alerts &&
          realTimeData.alerts.length > 0
        ) {
          htmlContent += `<h4 class="font-medium text-gray-800 mt-4">알림: (Alerts):</h4>`;
          realTimeData.alerts.forEach((alert) => {
            const alertColor =
              alert.type === "warning"
                ? "bg-yellow-100 text-yellow-800"
                : alert.type === "error"
                ? "bg-red-100 text-red-800"
                : "bg-blue-100 text-blue-800";
            htmlContent += `
                        <div class="p-2 text-sm rounded-md ${alertColor}">
                            <strong>${alert.type.toUpperCase()}:</strong> ${
              alert.message
            }
                        </div>
                    `;
          });
        } else {
          htmlContent += `<p class="text-sm text-gray-500">다행이도 다른 알람은 없네요</p>`;
        }

        htmlContent += `</div>`;
        stationDetailsDiv.innerHTML = htmlContent;
        loadingIndicator.classList.add("hidden");

        await fetchLlmInfo(station.name);
      }

      // --- LLM Integration Function ---
      async function fetchLlmInfo(stationName) {
        llmTextP.textContent =
          "흥미로운 사실 생성 중... (Generating a fun fact...)";
        llmInfoDiv.classList.remove("hidden");

        try {
          let chatHistory = [];
          const prompt = `Provide a very short, interesting fact or historical tidbit about ${stationName} metro station in Seoul, South Korea. Keep it to one sentence in korean.`;
          chatHistory.push({ role: "user", parts: [{ text: prompt }] });
          const payload = { contents: chatHistory };
          const apiKey = "AIzaSyDd1DkQLag7vD9WjYGTi9LQAjgXTRAkZjo";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (
            result.candidates &&
            result.candidates.length > 0 &&
            result.candidates[0].content &&
            result.candidates[0].content.parts &&
            result.candidates[0].content.parts.length > 0
          ) {
            const text = result.candidates[0].content.parts[0].text;
            llmTextP.textContent = text;
          } else {
            llmTextP.textContent =
              "추가 정보를 가져올 수 없습니다. (Could not retrieve additional info.)";
            console.error("LLM response structure unexpected:", result);
          }
        } catch (error) {
          llmTextP.textContent =
            "추가 정보를 로드하지 못했습니다. (Failed to load additional info.)";
          console.error("Error fetching LLM info:", error);
        }
      }
    </script>
  </body>
</html>
