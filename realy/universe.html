<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas with Fading Circles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        overflow: hidden;
      }

      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        mask-image: radial-gradient(circle_at_top, #000000, #ffffff);
      }

      .star-canvas {
        position: absolute;
        inset: 0;
        display: block;
        z-index: 0;
        color: rgba(9, 9, 32, 0.719);
      }
    </style>
  </head>
  <body class="bg-gray-900">
    <div id="container">
      <canvas class="star-canvas"></canvas>
    </div>
    <script>
      const canvas = document.querySelector(".star-canvas");
      const ctx = canvas.getContext("2d");
      let circles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createCircle() {
        circles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random(),
          opacity: 0,
          fadeSpeed: 0.01 + Math.random() * 0.01,
          growthSpeed: 0.01 + Math.random() * 0.01,
          maxRadius: Math.random() * 8,
          state: "growing",
        });
      }

      function drawCircles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        circles.forEach((circle, index) => {
          if (circle.state === "growing") {
            if (circle.opacity < 1) {
              circle.opacity += circle.fadeSpeed;
            }
            if (circle.radius < circle.maxRadius) {
              circle.radius += circle.growthSpeed;
            } else {
              circle.radius = circle.maxRadius;
              circle.state = "fading";
            }
          } else if (circle.state === "fading") {
            circle.opacity -= circle.fadeSpeed;
            if (circle.opacity <= 0) {
              circles.splice(index, 1);
              return; // Important: Exit current iteration after removing
            }
          }

          const gradient = ctx.createRadialGradient(
            circle.x,
            circle.y,
            0,
            circle.x,
            circle.y,
            circle.radius
          );
          gradient.addColorStop(0, `rgba(255,255,255,${circle.opacity * 0.8})`);
          gradient.addColorStop(1, `rgba(255,255,255,0)`);

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function animate() {
        if (circles.length < 80) {
          createCircle();
        }
        drawCircles();
        requestAnimationFrame(animate);
      }

      resizeCanvas();
      animate();

      window.addEventListener("resize", resizeCanvas);
    </script>
  </body>
</html>
