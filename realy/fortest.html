<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>포문 제곱 구하기</h1>
    <div id="for"></div>
    <h1>포오프</h1>
    <div id="forOf"></div>
    <h1>포이치</h1>
    <div id="forEach"></div>
    <h1>로꾸꺼!</h1>
    <div id="forReverse"></div>
    <script>
      const dada = "mama,baba,gege,jiejie,holybeam,ramen,delightfull!";
      const caca = dada.split(",");
      const haha = caca.reverse();
      console.log();

      for (const element of caca) {
        document.getElementById("forOf").innerHTML += `${element} </br>`;
      }
      let i = 0;
      let sum = 0;
      caca.forEach((element) => {
        i++;
        sum += i;
        document.getElementById(
          "forEach"
        ).innerHTML += `${i} .${element} </br>`;
        document.getElementById("for").innerHTML += `${i} 의 제곱은 ${
          i * i
        } 입네다~ </br>`;
      });
      console.log(sum);
      for (let index = 0; index < haha.length; index++) {
        const element = haha[index];
        document.getElementById("forReverse").innerHTML += `${
          index + 1
        }. ${element} </br>`;
      }
    </script>
  </body>
</html>
