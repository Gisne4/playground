      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #e0e0e0;
        margin: 0;
        overflow: hidden; /* Prevent scrollbars if content slightly exceeds viewport */
      }

      #app-container {
        display: flex;
        width: 1920px; /* Match canvas width */
        height: 1080px; /* Match canvas height */
        background-color: #fff;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        position: relative; /* For tooltip positioning */
      }

      #map-container {
        position: relative;
        flex-grow: 1; /* Takes up available space */
        background-color: #f8f8f8; /* Canvas background matches this */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* Ensure canvas stays within bounds */
      }

      #subwayCanvas {
        border: 1px solid #ccc;
        display: block; /* Remove extra space below canvas */
      }

      #sidebar {
        width: 400px; /* Adjust sidebar width as needed */
        background-color: #f0f0f0;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto; /* Enable scrolling for subway info */
        border-left: 1px solid #ccc;
      }

      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 20px;
      }

      h2 {
        color: #555;
        margin-top: 0;
        border-bottom: 1px solid #ddd;
        padding-bottom: 5px;
        margin-bottom: 15px;
      }

      #subwayInfo {
        font-size: 14px;
        color: #333;
      }

      .info-message {
        color: #666;
        text-align: center;
        padding: 20px;
      }

      .loading-message {
        color: #007bff;
        text-align: center;
        padding: 20px;
      }

      .error-message {
        color: #dc3545;
        text-align: center;
        padding: 20px;
        font-weight: bold;
      }

      .subway-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px dashed #eee;
      }

      .subway-line:last-child {
        border-bottom: none;
      }

      .line-info {
        flex-grow: 1;
      }

      .line-name {
        font-weight: bold;
        color: #000;
        margin-bottom: 5px;
      }

      .status-msg {
        font-weight: bold;
        color: #28a745; /* Green for general status */
        flex-shrink: 0; /* Don't shrink status message */
        text-align: right;
        margin-left: 10px;
      }

      .arrival-msg {
        font-weight: bold;
        color: #dc3545; /* Red for arriving/departing */
        flex-shrink: 0;
        text-align: right;
        margin-left: 10px;
      }

      #canvasTooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 5px 8px;
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none; /* Allows mouse events to pass through to canvas */
        display: none; /* Hidden by default */
        transform: translate(-50%, -100%); /* Center horizontally, move up */
        white-space: nowrap; /* Prevent text wrapping */
        z-index: 100;
      }
    </style>
  </head>

            "굴포천",
            "부평구청",
            "산곡",
            "석남",
          ],
        ],
        8: [
          [
            "암사",
            "천호",
            "강동구청",
            "몽촌토성",
            "잠실",
            "석촌",
            "송파",
            "가락시장",
            "문정",
            "장지",
            "복정",
            "산성",
            "남한산성입구",
            "단대오거리",
            "신흥",
            "수진",
            "모란",
          ],
        ],
      };

      document.addEventListener("DOMContentLoaded", () => {
        drawMapAndStations(); // Initial draw without highlight
        fetchSubwayData(); // Start background fetching for map
        // Refresh map data every 30 seconds
        setInterval(fetchSubwayData, 30000);
      });

      // Function to draw the map lines and stations
      function drawMapAndStations(highlightedStation = null) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f8f8f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw all subway lines
        for (const lineId in allLinePaths) {
          // Changed lineNum to lineId for clarity
          const color = LINE_COLORS[lineId];
          if (!color) {
            console.warn(`Color not defined for line ID: ${lineId}`);
            continue;
          }
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;

          allLinePaths[lineId].forEach((segment) => {
            ctx.beginPath();
            if (segment.length > 0) {
              const startCoords = allStationCoordinates[segment[0]];
              if (startCoords) {
                ctx.moveTo(startCoords.x, startCoords.y);
                for (let i = 1; i < segment.length; i++) {
                  const nextCoords = allStationCoordinates[segment[i]];
                  if (nextCoords) {
                    ctx.lineTo(nextCoords.x, nextCoords.y);
                  }
                }
              }
            }
            ctx.stroke();
          });
        }

        // Draw all stations and their names
        ctx.font = "10px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (const stationName in allStationCoordinates) {
          const coords = allStationCoordinates[stationName];

          // Draw station dot
          ctx.beginPath();
          ctx.arc(coords.x, coords.y, STATION_DOT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = "white"; // White dot
          ctx.fill();

          // Draw border color based on the first line or highlight
          if (highlightedStation && stationName === highlightedStation) {
            ctx.strokeStyle = "red"; // Highlight color
            ctx.lineWidth = 3;
          } else if (coords.lines && coords.lines.length > 0) {
            // Use the color of the first line the station belongs to
            const firstLineId = coords.lines[0];
            ctx.strokeStyle = LINE_COLORS[firstLineId] || STATION_DOT_COLOR; // Use actual lineId
            ctx.lineWidth = 1.5;
          } else {
            ctx.strokeStyle = STATION_DOT_COLOR;
            ctx.lineWidth = 1.5;
          }
          ctx.stroke();

          // Draw station name
          ctx.fillStyle = STATION_TEXT_COLOR;
          ctx.fillText(
            stationName,
            coords.x,
            coords.y + STATION_DOT_RADIUS + 8
          );
        }
      }

      // Draws train indicators on top of the map
      function drawTrainIndicators() {
        // Redraw map elements and stations with the current selected station highlighted
        drawMapAndStations(selectedStationName);

        trainsOnMap = []; // Clear previous train positions for hover detection

        currentAllTrainData.forEach((train) => {
          const { subwayId, arvlCd, statnNm, arvlMsg2, arvlMsg3, trainLineNm } =
            train;

          let stationToMark = arvlMsg3; // The station where the train is currently located
          // Fallback to statnNm if arvlMsg3 is not specific or empty
          if (
            !stationToMark ||
            stationToMark === "정보 없음" ||
            stationToMark === "현재역"
          ) {
            stationToMark = statnNm;
          }

          const coords = allStationCoordinates[stationToMark];

          if (coords) {
            const radius = 6;
            let color = "gray"; // Default for unknown status
            let borderColor = "white";

            // Use line color for train indicator background if available, otherwise generic
            const lineIndicatorColor =
              LINE_COLORS[subwayId] || "rgba(128, 128, 128, 0.7)";

            if (arvlCd === "1" || arvlCd === "2") {
              // Arrival/Departure at station
              color = "rgba(255, 0, 0, 0.8)"; // Red for arriving/departing
              borderColor = "black";
            } else if (arvlCd === "5") {
              // Arrived previous station (just before the current one)
              color = "rgba(255, 165, 0, 0.8)"; // Orange for previous station arrival
              borderColor = "black";
            } else if (arvlCd === "99") {
              // In operation (far away, usually means approaching)
              color = "rgba(0, 0, 255, 0.6)"; // Blue for far away (in operation)
              borderColor = "white";
            } else {
              // Other statuses, default to line color or gray
              color = lineIndicatorColor;
              borderColor = "white";
            }

            ctx.beginPath();
            ctx.arc(coords.x, coords.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            trainsOnMap.push({
              x: coords.x,
              y: coords.y,
              radius: radius,
              tooltipText: `${trainLineNm} (${
                lineMap[subwayId] || subwayId
              }) - ${arvlMsg2} (${arvlMsg3})`,
            });
          } else {
            // console.warn(`Coordinates not found for station: ${stationToMark} (Line ID: ${subwayId}). Train will not be displayed on map.`);
          }
        });
      }

      // --- Event Listeners ---
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        let hoveredTrain = null;
        for (const train of trainsOnMap) {
          const distance = Math.sqrt(
            (mouseX - train.x) ** 2 + (mouseY - train.y) ** 2
          );
          if (distance < train.radius) {
            hoveredTrain = train;
            break;
          }
        }

        if (hoveredTrain) {
          canvasTooltip.style.display = "block";
          // Position relative to the document, adjusted for scrolling
          canvasTooltip.style.left = `${e.pageX}px`;
          canvasTooltip.style.top = `${e.pageY - 10}px`; // Move up slightly
          canvasTooltip.textContent = hoveredTrain.tooltipText;
        } else {
          canvasTooltip.style.display = "none";
        }
      });

      canvas.addEventListener("mouseout", () => {
        canvasTooltip.style.display = "none";
      });

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        let clickedStation = null;
        for (const stationName in allStationCoordinates) {
          const coords = allStationCoordinates[stationName];
          // Check if click is within an expanded radius for easier clicking
          const distance = Math.sqrt(
            (clickX - coords.x) ** 2 + (clickY - coords.y) ** 2
          );
          if (distance < STATION_DOT_RADIUS + CLICK_TOLERANCE) {
            clickedStation = stationName;
            break;
          }
        }

        if (clickedStation) {
          selectedStationName = clickedStation; // Set the selected station
          fetchAndDisplayClickedStationInfo(selectedStationName); // Fetch and display info for this specific station
          drawTrainIndicators(); // Redraw map with highlight and trains
        } else {
          selectedStationName = null; // No station selected
          document.getElementById("subwayInfo").innerHTML =
            '<p class="info-message">지하철역을 클릭하면 실시간 도착 정보가 표시됩니다.</p>';
          drawTrainIndicators(); // Redraw map without highlight
        }
      });

      // --- Data Fetching and Processing ---

      // This function fetches data for ALL stations in STATION_NAMES (for map display)
      async function fetchSubwayData() {
        try {
          // Only show loading message for map update if no specific station is selected
          if (selectedStationName === null) {
            document.getElementById("subwayInfo").innerHTML =
              '<p class="info-message">실시간 지하철 도착 정보를 불러오는 중... (지도 업데이트)</p>';
          }

          // Filter out duplicate station names before fetching to reduce redundant API calls
          const uniqueStationNames = [...new Set(STATION_NAMES)];

          const fetchPromises = uniqueStationNames.map((stationName) => {
            const endpoint = `http://swopenapi.seoul.go.kr/api/subway/${API_KEY}/xml/realtimeStationArrival/0/20/${encodeURIComponent(
              stationName
            )}`;
            return fetch(endpoint)
              .then((response) => {
                if (!response.ok) {
                  return response.text().then((text) => {
                    throw new Error(
                      `HTTP error! Status: ${
                        response.status
                      } for ${stationName}. API message: ${text.substring(
                        0,
                        100
                      )}...`
                    );
                  });
                }
                return response.text();
              })
              .catch((error) => {
                console.error(`Error fetching data for ${stationName}:`, error);
                return null; // Return null for failed fetches to allow Promise.all to succeed
              });
          });

          const allXmlResponses = await Promise.all(fetchPromises);
          let newAllTrainData = [];

          allXmlResponses.forEach((xmlText) => {
            if (xmlText) {
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");

              const resultCode =
                xmlDoc.getElementsByTagName("code")[0]?.textContent;
              if (resultCode && resultCode !== "INFO-000") {
                // console.warn(`API returned error for some station: ${resultCode}, Message: ${xmlDoc.getElementsByTagName('message')[0]?.textContent}`);
                return; // Skip this XML if it has an error
              }

              const rows = xmlDoc.getElementsByTagName("row");
              for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const train = {
                  trainLineNm:
                    row.getElementsByTagName("trainLineNm")[0]?.textContent ||
                    "정보 없음",
                  arvlMsg2:
                    row.getElementsByTagName("arvlMsg2")[0]?.textContent ||
                    "정보 없음",
                  arvlMsg3:
                    row.getElementsByTagName("arvlMsg3")[0]?.textContent || "", // Current station where train is
                  subwayId:
                    row.getElementsByTagName("subwayId")[0]?.textContent,
                  btrainNo:
                    row.getElementsByTagName("btrainNo")[0]?.textContent,
                  recptnDt:
                    row.getElementsByTagName("recptnDt")[0]?.textContent,
                  updnLine:
                    row.getElementsByTagName("updnLine")[0]?.textContent,
                  statnNm: row.getElementsByTagName("statnNm")[0]?.textContent, // Target station for arrival info
                  arvlCd: row.getElementsByTagName("arvlCd")[0]?.textContent,
                  barvlDt:
                    row.getElementsByTagName("barvlDt")[0]?.textContent ||
                    "N/A",
                };
                newAllTrainData.push(train);
              }
            }
          });

          currentAllTrainData = newAllTrainData; // Update global data cache for map
          drawTrainIndicators(); // Redraw trains on map

          // If a station was already selected, refresh its info display using the newly fetched data
          if (selectedStationName) {
            displayStationInfo(selectedStationName, currentAllTrainData); // Pass currentAllTrainData
          }
        } catch (error) {
          console.error("Error fetching subway data for map:", error);
          if (selectedStationName === null) {
            document.getElementById("subwayInfo").innerHTML = `
                                <p class="error-message">지도 데이터 업데이트 실패: ${error.message}</p>
                            `;
          }
        }
      }

      // Function to fetch and display data for a SINGLE clicked station
      async function fetchAndDisplayClickedStationInfo(stationName) {
        const subwayInfoDiv = document.getElementById("subwayInfo");
        subwayInfoDiv.innerHTML = `<h2>${stationName}역 실시간 도착 정보</h2><p class="loading-message">정보를 불러오는 중...</p>`;

        try {
          const endpoint = `http://swopenapi.seoul.go.kr/api/subway/${API_KEY}/xml/realtimeStationArrival/0/20/${encodeURIComponent(
            stationName
          )}`;
          const response = await fetch(endpoint);

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(
              `HTTP error! Status: ${
                response.status
              }. API message: ${errorText.substring(0, 100)}...`
            );
          }

          const xmlText = await response.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, "text/xml");

          const resultCode =
            xmlDoc.getElementsByTagName("code")[0]?.textContent;
          const developerMessage =
            xmlDoc.getElementsByTagName("developerMessage")[0]?.textContent;

          if (resultCode && resultCode !== "INFO-000") {
            subwayInfoDiv.innerHTML = `<h2>${stationName}역 실시간 도착 정보</h2><p class="error-message">API 오류 발생: ${resultCode}<br>${
              developerMessage || "알 수 없는 오류"
            }</p>`;
            console.error(
              "API returned an error code for clicked station:",
              resultCode,
              developerMessage
            );
            return;
          }

          const rows = xmlDoc.getElementsByTagName("row");
          let clickedStationTrainData = [];

          if (rows.length === 0) {
            subwayInfoDiv.innerHTML = `<h2>${stationName}역 실시간 도착 정보</h2><p class="info-message">현재 ${stationName}역에 대한 도착 정보가 없습니다.</p>`;
            return;
          }

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const train = {
              trainLineNm:
                row.getElementsByTagName("trainLineNm")[0]?.textContent ||
                "정보 없음",
              arvlMsg2:
                row.getElementsByTagName("arvlMsg2")[0]?.textContent ||
                "정보 없음",
              arvlMsg3:
                row.getElementsByTagName("arvlMsg3")[0]?.textContent || "",
              subwayId: row.getElementsByTagName("subwayId")[0]?.textContent,
              btrainNo: row.getElementsByTagName("btrainNo")[0]?.textContent,
              recptnDt: row.getElementsByTagName("recptnDt")[0]?.textContent,
              updnLine: row.getElementsByTagName("updnLine")[0]?.textContent,
              statnNm: row.getElementsByTagName("statnNm")[0]?.textContent,
              arvlCd: row.getElementsByTagName("arvlCd")[0]?.textContent,
              barvlDt:
                row.getElementsByTagName("barvlDt")[0]?.textContent || "N/A",
            };
            clickedStationTrainData.push(train);
          }

          // Display the fetched data for the clicked station
          displayStationInfo(stationName, clickedStationTrainData);
        } catch (error) {
          console.error(
            `Error fetching data for clicked station ${stationName}:`,
            error
          );
          subwayInfoDiv.innerHTML = `<h2>${stationName}역 실시간 도착 정보</h2><p class="error-message">정보를 불러오는 데 실패했습니다: ${error.message}</p>`;
        }
      }

      const lineMap = {
        1001: "1호선",
        1002: "2호선",
        1003: "3호선",
        1004: "4호선",
        1005: "5호선",
        1006: "6호선",
        1007: "7호선",
        1008: "8호선",
        1063: "경의중앙선",
        1065: "공항철도",
        1075: "분당선",
        1077: "신분당선",
      };

      // Function to display info for a specific station (now takes data as argument)
      function displayStationInfo(stationName, dataToDisplay) {
        const subwayInfoDiv = document.getElementById("subwayInfo");
        subwayInfoDiv.innerHTML = `<h2>${stationName}역 실시간 도착 정보</h2>`;

        // Filter data where statnNm is the clicked station or arvlMsg3 indicates arrival at this station
        const stationTrains = dataToDisplay.filter(
          (train) =>
            train.statnNm === stationName ||
            train.arvlMsg3.includes(stationName) // Use includes for partial matches like "전역 진입" (entering previous station) or "도착" (arrived)
        );

        if (stationTrains.length === 0) {
          subwayInfoDiv.innerHTML += `<p class="info-message">현재 ${stationName}역에 대한 도착 정보가 없습니다.</p>`;
          return;
        }

        // Sort data for better readability: arriving/departing first, then by line, then by time
        stationTrains.sort((a, b) => {
          // Prioritize "도착" (arrived) or "출발" (departed)
          const aIsArrivingDeparting = a.arvlCd === "1" || a.arvlCd === "2";
          const bIsArrivingDeparting = b.arvlCd === "1" || b.arvlCd === "2";

          if (aIsArrivingDeparting && !bIsArrivingDeparting) return -1;
          if (!aIsArrivingDeparting && bIsArrivingDeparting) return 1;

          // Then sort by line number
          if (a.subwayId !== b.subwayId) {
            return parseInt(a.subwayId) - parseInt(b.subwayId);
          }
          // Then sort by remaining arrival time (barvlDt)
          return parseInt(a.barvlDt) - parseInt(b.barvlDt);
        });

        // Use a Set to track unique trains to avoid displaying duplicates (e.g., if API sends same train multiple times)
        const seenTrains = new Set();
        stationTrains.forEach((train) => {
          // A unique key for each train based on its ID, line, and status
          const uniqueKey = `${train.btrainNo}-${train.subwayId}-${train.updnLine}-${train.arvlMsg2}`;

          if (!seenTrains.has(uniqueKey)) {
            seenTrains.add(uniqueKey);

            let lineNameDisplay = train.trainLineNm;
            if (lineMap[train.subwayId]) {
              // Prepend the common line name (e.g., "1호선") for clarity
              lineNameDisplay = `${lineMap[train.subwayId]} (${
                train.trainLineNm
              })`;
            }

            const subwayLineDiv = document.createElement("div");
            subwayLineDiv.classList.add("subway-line");
            subwayLineDiv.innerHTML = `
                                <div class="line-info">
                                    <div class="line-name">${lineNameDisplay}</div>
                                    <div>방면: ${
                                      train.updnLine || "정보 없음"
                                    }</div>
                                    <div>현재 위치: ${
                                      train.arvlMsg3 || "알 수 없음"
                                    }</div>
                                </div>
                                <div class="${
                                  train.arvlMsg2.includes("도착") ||
                                  train.arvlMsg2.includes("출발")
                                    ? "arrival-msg"
                                    : "status-msg"
                                }">
                                    ${train.arvlMsg2}
                                    ${
                                      train.barvlDt !== "N/A" &&
                                      train.barvlDt !== "0"
                                        ? ` (약 ${train.barvlDt}초)`
                                        : ""
                                    }
                                </div>
                            `;
            subwayInfoDiv.appendChild(subwayLineDiv);
          }
        });
      }
    </script>
  </body>
</html>
