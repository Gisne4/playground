<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자리번호</title>
    <link rel="stylesheet" href="/css/nana.css" />
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="/js/nana.js"></script>
  </head>
  <body>
    <div class="nanaho">
      <ul>
        <li>
          <img src="/img/consub_1.png" alt="" />
          <h1>rider</h1>
        </li>
        <li>
          <img src="/img/consub_2.png" alt="" />
          <h1>tender</h1>
        </li>
        <li>
          <img src="/img/consub_3.png" alt="" />
          <h1>talker</h1>
        </li>
        <li>
          <img src="/img/consub_4.png" alt="" />
          <h1>bolder</h1>
        </li>
      </ul>
    </div>
    <div class="papa">
      <ul>
        <li>
          <img src="/img/consub_1.png" alt="" usemap="#dong" />
          <h1>rider</h1>
        </li>
        <li>
          <img src="/img/consub_2.png" alt="" usemap="#dong" />
          <h1>tender</h1>
        </li>
        <li>
          <img src="/img/consub_3.png" alt="" usemap="#dong" />
          <h1>talker</h1>
        </li>
        <li>
          <img src="/img/consub_4.png" alt="" usemap="#dong" />
          <h1>bolder</h1>
        </li>
        <map name="dong">
          <area shape="rect" coords="0, 0, 150, 100 " class="leftTop" alt="#" />
          <area
            shape="rect"
            coords="0,100,150 , 200 "
            class="leftBottom"
            alt="#"
          />
          <area
            shape="rect"
            coords="150, 0, 300, 100 "
            class="rightTop"
            alt="#"
          />
          <area
            shape="rect"
            coords="150, 100, 300, 200 "
            class="rightBottom"
            alt="#"
          />
        </map>
      </ul>
    </div>
  </body>
</html>
