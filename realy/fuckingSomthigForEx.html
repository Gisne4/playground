<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Animated Road</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: black;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.165.0/three.min.js"></script>
    <script src="https://unpkg.com/postprocessing@6.35.2/build/postprocessing.min.js"></script>
    <script>
      // --- Three.js Scene Classes ---

      /**
       * Manages the car lights on the road.
       */
      class CarLights {
        constructor(webgl, options, colors, speed, fade) {
          this.webgl = webgl;
          this.options = options;
          this.colors = colors;
          this.speed = speed;
          this.fade = fade;
        }

        init() {
          const options = this.options;
          // Create a basic curve for the light trail
          let curve = new THREE.LineCurve3(
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -1)
          );
          // Create a tube geometry based on the curve
          let geometry = new THREE.TubeGeometry(curve, 40, 1, 8, false);

          // Use InstancedBufferGeometry for efficient rendering of many lights
          let instanced = new THREE.InstancedBufferGeometry().copy(geometry);
          instanced.instanceCount = options.lightPairsPerRoadWay * 2; // Two lights per car

          let laneWidth = options.roadWidth / options.lanesPerRoad;

          let aOffset = []; // xyz offset for each instance
          let aMetrics = []; // radius, length, speed for each instance
          let aColor = []; // rgb color for each instance

          // Ensure colors are Three.Color objects
          let colors = this.colors;
          if (Array.isArray(colors)) {
            colors = colors.map((c) => new THREE.Color(c));
          } else {
            colors = new THREE.Color(colors);
          }

          // Populate instance attributes
          for (let i = 0; i < options.lightPairsPerRoadWay; i++) {
            let radius = random(options.carLightsRadius);
            let length = random(options.carLightsLength);
            let speed = random(this.speed);

            let carLane = i % options.lanesPerRoad;
            let laneX =
              carLane * laneWidth - options.roadWidth / 2 + laneWidth / 2;

            let carWidth = random(options.carWidthPercentage) * laneWidth;
            let carShiftX = random(options.carShiftX) * laneWidth;
            laneX += carShiftX;

            let offsetY = random(options.carFloorSeparation) + radius * 1.3;

            let offsetZ = -random(options.length);

            // Left light of the car
            aOffset.push(laneX - carWidth / 2);
            aOffset.push(offsetY);
            aOffset.push(offsetZ);

            // Right light of the car
            aOffset.push(laneX + carWidth / 2);
            aOffset.push(offsetY);
            aOffset.push(offsetZ);

            // Metrics for left light
            aMetrics.push(radius);
            aMetrics.push(length);
            aMetrics.push(speed);

            // Metrics for right light (same as left)
            aMetrics.push(radius);
            aMetrics.push(length);
            aMetrics.push(speed);

            // Color for left light
            let color = pickRandom(colors);
            aColor.push(color.r);
            aColor.push(color.g);
            aColor.push(color.b);

            // Color for right light (same as left)
            aColor.push(color.r);
            aColor.push(color.g);
            aColor.push(color.b);
          }

          // Set attributes on the instanced geometry
          instanced.setAttribute(
            "aOffset",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aOffset),
              3,
              false
            )
          );
          instanced.setAttribute(
            "aMetrics",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aMetrics),
              3,
              false
            )
          );
          instanced.setAttribute(
            "aColor",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aColor),
              3,
              false
            )
          );

          // Create a ShaderMaterial for custom rendering of car lights
          let material = new THREE.ShaderMaterial({
            fragmentShader: carLightsFragment,
            vertexShader: carLightsVertex,
            transparent: true, // Enable transparency for fading
            uniforms: Object.assign(
              {
                uTime: { value: 0 }, // Global time uniform
                uTravelLength: { value: options.length }, // Length of the road for looping
                uFade: { value: this.fade }, // Fade range for the lights
              },
              this.webgl.fogUniforms, // Pass fog uniforms
              options.distortion.uniforms // Pass distortion uniforms
            ),
          });

          // Inject the distortion function into the vertex shader
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
              "#include <getDistortion_vertex>",
              options.distortion.getDistortion
            );
          };

          // Create the mesh and add it to the scene
          let mesh = new THREE.Mesh(instanced, material);
          mesh.frustumCulled = false; // Prevent culling as lights might go off-screen but should still animate
          this.webgl.scene.add(mesh);
          this.mesh = mesh;
        }

        /**
         * Updates the car lights animation.
         * @param {number} time - Current animation time.
         */
        update(time) {
          this.mesh.material.uniforms.uTime.value = time;
        }
      }

      /**
       * Manages the light sticks on the side of the road.
       */
      class LightsSticks {
        constructor(webgl, options) {
          this.webgl = webgl;
          this.options = options;
        }

        init() {
          const options = this.options;
          const geometry = new THREE.PlaneGeometry(1, 1); // Simple plane for each stick
          let instanced = new THREE.InstancedBufferGeometry().copy(geometry);
          let totalSticks = options.totalSideLightSticks;
          instanced.instanceCount = totalSticks;

          let stickoffset = options.length / (totalSticks - 1);
          const aOffset = []; // Z offset for each instance
          const aColor = []; // RGB color for each instance
          const aMetrics = []; // Width and height for each instance

          // Ensure colors are Three.Color objects
          let colors = options.colors.sticks;
          if (Array.isArray(colors)) {
            colors = colors.map((c) => new THREE.Color(c));
          } else {
            colors = new THREE.Color(colors);
          }

          // Populate instance attributes
          for (let i = 0; i < totalSticks; i++) {
            let width = random(options.lightStickWidth);
            let height = random(options.lightStickHeight);
            // Distribute sticks along the road, adding some randomness
            aOffset.push(
              (i - 1) * stickoffset * 2 + stickoffset * Math.random()
            );

            // Assign a random color from the palette
            let color = pickRandom(colors);
            aColor.push(color.r);
            aColor.push(color.g);
            aColor.push(color.b);

            aMetrics.push(width);
            aMetrics.push(height);
          }

          // Set attributes on the instanced geometry
          instanced.setAttribute(
            "aOffset",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aOffset),
              1,
              false
            )
          );
          instanced.setAttribute(
            "aColor",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aColor),
              3,
              false
            )
          );
          instanced.setAttribute(
            "aMetrics",
            new THREE.InstancedBufferAttribute(
              new Float32Array(aMetrics),
              2,
              false
            )
          );

          // Create a ShaderMaterial for custom rendering of side sticks
          const material = new THREE.ShaderMaterial({
            fragmentShader: sideSticksFragment,
            vertexShader: sideSticksVertex,
            side: THREE.DoubleSide, // Render both sides of the plane
            uniforms: Object.assign(
              {
                uTravelLength: { value: options.length }, // Length of the road for looping
                uTime: { value: 0 }, // Global time uniform
              },
              this.webgl.fogUniforms, // Pass fog uniforms
              options.distortion.uniforms // Pass distortion uniforms
            ),
          });

          // Inject the distortion function into the vertex shader
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
              "#include <getDistortion_vertex>",
              options.distortion.getDistortion
            );
          };

          // Create the mesh and add it to the scene
          const mesh = new THREE.Mesh(instanced, material);
          mesh.frustumCulled = false; // Prevent culling
          this.webgl.scene.add(mesh);
          this.mesh = mesh;
        }

        /**
         * Updates the light sticks animation.
         * @param {number} time - Current animation time.
         */
        update(time) {
          this.mesh.material.uniforms.uTime.value = time;
        }
      }

      /**
       * Manages the road and island planes.
       */
      class Road {
        constructor(webgl, options) {
          this.webgl = webgl;
          this.options = options;
          this.uTime = { value: 0 }; // Time uniform specifically for the road shader
        }

        /**
         * Creates a plane for either the road or the island.
         * @param {boolean} isRoad - True if creating the road, false if creating the island.
         * @returns {THREE.Mesh} The created mesh.
         */
        createPlane(isRoad) {
          const options = this.options;
          let segments = 100; // Number of segments along the length for distortion
          const geometry = new THREE.PlaneGeometry(
            isRoad ? options.roadWidth : options.islandWidth,
            options.length,
            20, // Width segments
            segments // Height (length) segments
          );
          let uniforms = {
            uTravelLength: { value: options.length }, // Length of the road for looping
            uColor: {
              value: new THREE.Color(
                isRoad ? options.colors.roadColor : options.colors.islandColor
              ),
            },
            uTime: this.uTime, // Time uniform
          };

          // Add specific uniforms for the road if applicable
          if (isRoad) {
            uniforms = Object.assign(uniforms, {
              uLanes: { value: options.lanesPerRoad },
              uBrokenLinesColor: {
                value: new THREE.Color(options.colors.brokenLines),
              },
              uShoulderLinesColor: {
                value: new THREE.Color(options.colors.shoulderLines), // Fixed: Added closing bracket and missing uniform
              },
              uShoulderLinesWidthPercentage: {
                value: options.shoulderLinesWidthPercentage,
              },
              uBrokenLinesLengthPercentage: {
                value: options.brokenLinesLengthPercentage,
              },
              uBrokenLinesWidthPercentage: {
                value: options.brokenLinesWidthPercentage,
              },
            });
          }

          // Determine fragment and vertex shaders
          const fragmentShader = isRoad ? roadFragment : islandFragment;
          const vertexShader = roadVertex; // Both road and island use the same vertex shader for distortion

          const material = new THREE.ShaderMaterial({
            fragmentShader,
            vertexShader,
            uniforms: Object.assign(
              uniforms,
              this.webgl.fogUniforms, // Pass fog uniforms
              options.distortion.uniforms // Pass distortion uniforms
            ),
            side: THREE.DoubleSide,
          });

          // Inject the distortion function into the vertex shader
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
              "#include <getDistortion_vertex>",
              options.distortion.getDistortion
            );
          };

          const mesh = new THREE.Mesh(geometry, material);
          mesh.renderOrder = isRoad ? 1 : 0; // Render road on top of island
          return mesh;
        }

        init() {
          const road = this.createPlane(true);
          const island = this.createPlane(false);

          // Position the island slightly below the road
          island.position.y = -0.001; // Avoid Z-fighting by offsetting slightly
          this.webgl.scene.add(road);
          this.webgl.scene.add(island);

          this.roadMesh = road;
          this.islandMesh = island;
        }

        /**
         * Updates the road animation.
         * @param {number} time - Current animation time.
         */
        update(time) {
          this.uTime.value = time;
        }
      }

      // --- Main Application Initialization ---
      window.addEventListener("DOMContentLoaded", () => {
        // Destructure necessary classes from the global POSTPROCESSING object
        const {
          BloomEffect,
          EffectComposer,
          EffectPass,
          RenderPass,
          SMAAEffect,
          SMAAPreset,
        } = POSTPROCESSING;

        // --- Utility Functions ---

        /**
         * Normalizes a sine wave value to be between 0 and 1.
         * @param {number} val - The input value for the sine function.
         * @returns {number} The normalized sine wave value.
         */
        let nsin = (val) => Math.sin(val) * 0.5 + 0.5;

        /**
         * Generates a random number within a specified range or up to a base value.
         * @param {number | number[]} base - If an array [min, max], returns a random number between min and max. If a number, returns a random number between 0 and base.
         * @returns {number} A random number.
         */
        const random = (base) => {
          if (Array.isArray(base))
            return Math.random() * (base[1] - base[0]) + base[0];
          return Math.random() * base;
        };

        /**
         * Picks a random element from an array.
         * @param {Array<any>} arr - The array to pick from.
         * @returns {any} A random element from the array.
         */
        const pickRandom = (arr) => {
          if (Array.isArray(arr))
            return arr[Math.floor(Math.random() * arr.length)];
          return arr;
        };

        /**
         * Linearly interpolates between a current value and a target value.
         * @param {number} current - The current value.
         * @param {number} target - The target value.
         * @param {number} speed - The interpolation speed (0.0 to 1.0).
         * @param {number} limit - The minimum change required before interpolating.
         * @returns {number} The interpolated change.
         */
        function lerp(current, target, speed = 0.1, limit = 0.001) {
          let change = (target - current) * speed;
          if (Math.abs(change) < limit) {
            change = target - current;
          }
          return change;
        }

        /**
         * Resizes the WebGL renderer and composer to match the display size of the canvas.
         * @param {THREE.WebGLRenderer} renderer - The Three.js WebGL renderer.
         * @param {function} setSize - A callback function to set the composer's size.
         * @returns {boolean} True if the renderer was resized, false otherwise.
         */
        function resizeRendererToDisplaySize(renderer, setSize) {
          const canvas = renderer.domElement;
          const pixelRatio = window.devicePixelRatio;
          const width = (canvas.clientWidth * pixelRatio) | 0;
          const height = (canvas.clientHeight * pixelRatio) | 0;
          const needResize = canvas.width !== width || canvas.height !== height;
          if (needResize) {
            renderer.setSize(width, height, false);
            setSize(width, height, false); // Update composer size as well
          }
          return needResize;
        }

        // --- Distortion Definitions (Uniforms and GLSL Code) ---

        const mountainUniforms = {
          uFreq: { value: new THREE.Vector3(3, 6, 10) },
          uAmp: { value: new THREE.Vector3(30, 30, 20) },
        };

        const xyUniforms = {
          uFreq: { value: new THREE.Vector2(5, 2) },
          uAmp: { value: new THREE.Vector2(25, 15) },
        };

        const LongRaceUniforms = {
          uFreq: { value: new THREE.Vector2(2, 3) },
          uAmp: { value: new THREE.Vector2(35, 10) },
        };

        const turbulentUniforms = {
          uFreq: { value: new THREE.Vector4(4, 8, 8, 1) },
          uAmp: { value: new THREE.Vector4(25, 5, 10, 10) },
        };

        const deepUniforms = {
          uFreq: { value: new THREE.Vector2(4, 8) },
          uAmp: { value: new THREE.Vector2(10, 20) },
          uPowY: { value: new THREE.Vector2(20, 2) },
        };

        const distortion_uniforms = {
          uDistortionX: { value: new THREE.Vector2(80, 3) },
          uDistortionY: { value: new THREE.Vector2(-40, 2.5) },
        };

        // Default distortion vertex shader (used if no specific distortion is chosen)
        const distortion_vertex = `
            #define PI 3.14159265358979
            uniform vec2 uDistortionX;
            uniform vec2 uDistortionY;
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            vec3 getDistortion(float progress){
                progress = clamp(progress, 0., 1.);
                float xAmp = uDistortionX.r;
                float xFreq = uDistortionX.g;
                float yAmp = uDistortionY.r;
                float yFreq = uDistortionY.g;
                return vec3(
                    xAmp * nsin(progress * PI * xFreq - PI / 2.),
                    yAmp * nsin(progress * PI * yFreq - PI / 2.),
                    0.
                );
            }
        `;

        // Distortion configurations for various effects
        const distortions = {
          mountainDistortion: {
            uniforms: mountainUniforms,
            getDistortion: `
            uniform vec3 uAmp;
            uniform vec3 uFreq;
            #define PI 3.14159265358979
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            vec3 getDistortion(float progress){
                float movementProgressFix = 0.02;
                return vec3(
                    cos(progress * PI * uFreq.x + uTime) * uAmp.x - cos(movementProgressFix * PI * uFreq.x + uTime) * uAmp.x,
                    nsin(progress * PI * uFreq.y + uTime) * uAmp.y - nsin(movementProgressFix * PI * uFreq.y + uTime) * uAmp.y,
                    nsin(progress * PI * uFreq.z + uTime) * uAmp.z - nsin(movementProgressFix * PI * uFreq.z + uTime) * uAmp.z
                );
            }
        `,
            getJS: (progress, time) => {
              let movementProgressFix = 0.02;
              let uFreq = mountainUniforms.uFreq.value;
              let uAmp = mountainUniforms.uAmp.value;
              let distortion = new THREE.Vector3(
                Math.cos(progress * Math.PI * uFreq.x + time) * uAmp.x -
                  Math.cos(movementProgressFix * Math.PI * uFreq.x + time) *
                    uAmp.x,
                nsin(progress * Math.PI * uFreq.y + time) * uAmp.y -
                  nsin(movementProgressFix * Math.PI * uFreq.y + time) * uAmp.y,
                nsin(progress * Math.PI * uFreq.z + time) * uAmp.z -
                  nsin(movementProgressFix * Math.PI * uFreq.z + time) * uAmp.z
              );
              let lookAtAmp = new THREE.Vector3(2, 2, 2);
              let lookAtOffset = new THREE.Vector3(0, 0, -5);
              return distortion.multiply(lookAtAmp).add(lookAtOffset);
            },
          },
          xyDistortion: {
            uniforms: xyUniforms,
            getDistortion: `
            uniform vec2 uFreq;
            uniform vec2 uAmp;
            #define PI 3.14159265358979
            vec3 getDistortion(float progress){
                float movementProgressFix = 0.02;
                return vec3(
                    cos(progress * PI * uFreq.x + uTime) * uAmp.x - cos(movementProgressFix * PI * uFreq.x + uTime) * uAmp.x,
                    sin(progress * PI * uFreq.y + PI/2. + uTime) * uAmp.y - sin(movementProgressFix * PI * uFreq.y + PI/2. + uTime) * uAmp.y,
                    0.
                );
            }
        `,
            getJS: (progress, time) => {
              let movementProgressFix = 0.02;
              let uFreq = xyUniforms.uFreq.value;
              let uAmp = xyUniforms.uAmp.value;
              let distortion = new THREE.Vector3(
                Math.cos(progress * Math.PI * uFreq.x + time) * uAmp.x -
                  Math.cos(movementProgressFix * Math.PI * uFreq.x + time) *
                    uAmp.x,
                Math.sin(progress * Math.PI * uFreq.y + time + Math.PI / 2) *
                  uAmp.y -
                  Math.sin(
                    movementProgressFix * Math.PI * uFreq.y + time + Math.PI / 2
                  ) *
                    uAmp.y,
                0
              );
              let lookAtAmp = new THREE.Vector3(2, 0.4, 1);
              let lookAtOffset = new THREE.Vector3(0, 0, -3);
              return distortion.multiply(lookAtAmp).add(lookAtOffset);
            },
          },
          LongRaceDistortion: {
            uniforms: LongRaceUniforms,
            getDistortion: `
            uniform vec2 uFreq;
            uniform vec2 uAmp;
            #define PI 3.14159265358979
            vec3 getDistortion(float progress){
                float camProgress = 0.0125;
                return vec3(
                    sin(progress * PI * uFreq.x + uTime) * uAmp.x - sin(camProgress * PI * uFreq.x + uTime) * uAmp.x,
                    sin(progress * PI * uFreq.y + uTime) * uAmp.y - sin(camProgress * PI * uFreq.y + uTime) * uAmp.y,
                    0.
                );
            }
        `,
            getJS: (progress, time) => {
              let camProgress = 0.0125;
              let uFreq = LongRaceUniforms.uFreq.value;
              let uAmp = LongRaceUniforms.uAmp.value;
              let distortion = new THREE.Vector3(
                Math.sin(progress * Math.PI * uFreq.x + time) * uAmp.x -
                  Math.sin(camProgress * Math.PI * uFreq.x + time) * uAmp.x,
                Math.sin(progress * Math.PI * uFreq.y + time) * uAmp.y -
                  Math.sin(camProgress * Math.PI * uFreq.y + time) * uAmp.y,
                0
              );
              let lookAtAmp = new THREE.Vector3(1, 1, 0);
              let lookAtOffset = new THREE.Vector3(0, 0, -5);
              return distortion.multiply(lookAtAmp).add(lookAtOffset);
            },
          },
          turbulentDistortion: {
            uniforms: turbulentUniforms,
            getDistortion: `
            uniform vec4 uFreq;
            uniform vec4 uAmp;
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            #define PI 3.14159265358979
            float getDistortionX(float progress){
                return (
                    cos(PI * progress * uFreq.r + uTime) * uAmp.r +
                    pow(cos(PI * progress * uFreq.g + uTime * (uFreq.g / uFreq.r)), 2. ) * uAmp.g
                );
            }
            float getDistortionY(float progress){
                return (
                    -nsin(PI * progress * uFreq.b + uTime) * uAmp.b +
                    -pow(nsin(PI * progress * uFreq.a + uTime / (uFreq.b / uFreq.a)), 5.) * uAmp.a
                );
            }
            vec3 getDistortion(float progress){
                return vec3(
                    getDistortionX(progress) - getDistortionX(0.0125),
                    getDistortionY(progress) - getDistortionY(0.0125),
                    0.
                );
            }
        `,
            getJS: (progress, time) => {
              const uFreq = turbulentUniforms.uFreq.value;
              const uAmp = turbulentUniforms.uAmp.value;

              const getX = (p) =>
                Math.cos(Math.PI * p * uFreq.x + time) * uAmp.x +
                Math.pow(
                  Math.cos(Math.PI * p * uFreq.y + time * (uFreq.y / uFreq.x)),
                  2
                ) *
                  uAmp.y;

              const getY = (p) =>
                -nsin(Math.PI * p * uFreq.z + time) * uAmp.z -
                Math.pow(
                  nsin(Math.PI * p * uFreq.w + time / (uFreq.z / uFreq.w)),
                  5
                ) *
                  uAmp.w;

              let distortion = new THREE.Vector3(
                getX(progress) - getX(progress + 0.007),
                getY(progress) - getY(progress + 0.007),
                0
              );
              let lookAtAmp = new THREE.Vector3(-2, -5, 0);
              let lookAtOffset = new THREE.Vector3(0, 0, -10);
              return distortion.multiply(lookAtAmp).add(lookAtOffset);
            },
          },
          turbulentDistortionStill: {
            uniforms: turbulentUniforms,
            getDistortion: `
            uniform vec4 uFreq;
            uniform vec4 uAmp;
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            #define PI 3.14159265358979
            float getDistortionX(float progress){
                return (
                    cos(PI * progress * uFreq.r) * uAmp.r +
                    pow(cos(PI * progress * uFreq.g * (uFreq.g / uFreq.r)), 2. ) * uAmp.g
                );
            }
            float getDistortionY(float progress){
                return (
                    -nsin(PI * progress * uFreq.b) * uAmp.b +
                    -pow(nsin(PI * progress * uFreq.a / (uFreq.b / uFreq.a)), 5.) * uAmp.a
                );
            }
            vec3 getDistortion(float progress){
                return vec3(
                    getDistortionX(progress) - getDistortionX(0.02),
                    getDistortionY(progress) - getDistortionY(0.02),
                    0.
                );
            }
        `,
          },
          deepDistortionStill: {
            uniforms: deepUniforms,
            getDistortion: `
            uniform vec4 uFreq;
            uniform vec4 uAmp;
            uniform vec2 uPowY;
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            #define PI 3.14159265358979
            float getDistortionX(float progress){
                return (
                    sin(progress * PI * uFreq.x) * uAmp.x * 2.
                );
            }
            float getDistortionY(float progress){
                return (
                    pow(abs(progress * uPowY.x), uPowY.y) + sin(progress * PI * uFreq.y) * uAmp.y
                );
            }
            vec3 getDistortion(float progress){
                return vec3(
                    getDistortionX(progress) - getDistortionX(0.02),
                    getDistortionY(progress) - getDistortionY(0.05),
                    0.
                );
            }
        `,
          },
          deepDistortion: {
            uniforms: deepUniforms,
            getDistortion: `
            uniform vec4 uFreq;
            uniform vec4 uAmp;
            uniform vec2 uPowY;
            float nsin(float val){
                return sin(val) * 0.5 + 0.5;
            }
            #define PI 3.14159265358979
            float getDistortionX(float progress){
                return (
                    sin(progress * PI * uFreq.x + uTime) * uAmp.x
                );
            }
            float getDistortionY(float progress){
                return (
                    pow(abs(progress * uPowY.x), uPowY.y) + sin(progress * PI * uFreq.y + uTime) * uAmp.y
                );
            }
            vec3 getDistortion(float progress){
                return vec3(
                    getDistortionX(progress) - getDistortionX(0.02),
                    getDistortionY(progress) - getDistortionY(0.02),
                    0.
                );
            }
        `,
            getJS: (progress, time) => {
              const uFreq = deepUniforms.uFreq.value;
              const uAmp = deepUniforms.uAmp.value;
              const uPowY = deepUniforms.uPowY.value;

              const getX = (p) =>
                Math.sin(p * Math.PI * uFreq.x + time) * uAmp.x;
              const getY = (p) =>
                Math.pow(p * uPowY.x, uPowY.y) +
                Math.sin(p * Math.PI * uFreq.y + time) * uAmp.y;

              let distortion = new THREE.Vector3(
                getX(progress) - getX(progress + 0.01),
                getY(progress) - getY(progress + 0.01),
                0
              );
              let lookAtAmp = new THREE.Vector3(-2, -4, 0);
              let lookAtOffset = new THREE.Vector3(0, 0, -10);
              return distortion.multiply(lookAtAmp).add(lookAtOffset);
            },
          },
        };

        // --- Shader GLSL Code ---

        const carLightsFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            varying vec3 vColor;
            varying vec2 vUv;
            uniform vec2 uFade;
            void main() {
                vec3 color = vec3(vColor);
                float alpha = smoothstep(uFade.x, uFade.y, vUv.x);
                gl_FragColor = vec4(color, alpha);
                if (gl_FragColor.a < 0.0001) discard;
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

        const carLightsVertex = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_vertex"]}
            attribute vec3 aOffset;
            attribute vec3 aMetrics;
            attribute vec3 aColor;
            uniform float uTravelLength;
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vColor;
            #include <getDistortion_vertex>
            void main() {
                vec3 transformed = position.xyz;
                float radius = aMetrics.r;
                float myLength = aMetrics.g;
                float speed = aMetrics.b;

                transformed.xy *= radius;
                transformed.z *= myLength;

                transformed.z += myLength - mod(uTime * speed + aOffset.z, uTravelLength);
                transformed.xy += aOffset.xy;

                float progress = abs(transformed.z / uTravelLength);
                transformed.xyz += getDistortion(progress);

                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
                gl_Position = projectionMatrix * mvPosition;
                vUv = uv;
                vColor = aColor;
                ${THREE.ShaderChunk["fog_vertex"]}
            }
        `;

        const sideSticksVertex = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_vertex"]}
            attribute float aOffset;
            attribute vec3 aColor;
            attribute vec2 aMetrics;
            uniform float uTravelLength;
            uniform float uTime;
            varying vec3 vColor;
            mat4 rotationY( in float angle ) {
                return mat4(  cos(angle),   0,    sin(angle), 0,
                                0,    1.0,      0, 0,
                                -sin(angle),   0,    cos(angle), 0,
                                0,    0,        0,   1);
            }
            #include <getDistortion_vertex>
            void main(){
                vec3 transformed = position.xyz;
                float width = aMetrics.x;
                float height = aMetrics.y;

                transformed.xy *= vec2(width, height);
                float time = mod(uTime * 60. * 2. + aOffset, uTravelLength);

                transformed = (rotationY(3.14/2.) * vec4(transformed,1.)).xyz;

                transformed.z += - uTravelLength + time;

                float progress = abs(transformed.z / uTravelLength);
                transformed.xyz += getDistortion(progress);

                transformed.y += height / 2.;
                transformed.x += -width / 2.;
                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
                gl_Position = projectionMatrix * mvPosition;
                vColor = aColor;
                ${THREE.ShaderChunk["fog_vertex"]}
            }
        `;

        const sideSticksFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            varying vec3 vColor;
            void main(){
                vec3 color = vec3(vColor);
                gl_FragColor = vec4(color,1.);
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

        const roadVertex = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_vertex"]}
            uniform float uTime;
            uniform float uTravelLength;
            #include <getDistortion_vertex>
            varying float vZ;
            void main(){
                vec3 transformed = position.xyz;
                transformed.z = mod(transformed.z + uTime, uTravelLength) - uTravelLength / 2.;

                float progress = abs(transformed.z / uTravelLength);
                transformed.xyz += getDistortion(progress);

                vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.);
                gl_Position = projectionMatrix * mvPosition;
                vZ = transformed.z;
                ${THREE.ShaderChunk["fog_vertex"]}
            }
        `;

        const roadFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            uniform float uTravelLength;
            uniform float uLanes;
            uniform vec3 uBrokenLinesColor;
            uniform vec3 uShoulderLinesColor;
            uniform float uShoulderLinesWidthPercentage;
            uniform float uBrokenLinesLengthPercentage;
            uniform float uBrokenLinesWidthPercentage;
            uniform vec3 uColor;
            varying float vZ;

            void main(){
                vec3 color = uColor;
                float u = fract(vUv.x);
                float v = fract(vUv.y);

                float brokenLineLight = smoothstep(0.0, 0.05, abs(mod(vZ + uTravelLength / 2., uTravelLength / uBrokenLinesLengthPercentage) - uTravelLength / uBrokenLinesLengthPercentage / 2.));

                // Shoulder lines
                if (u < uShoulderLinesWidthPercentage || u > (1. - uShoulderLinesWidthPercentage)) {
                    color = mix(color, uShoulderLinesColor, 0.8);
                }
                // Broken lines
                if (
                    u > uShoulderLinesWidthPercentage &&
                    u < (1. - uShoulderLinesWidthPercentage) &&
                    (fract(u * uLanes) > (1. - uBrokenLinesWidthPercentage) || fract(u * uLanes) < uBrokenLinesWidthPercentage)
                ) {
                    color = mix(color, uBrokenLinesColor, brokenLineLight);
                }

                gl_FragColor = vec4(color,1.);
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

        const islandFragment = `
            #define USE_FOG;
            ${THREE.ShaderChunk["fog_pars_fragment"]}
            uniform vec3 uColor;
            void main(){
                vec3 color = uColor;
                gl_FragColor = vec4(color,1.);
                ${THREE.ShaderChunk["fog_fragment"]}
            }
        `;

        // --- Main Application Setup ---

        const WebGL = function () {
          const canvas = document.createElement("canvas");
          document.body.appendChild(canvas);

          const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            alpha: true,
          });
          renderer.setClearColor(0x000000, 0); // Transparent clear color
          renderer.setPixelRatio(window.devicePixelRatio);
          renderer.toneMapping = THREE.ACESFilmicToneMapping; // Modern tone mapping
          renderer.toneMappingExposure = 0.5; // Adjust exposure

          const scene = new THREE.Scene();
          scene.fog = new THREE.FogExp2(0x000000, 0.007); // Dark fog
          const fogUniforms = {
            fogColor: { value: new THREE.Color(scene.fog.color) },
            fogNear: { value: scene.fog.near },
            fogFar: { value: scene.fog.far },
            fogDensity: { value: scene.fog.density },
          };
          // Override default Three.js fog.
          // This allows custom shaders to use THREE.ShaderChunk['fog_pars_vertex'] and THREE.ShaderChunk['fog_vertex']
          // by manually passing fog uniforms.
          THREE.ShaderChunk["fog_pars_vertex"] = `
            #ifdef USE_FOG
                uniform vec3 fogColor;
                uniform float fogDensity;
                varying float vFogDepth;
            #endif
        `;
          THREE.ShaderChunk["fog_vertex"] = `
            #ifdef USE_FOG
                vFogDepth = gl_Position.z;
            #endif
        `;
          THREE.ShaderChunk["fog_pars_fragment"] = `
            #ifdef USE_FOG
                uniform vec3 fogColor;
                uniform float fogDensity;
                varying float vFogDepth;
            #endif
        `;
          THREE.ShaderChunk["fog_fragment"] = `
            #ifdef USE_FOG
                float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
                gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );
            #endif
        `;

          const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
          );
          camera.position.set(0, 5, -10); // Initial camera position
          camera.lookAt(0, 0, 0); // Look at the origin

          // Post-processing setup
          const composer = new EffectComposer(renderer);
          composer.addPass(new RenderPass(scene, camera));

          // Bloom effect for glowing lights
          const bloomEffect = new BloomEffect({
            luminanceThreshold: 0.1,
            luminanceSmoothing: 0.9,
            intensity: 3.0,
            radius: 0.5,
          });
          const smaaEffect = new SMAAEffect(
            SMAAPreset.HIGH,
            null,
            null,
            SMAAPreset.HIGH
          ); // Anti-aliasing

          composer.addPass(new EffectPass(camera, smaaEffect, bloomEffect));

          // Store common objects for other classes to access
          this.renderer = renderer;
          this.scene = scene;
          this.camera = camera;
          this.composer = composer;
          this.fogUniforms = fogUniforms;

          // Helper for composer resizing
          this.setComposerSize = (width, height) => {
            this.composer.setSize(width, height);
          };

          // Global render loop
          let lastTime = 0;
          const animate = (time) => {
            time *= 0.001; // convert to seconds
            const deltaTime = time - lastTime;
            lastTime = time;

            resizeRendererToDisplaySize(this.renderer, this.setComposerSize);

            // Update scene elements
            mainApp.update(time);

            // Update camera position to follow distortion
            if (mainApp.options.distortion.getJS) {
              const cameraProgress = Math.abs(
                camera.position.z / mainApp.options.length
              );
              const lookAtTarget = mainApp.options.distortion.getJS(
                cameraProgress,
                time
              );
              camera.lookAt(
                lookAtTarget.x,
                lookAtTarget.y,
                camera.position.z + lookAtTarget.z
              );
            } else {
              // If no JS distortion is provided, ensure camera looks straight ahead
              camera.lookAt(0, 0, camera.position.z - 5);
            }

            composer.render(deltaTime);

            requestAnimationFrame(animate);
          };
          requestAnimationFrame(animate);

          window.addEventListener("resize", () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
          });
        };

        // --- Main App Logic ---
        const mainApp = {
          webgl: null,
          carLights: null,
          lightSticks: null,
          road: null,
          options: {
            length: 500, // Length of the road
            roadWidth: 20,
            islandWidth: 3.8,
            lanesPerRoad: 2,
            carLightsRadius: [0.08, 0.12], // Min/max radius for car lights
            carLightsLength: [20, 40], // Min/max length for car light trails
            lightPairsPerRoadWay: 50, // Number of car light pairs per road
            carFloorSeparation: 0.5, // How high car lights are from road surface
            carWidthPercentage: 0.7, // Percentage of lane width occupied by car
            carShiftX: [-0.8, 0.8], // How much cars can shift within their lane
            lightStickWidth: [0.08, 0.15],
            lightStickHeight: [4, 8],
            totalSideLightSticks: 50,
            colors: {
              roadColor: "#080808",
              islandColor: "#080808",
              brokenLines: "#0A0A0A",
              shoulderLines: "white", // Adjusted to be visible against dark road
              carLights: ["#f272a0", "#b348d6", "#a0e9fd", "#e072a0"],
              sticks: "#d6a3b3",
            },
            // You can choose a distortion here:
            // distortion: distortions.mountainDistortion,
            // distortion: distortions.xyDistortion,
            distortion: distortions.LongRaceDistortion,
            // distortion: distortions.turbulentDistortion,
            // distortion: distortions.turbulentDistortionStill,
            // distortion: distortions.deepDistortionStill,
            // distortion: distortions.deepDistortion,
          },

          init() {
            this.webgl = new WebGL();

            this.carLights = new CarLights(
              this.webgl,
              this.options,
              this.options.colors.carLights,
              [0.8, 2], // speed range for car lights
              [0.4, 0.2] // fade range for car lights
            );
            this.carLights.init();

            this.lightSticks = new LightsSticks(this.webgl, this.options);
            this.lightSticks.init();

            this.road = new Road(this.webgl, this.options);
            this.road.init();
          },

          update(time) {
            this.carLights.update(time);
            this.lightSticks.update(time);
            this.road.update(time);
          },
        };

        mainApp.init(); // Initialize the main application
      });
    </script>
  </body>
