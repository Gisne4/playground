<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <section class="con01"></section>
    <section class="con02">
      <div class="textBox">
        <h2>요리 초보 가이드</h2>
        <p>요리 초보라면 ? 이것부터 보세요</p>
      </div>
      <ul class="list">
        <li class="a">
          <img src="img/122807947wmxz.jpg" alt="" />
        </li>
        <li class="b">
          <img src="img/143484265gqnl.jpg" alt="" />
        </li>
        <li class="c">
          <img src="img/153833541fseo.jpg" alt="" />
        </li>
        <li class="c">
          <img src="img/154187882vjzy.jpg" alt="" />
        </li>
        <li class="b">
          <img src="img/156589176roxn.jpg" alt="" />
        </li>
        <li class="c">
          <img src="img/164393262axve.jpg" alt="" />
        </li>
        <li class="a">
          <img src="img/165922472eupo.jpg" alt="" />
        </li>
      </ul>
    </section>
    <section class="con03"></section>
    <script>
      let list = gsap.utils.toArray(".con02 .list li");
      let listA = gsap.utils.toArray(".con02 .list li.a");
      let listB = gsap.utils.toArray(".con02 .list li.b");
      let listC = gsap.utils.toArray(".con02 .list li.c");
      gsap.to(list, {
        xPercent: -600,
        ease: "none",
        scrollTrigger: {
          trigger: ".con02",
          pin: true,
          scrub: 2,
          start: "center center",
          end: "100% 0%",
          markers: true,
        },
      });

      gsap.to(listA, {
        rotation: 50,
        scrollTrigger: {
          trigger: ".con02",
          scrub: 2,
          start: "center center",
          end: "100%",
        },
      });
      gsap.to(listB, {
        rotation: -50,
        scrollTrigger: {
          trigger: ".con02",
          scrub: 2,
          start: "center center",
          end: "100%",
        },
      });
      gsap.to(listC, {
        rotation: 30,
        scrollTrigger: {
          trigger: ".con02",
          scrub: 2,
          start: "center center",
          end: "100%",
        },
      });
    </script>
  </body>
</html>
