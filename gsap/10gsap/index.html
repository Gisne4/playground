<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div id="visual">
      <img src="img/main_visual_1.jpg" alt="" />
      <h2>
        <span>Our Story</span>우리의 삶이 건강해지고 당신의 비지니스가 더
        성장하는 스토리
      </h2>
    </div>
    <div id="container">
      <section class="infoProject">
        <div class="inner">
          <div class="imgBox"><img src="img/sec2_bg_300.jpg" alt="" /></div>
          <div class="textBox">
            <p class="title">푸드서비스</p>
            <p class="text">산업을 선도하는 혁신적 시도로 지켜옴</p>
            <p class="title">헬스케어 솔루션</p>
            <p class="text">식음을 넘어 고객의 건강 케어까지</p>
            <p class="title">식자재 유통</p>
            <p class="text">고객 F&B 비즈니스의 든든한 기반</p>
            <p class="title">360 솔루션</p>
            <p class="text">식음 비즈니스의 성장을 돕는</p>
          </div>
        </div>
      </section>
      <section class="concept">
        <div class="inner">
          <ul>
            <li class="imgBox">
              <img src="img/frontrunner_technology_img1.png" alt="" />
            </li>
            <li class="imgBox">
              <img src="img/frontrunner_technology_img2.png" alt="" />
            </li>
            <li class="imgBox">
              <img src="img/frontrunner_technology_img3.png" alt="" />
            </li>
          </ul>
          <div class="textBox space">
            <p class="title">
              미래형 사내식당을 한 눈에, <br /><strong
                >플래그십 스페이스</strong
              >
            </p>
            <p class="text">
              미래형 사내 식당을 구현한 이곳, '플래그십 스페이스'는 삼성
              웰스토리의 자동화, 개인화, 지능화, 솔루션을 적용해 미래 급식 운영
              모델의 표준을 제시합니다
            </p>
          </div>
          <ul class="solution">
            <li class="imgBox">
              <img src="img/solution_foodservice_img1.png" alt="" />
            </li>
            <li class="imgBox">
              <img src="img/frontrunner_technology_img2.png" alt="" />
            </li>
            <li class="imgBox">
              <img src="img/solution_foodservice_img3.png" alt="" />
            </li>
          </ul>
          <div class="textBox solution">
            <p class="title">트렌디한 미식 경험 메뉴 프로모션</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      gsap
        .timeline({
          scrollTrigger: {
            trigger: "#visual",
            start: "top top",
            end: "bottom top",
            scrub: 2,
            pin: true,
            // markers: true,
          },
        })
        .to(
          "#visual img",
          {
            scale: 0.4,
            opacity: 0.3,
            ease: "none",
            duration: 10,
          },
          5
        )
        .to("#visual h2", { opacity: 1, ease: "none", duration: 10 }, 5);

      gsap.utils.toArray(".imgBox").forEach((imgBox) => {
        gsap.timeline({
          scrollTrigger: {
            trigger: imgBox,
            start: "50% 100%",
            end: "100% 0%",
            scrub: 1,
            toggleClass: { targets: imgBox, className: "active" },
            // markers: true,
          },
        });
      });

      gsap.timeline({
        scrollTrigger: {
          trigger: ".infoProject .textBox",
          start: "40% 80%",
          end: "100% 0%",
          scrub: 1,
          toggleClass: {
            targets: ".infoProject .textBox",
            className: "active",
          },
          markers: true,
        },
      });
    </script>
  </body>
</html>
