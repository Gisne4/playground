<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <style>
      .box1 {
        width: 100px;
        height: 100px;
        background-color: orange;
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box1"></div>
    <script>
      gsap.fromTo(
        ".box1",
        { x: 0, opacity: 0, scale: 0 },
        { x: 500, opacity: 1, scale: 2, duration: 2, ease: "elastic.in" }
      );
    </script>
  </body>
</html>
