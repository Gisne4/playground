<!--
gsap은 웹에서 부드럽고 성능 좋은 애니메이션을 만들어주는 자바스크립트 라이브러리
- 빠르고 부드러운 애니메이션을 지원
- 코드가 간결하고 직관적임
- 다양한 브라우저와 호환

gsap.to() :: 현재상태에서 설정한 값으로 애니메이션 실행
gsap.from() :: 설정한 시작 값에서 현재 스타일로 자연스럽게 이동
gsap.fromto() :: 시작값에서 끝깞까지 지정해서 애니메이션 실행


<ease종류>
- elastic : 튕기는 효과
- bounce : 튕기는효과 
- slow : 천천히 시작
- power0 : 일정한 속도로 움직임


.out : 빠르게 시작하고 천천히 끝남
.in : 천천히 시작하고 빠르게 끝남
.inOut : 천천히 시작하고 천천히 끝남

- elastic.out
- bounce.out
