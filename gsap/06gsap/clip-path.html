<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 150px;
        height: 150px;
        background-color: #ccc;
        margin: 50px;
      }
      .box1 {
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      }
      .box2 {
        clip-path: circle(50% at center);
      }
      .box3 {
        clip-path: circle(50% at center);
        animation: shape 5s infinite;
      }
      @keyframes shape {
        0% {
        }
        100% {
          clip-path: inset(0% 0% 0% 0%);
        }
      }

      .box4 {
        animation: shape2 10s infinite;
        clip-path: inset(60% 60% 60% 60% round 30%);
      }
      @keyframes shape2 {
        0% {
        }
        100% {
          clip-path: inset(0% 0% 0% 0% round 0%);
        }
      }
    </style>
  </head>
  <body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
  </body>
</html>
